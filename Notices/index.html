<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اطلاعیه | شهدای گمنام شورابیل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #f8fafc; --bg2: #f1f5f9; --bg3: #e2e8f0;
      --primary: #0d9488; --primary-dark: #0f766e; --primary-light: #5eead4;
      --primary-rgb: 13, 148, 136; --dark: #0f172a; --text: #334155;
      --text-light: #94a3b8; --white: #ffffff; --card-bg: #ffffff;
      --card-border: #e2e8f0; --shadow: 4px 4px 0 #000000;
      --shadow-hover: 6px 6px 0 #000000;
      --shadow-sm: 2px 2px 0 #000000;
      --header-bg: #ffffff; --footer-bg: #ffffff;
      --overlay: rgba(13, 148, 136, 0.05);
      --logo-filter: none; --modal-bg: rgba(0,0,0,0.9);
    }
    
    [data-theme="dark"] {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
      --primary: #14b8a6; --primary-dark: #0d9488; --primary-light: #5eead4;
      --primary-rgb: 20, 184, 166; --dark: #f1f5f9; --text: #cbd5e1;
      --text-light: #64748b; --white: #1e293b; --card-bg: #1e293b;
      --card-border: #334155; --shadow: 4px 4px 0 #000000;
      --shadow-hover: 6px 6px 0 #000000;
      --shadow-sm: 2px 2px 0 #000000;
      --header-bg: #1e293b; --footer-bg: #1e293b;
      --overlay: rgba(20, 184, 166, 0.08);
      --logo-filter: brightness(0) invert(1);
    }
    
    [data-muharram="true"] {
      --primary: #dc2626; --primary-dark: #b91c1c; --primary-light: #fca5a5;
      --primary-rgb: 220, 38, 38; --overlay: rgba(220, 38, 38, 0.05);
    }
    
    [data-theme="dark"][data-muharram="true"] {
      --primary: #ef4444; --primary-dark: #dc2626; --primary-light: #fca5a5;
      --primary-rgb: 239, 68, 68; --overlay: rgba(239, 68, 68, 0.08);
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      transition: all 0.3s ease;
    }
    
    .header {
      background: var(--header-bg); box-shadow: 0 4px 0 #000000;
      padding: 14px 20px; position: sticky; top: 0; z-index: 100;
      border: 1px solid #000000; border-top: none; transition: all 0.3s ease;
      margin: 0 0 4px 0;
    }
    
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; max-width: 1100px; margin: 0 auto;
    }
    
    .header-right { display: flex; align-items: center; gap: 10px; }
    
    .header-logo {
      width: 42px; height: 42px; border-radius: 4px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 3px 3px 0 #000000;
      overflow: hidden; padding: 6px; border: 1px solid #000000;
    }
    
    .header-logo img { width: 100%; height: 100%; object-fit: contain; filter: var(--logo-filter); }
    .header-title { font-size: 16px; font-weight: 700; color: var(--dark); transition: color 0.3s; }
    .header-subtitle { font-size: 8px; color: var(--text-light); transition: color 0.3s; }
    .header-btns { display: flex; align-items: center; gap: 8px; }
    
    .back-btn, .theme-toggle {
      background: var(--bg2); border: 1px solid #000000; padding: 10px; border-radius: 4px;
      cursor: pointer; font-size: 18px; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; transition: all 0.15s ease; text-decoration: none;
      box-shadow: 3px 3px 0 #000000;
    }
    .back-btn:active, .theme-toggle:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000000; }
    
    .main-container { flex: 1; max-width: 800px; width: 100%; margin: 24px auto; padding: 0 12px 80px; }
    
    .loader-wrapper { display: flex; align-items: center; justify-content: center; min-height: 50vh; }
    .loader {
      width: 48px; height: 48px; border: 4px solid #000000;
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .notice-hero {
      display: flex; justify-content: center; margin-bottom: 24px;
    }
    
    .notice-hero-image {
      width: 100%; max-width: 350px; aspect-ratio: 2/3;
      object-fit: cover; display: block;
      background: var(--bg2); border-radius: 4px;
      box-shadow: 5px 5px 0 #000000; border: 1px solid #000000;
    }
    
    .notice-hero-placeholder {
      width: 100%; max-width: 350px; aspect-ratio: 2/3;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      display: flex; align-items: center; justify-content: center;
      font-size: 64px; color: rgba(255,255,255,0.3);
      border-radius: 4px;
      box-shadow: 5px 5px 0 #000000; border: 1px solid #000000;
    }
    
    .notice-info-card {
      background: var(--card-bg); border: 1px solid #000000;
      border-radius: 4px; padding: 24px; margin-bottom: 24px;
      box-shadow: 4px 4px 0 #000000;
    }
    
    .notice-info-card .notice-title {
      font-size: 22px; font-weight: 800; color: var(--dark);
      margin-bottom: 16px; line-height: 1.5;
    }
    
    .notice-meta {
      display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 20px;
      position: relative; padding: 0;
    }
    
    .notice-meta-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; background: var(--bg2);
      border-radius: 2px; font-size: 11px; color: var(--text);
      margin-left: 6px; margin-bottom: 6px;
      border: 1px solid #000000; box-shadow: 2px 2px 0 #000000;
    }
    
    .notice-meta-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--primary); flex-shrink: 0;
    }
    
    .notice-tag-badge {
      display: inline-flex; align-items: center;
      font-size: 10px; background: rgba(var(--primary-rgb), 0.1);
      color: var(--primary-dark); padding: 6px 12px;
      border-radius: 2px; font-weight: 700;
      margin-left: 6px; margin-bottom: 6px;
      border: 1px solid #000000;
    }
    
    .notice-content-box {
      background: var(--bg2); border-radius: 2px;
      padding: 20px; font-size: 14px; line-height: 2;
      color: var(--text); white-space: pre-line;
      border: 1px solid #000000;
      border-right: 4px solid var(--primary);
    }
    
    .share-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 20px; background: var(--primary); color: #fff;
      border-radius: 4px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: 1px solid #000000; font-family: inherit;
      transition: all 0.15s ease; margin-top: 12px;
      box-shadow: 3px 3px 0 #000000;
    }
    .share-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000000; }
    .share-btn.copied { background: #10b981; }
    
    .floating-actions {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 12px;
      z-index: 998;
    }
    
    .floating-btn {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      background: var(--primary);
      color: #fff;
      border: 1px solid #000000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0;
      overflow: hidden;
      white-space: nowrap;
      transition: all 0.15s ease;
      box-shadow: 4px 4px 0 #000000;
      position: relative;
      direction: rtl;
      font-family: inherit;
    }
    
    .floating-btn i {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      position: absolute;
      right: 0;
      top: 0;
    }
    
    .floating-btn .btn-text {
      opacity: 0;
      padding: 0 56px 0 18px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      direction: rtl;
      text-align: right;
    }
    
    .floating-btn.expanded {
      width: 150px;
      border-radius: 4px;
    }
    
    .floating-btn.expanded .btn-text {
      opacity: 1;
    }
    
    .floating-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000000; }
    
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      background: #fff;
      margin-right: 2px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    .footer {
      text-align: center;
      padding: 20px;
      background: var(--footer-bg);
      border-top: 1px solid #000000;
      transition: all 0.3s ease;
      margin-top: auto;
    }
    
    .footer-text { font-size: 10px; color: var(--text-light); }
    
    @media (max-width: 650px) {
      .header-title { font-size: 14px; }
      .header-subtitle { font-size: 7px; }
      .notice-info-card { padding: 18px; }
      .notice-info-card .notice-title { font-size: 18px; }
      .notice-hero-image, .notice-hero-placeholder { max-width: 280px; }
      .floating-actions { bottom: 16px; right: 12px; gap: 8px; }
      .floating-btn { width: 42px; height: 42px; box-shadow: 3px 3px 0 #000000; }
      .floating-btn i { width: 42px; height: 42px; font-size: 16px; }
      .floating-btn .btn-text { padding: 0 48px 0 14px; font-size: 11px; }
      .floating-btn.expanded { width: 135px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <div class="header-logo">
          <img src="https://cdn.imgurl.ir/uploads/f57721_InShot_20260714_014548498.png" alt="لوگو">
        </div>
        <div>
          <div class="header-title">شهدای گمنام شورابیل</div>
          <div class="header-subtitle">سایت رسمی اطلاع رسانی و گزارش مراسمات</div>
        </div>
      </div>
      <div class="header-btns">
        <a href="../dashboard/" class="back-btn" title="بازگشت"><i class="fa-solid fa-arrow-right"></i></a>
        <button class="theme-toggle" id="themeToggle" title="تغییر تم"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <section class="main-container" id="mainContent">
    <div class="loader-wrapper"><div class="loader"></div></div>
  </section>

  <div class="floating-actions">
    <button class="floating-btn" id="floatingPhone" onclick="window.location.href='../Contact/'" title="ارتباط با ما">
      <span class="btn-text" id="phoneText"></span>
      <i class="fa-solid fa-phone"></i>
    </button>
    <button class="floating-btn" id="floatingAddress" onclick="window.location.href='../Address/'" title="نشانی ما">
      <span class="btn-text" id="addressText"></span>
      <i class="fa-solid fa-location-dot"></i>
    </button>
  </div>

  <footer class="footer">
    <p class="footer-text">خادمین شهدای گمنام شورابیل — کلیه حقوق محفوظ است</p>
  </footer>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbz0wWRJtCYo-7lyr0zXJm_NyvjA9a7ScXOUDOKJfXMGTatGc3Cze0CBXwoen-VrLqK5/exec';
    
    const urlParams = new URLSearchParams(window.location.search);
    const NOTICE_ID = urlParams.get('id') || localStorage.getItem('selectedAnnouncementId');
    
    if (urlParams.get('id')) {
      localStorage.setItem('selectedAnnouncementId', urlParams.get('id'));
    }
    
    const $ = (id) => document.getElementById(id);
    const themeToggle = $('themeToggle'), icon = themeToggle.querySelector('i');
    
    const savedTheme = localStorage.getItem('heyat-theme');
    if (savedTheme === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); icon.classList.replace('fa-moon', 'fa-sun'); }
    
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      icon.className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
      localStorage.setItem('heyat-theme', isDark ? 'light' : 'dark');
    });
    
    (async function() {
      try {
        const now = new Date();
        const d = String(now.getDate()).padStart(2,'0'), m = String(now.getMonth()+1).padStart(2,'0'), y = now.getFullYear();
        const r = await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
        const j = await r.json();
        if (j.code === 200 && j.data.hijri.month.number === 1) document.documentElement.setAttribute('data-muharram', 'true');
      } catch(e) {}
    })();
    
    function shareNotice() {
      const url = window.location.origin + window.location.pathname + '?id=' + NOTICE_ID;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.querySelector('.share-btn');
        const orig = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> لینک کپی شد';
        btn.classList.add('copied');
        setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 2000);
      });
    }
    
    function typeText(element, text, callback) {
      let i = 0;
      element.innerHTML = '<span class="typing-cursor"></span>';
      const cursor = element.querySelector('.typing-cursor');
      
      function type() {
        if (i < text.length) {
          cursor.insertAdjacentText('beforebegin', text[i]);
          i++;
          setTimeout(type, 80);
        } else {
          cursor.remove();
          if (callback) setTimeout(callback, 2000);
        }
      }
      type();
    }
    
    function clearText(element, callback) {
      element.textContent = '';
      if (callback) callback();
    }
    
    function animateFloatingButtons() {
      const phoneBtn = $('floatingPhone');
      const addrBtn = $('floatingAddress');
      const phoneText = $('phoneText');
      const addrText = $('addressText');
      
      if (!phoneBtn || !addrBtn) return;
      
      let toggle = true;
      
      function cycle() {
        if (toggle) {
          if (addrBtn.classList.contains('expanded')) {
            clearText(addrText);
            addrBtn.classList.remove('expanded');
          }
          setTimeout(() => {
            phoneBtn.classList.add('expanded');
            typeText(phoneText, 'ارتباط با ما', () => {
              clearText(phoneText);
              phoneBtn.classList.remove('expanded');
            });
          }, 400);
        } else {
          if (phoneBtn.classList.contains('expanded')) {
            clearText(phoneText);
            phoneBtn.classList.remove('expanded');
          }
          setTimeout(() => {
            addrBtn.classList.add('expanded');
            typeText(addrText, 'نشانی ما', () => {
              clearText(addrText);
              addrBtn.classList.remove('expanded');
            });
          }, 400);
        }
        toggle = !toggle;
      }
      
      cycle();
      setInterval(cycle, 5000);
    }
    
    async function loadNoticeData() {
      const container = $('mainContent');
      
      if (!NOTICE_ID) {
        container.innerHTML = `<div class="loader-wrapper"><div style="text-align:center;color:var(--text-light);"><i class="fa-solid fa-circle-exclamation" style="font-size:48px;margin-bottom:12px;"></i><p>اطلاعیه‌ای انتخاب نشده است</p><a href="../dashboard/" style="display:inline-block;margin-top:12px;padding:8px 20px;background:var(--primary);color:#fff;border:1px solid #000000;border-radius:4px;font-size:13px;text-decoration:none;box-shadow:3px 3px 0 #000000;"><i class="fa-solid fa-arrow-right"></i> بازگشت</a></div></div>`;
        return;
      }
      
      try {
        const res = await fetch(API_URL + '?action=getAnnouncements');
        const data = await res.json();
        
        if (data.success && data.data.length > 0) {
          const notice = data.data.find(item => item.id === NOTICE_ID);
          
          if (notice) {
            const noticeDate = notice.date ? new Date(notice.date) : null;
            const dateStr = noticeDate ? noticeDate.toLocaleDateString('fa-IR') : '';
            
            let html = '';
            
            if (notice.image) {
              html += `<div class="notice-hero"><img src="${notice.image}" class="notice-hero-image" alt="${notice.title}"></div>`;
            } else {
              html += `<div class="notice-hero"><div class="notice-hero-placeholder"><i class="fa-solid fa-bullhorn"></i></div></div>`;
            }
            
            html += `<div class="notice-info-card">`;
            html += `<h1 class="notice-title">${notice.title}</h1>`;
            
            html += `<div class="notice-meta">`;
            if (dateStr) html += `<div class="notice-meta-item"><div class="notice-meta-dot"></div> ${dateStr}</div>`;
            if (notice.tag) html += `<span class="notice-tag-badge">${notice.tag}</span>`;
            html += `</div>`;
            
            if (notice.content) {
              html += `<div class="notice-content-box">${notice.content}</div>`;
            }
            
            html += `<button class="share-btn" onclick="shareNotice()"><i class="fa-solid fa-share-nodes"></i> اشتراک‌گذاری</button>`;
            html += `</div>`;
            
            container.innerHTML = html;
          } else {
            container.innerHTML = `<div class="loader-wrapper"><div style="text-align:center;color:var(--text-light);"><i class="fa-solid fa-circle-exclamation" style="font-size:48px;margin-bottom:12px;"></i><p>اطلاعیه پیدا نشد</p><a href="../dashboard/" style="display:inline-block;margin-top:12px;padding:8px 20px;background:var(--primary);color:#fff;border:1px solid #000000;border-radius:4px;font-size:13px;text-decoration:none;box-shadow:3px 3px 0 #000000;"><i class="fa-solid fa-arrow-right"></i> بازگشت</a></div></div>`;
          }
        } else {
          container.innerHTML = `<div class="loader-wrapper"><div style="text-align:center;color:var(--text-light);"><i class="fa-solid fa-circle-exclamation" style="font-size:48px;margin-bottom:12px;"></i><p>اطلاعیه‌ای یافت نشد</p><a href="../dashboard/" style="display:inline-block;margin-top:12px;padding:8px 20px;background:var(--primary);color:#fff;border:1px solid #000000;border-radius:4px;font-size:13px;text-decoration:none;box-shadow:3px 3px 0 #000000;"><i class="fa-solid fa-arrow-right"></i> بازگشت</a></div></div>`;
        }
      } catch(e) {
        container.innerHTML = `<div class="loader-wrapper"><div style="text-align:center;color:var(--text-light);"><i class="fa-solid fa-circle-exclamation" style="font-size:48px;margin-bottom:12px;"></i><p>خطا در دریافت اطلاعات</p><button onclick="loadNoticeData()" style="margin-top:12px;padding:8px 20px;background:var(--primary);color:#fff;border:1px solid #000000;border-radius:4px;cursor:pointer;font-size:13px;font-family:inherit;box-shadow:3px 3px 0 #000000;"><i class="fa-solid fa-rotate-right"></i> تلاش مجدد</button></div></div>`;
      }
    }
    
    loadNoticeData();
    setTimeout(animateFloatingButtons, 1000);
  </script>

  <script src="../music.js"></script>
</body>
</html>
