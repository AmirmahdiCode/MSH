<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت مدیران | شهدای گمنام شورابیل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #f8fafc; --bg2: #f1f5f9; --bg3: #e2e8f0;
      --primary: #0d9488; --primary-dark: #0f766e; --primary-rgb: 13, 148, 136;
      --dark: #0f172a; --text: #334155; --text-light: #94a3b8;
      --white: #ffffff; --card-bg: #ffffff; --card-border: #e2e8f0;
      --shadow: 0 2px 12px rgba(0,0,0,0.04); --header-bg: #ffffff;
      --logo-filter: none; --danger: #dc2626; --danger-light: #fef2f2;
      --success: #10b981; --warning: #f59e0b; --info: #3b82f6;
    }
    
    [data-theme="dark"] {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
      --primary: #14b8a6; --primary-dark: #0d9488; --primary-rgb: 20, 184, 166;
      --dark: #f1f5f9; --text: #cbd5e1; --text-light: #64748b;
      --white: #1e293b; --card-bg: #1e293b; --card-border: #334155;
      --shadow: 0 2px 12px rgba(0,0,0,0.3); --header-bg: #1e293b;
      --logo-filter: brightness(0) invert(1); --danger-light: #2e1a1a;
    }
    
    [data-muharram="true"] {
      --primary: #dc2626; --primary-dark: #b91c1c; --primary-rgb: 220, 38, 38;
    }
    
    [data-theme="dark"][data-muharram="true"] {
      --primary: #ef4444; --primary-dark: #dc2626; --primary-rgb: 239, 68, 68;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; transition: all 0.3s ease;
    }
    
    .floating-toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-120px);
      z-index: 9999; min-width: 300px; max-width: 90%; padding: 14px 20px;
      border-radius: 12px; font-size: 13px; font-weight: 600; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    
    .floating-toast.show { transform: translateX(-50%) translateY(0); }
    .floating-toast.error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
    .floating-toast.warning { background: #fffbeb; border: 1px solid #fde68a; color: #d97706; }
    .floating-toast.success { background: #ecfdf5; border: 1px solid #a7f3d0; color: #059669; }
    .floating-toast.info { background: #eff6ff; border: 1px solid #bfdbfe; color: #2563eb; }
    .floating-toast i { font-size: 18px; }
    .floating-toast .toast-close { margin-right: auto; cursor: pointer; opacity: 0.6; font-size: 14px; }
    .floating-toast .toast-close:hover { opacity: 1; }
    
    .header {
      background: var(--header-bg); box-shadow: 0 1px 8px rgba(0,0,0,0.03);
      padding: 14px 20px; border-bottom: 1px solid var(--bg3); transition: all 0.3s ease;
    }
    
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1100px; margin: 0 auto; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    
    .header-logo {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 12px rgba(var(--primary-rgb), 0.2); overflow: hidden; padding: 6px;
    }
    
    .header-logo img { width: 100%; height: 100%; object-fit: contain; filter: var(--logo-filter); }
    .header-title { font-size: 18px; font-weight: 700; color: var(--dark); }
    .header-btns { display: flex; align-items: center; gap: 8px; }
    
    .back-btn { background: var(--bg2); border: none; padding: 10px; border-radius: 50%; cursor: pointer; font-size: 18px; color: var(--text); display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; text-decoration: none; }
    .back-btn:hover { background: var(--primary); color: #fff; }
    
    .theme-toggle { background: var(--bg2); border: none; padding: 10px; border-radius: 50%; cursor: pointer; font-size: 18px; color: var(--text); display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; }
    .theme-toggle:hover { background: var(--primary); color: #fff; transform: rotate(15deg); }
    
    .logout-btn { background: var(--danger-light); border: 1px solid #fecaca; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--danger); display: flex; align-items: center; gap: 6px; font-family: inherit; }
    .logout-btn:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    
    .main-container { max-width: 900px; width: 100%; margin: 24px auto; padding: 0 12px; }
    .page-title { font-size: 18px; font-weight: 700; color: var(--dark); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    
    .add-btn { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; margin-right: auto; display: flex; align-items: center; gap: 6px; }
    .add-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.3); }
    
    .admins-list { display: flex; flex-direction: column; gap: 8px; }
    
    .admin-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); }
    .admin-avatar { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; flex-shrink: 0; }
    .admin-info { flex: 1; min-width: 0; }
    .admin-name { font-size: 13px; font-weight: 700; color: var(--dark); margin-bottom: 2px; }
    .admin-username { font-size: 10px; color: var(--text-light); }
    
    .admin-role { font-size: 10px; padding: 4px 10px; border-radius: 6px; font-weight: 600; background: var(--bg2); color: var(--primary-dark); }
    .admin-role.owner { background: #fef3c7; color: #d97706; }
    .admin-role.maker { background: #fce7f3; color: #db2777; }
    
    .admin-actions { display: flex; gap: 6px; }
    
    .action-btn { width: 34px; height: 34px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; background: var(--bg2); color: var(--text); }
    .action-btn:hover { background: var(--primary); color: #fff; }
    .action-btn.delete:hover { background: var(--danger); color: #fff; }
    
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    
    .modal { background: var(--card-bg); border-radius: 16px; padding: 24px; width: 90%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .modal h3 { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    
    .form-input, .form-select { width: 100%; padding: 10px 12px; border: 1px solid var(--card-border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 12px; font-family: inherit; }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.1); }
    
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .btn-cancel { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--bg); color: var(--text); cursor: pointer; font-size: 12px; font-family: inherit; }
    .btn-submit { padding: 8px 16px; border-radius: 8px; border: none; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; cursor: pointer; font-size: 12px; font-weight: 600; font-family: inherit; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    
    @media (max-width: 650px) {
      .admin-card { flex-wrap: wrap; gap: 10px; }
      .admin-actions { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>

  <div class="floating-toast" id="floatingToast">
    <i id="toastIcon"></i>
    <span id="toastMessage"></span>
    <span class="toast-close" onclick="hideToast()"><i class="fa-solid fa-xmark"></i></span>
  </div>

  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/f57721_InShot_20260714_014548498.png" alt="لوگو"></div>
        <div><div class="header-title">مدیریت مدیران</div></div>
      </div>
      <div class="header-btns">
        <a href="dashboard.html" class="back-btn" title="بازگشت"><i class="fa-solid fa-arrow-right"></i></a>
        <button class="theme-toggle" id="themeToggle" title="تغییر تم"><i class="fa-solid fa-moon"></i></button>
        <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
      </div>
    </div>
  </header>

  <section class="main-container">
    <div class="page-title">
      <i class="fa-solid fa-users-gear"></i> لیست مدیران
      <button class="add-btn" id="addAdminBtn"><i class="fa-solid fa-plus"></i> افزودن مدیر</button>
    </div>
    <div class="admins-list" id="adminsList">
      <div style="text-align: center; padding: 32px; color: var(--text-light);">
        <i class="fa-solid fa-spinner fa-pulse"></i>
        <p style="margin-top: 8px; font-size: 12px;">در حال بارگذاری...</p>
      </div>
    </div>
  </section>

  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h3><i class="fa-solid fa-user-plus"></i> افزودن مدیر جدید</h3>
      <div class="form-group"><label>نام</label><input type="text" class="form-input" id="addName" placeholder="نام مدیر"></div>
      <div class="form-group"><label>نام کاربری</label><input type="text" class="form-input" id="addUsername" placeholder="نام کاربری"></div>
      <div class="form-group"><label>رمز عبور</label><input type="password" class="form-input" id="addPassword" placeholder="رمز عبور"></div>
      <div class="form-group"><label>مقام</label><select class="form-select" id="addRole"><option value="ادمین">ادمین</option><option value="ادمین ویژه">ادمین ویژه</option></select></div>
      <div class="modal-btns"><button class="btn-cancel" onclick="closeAddModal()">انصراف</button><button class="btn-submit" id="submitAdd">افزودن</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3><i class="fa-solid fa-pen-to-square"></i> تغییر مقام</h3>
      <div class="form-group"><label>مقام جدید</label><select class="form-select" id="editRole"><option value="سازنده">سازنده</option><option value="مالک">مالک</option><option value="ادمین ویژه">ادمین ویژه</option><option value="ادمین">ادمین</option></select><input type="hidden" id="editTargetId"></div>
      <div class="modal-btns"><button class="btn-cancel" onclick="closeEditModal()">انصراف</button><button class="btn-submit" id="submitEdit">ذخیره</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3><i class="fa-solid fa-triangle-exclamation" style="color: var(--danger);"></i> حذف مدیر</h3>
      <p style="font-size: 13px; color: var(--text); margin-bottom: 16px;">آیا از حذف این مدیر اطمینان دارید؟</p>
      <input type="hidden" id="deleteTargetId">
      <div class="modal-btns"><button class="btn-cancel" onclick="closeDeleteModal()">انصراف</button><button class="btn-submit" id="submitDelete" style="background: var(--danger);">حذف</button></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzXwQAAM1zGoVoG7MnFt-yEB7CSY5Qa8xnxpbkdZ_S6kUzPhZV_BdIkeasayEqz_lcQ/exec';
    
    const $ = (id) => document.getElementById(id);
    const toast = $('floatingToast'), toastIcon = $('toastIcon'), toastMessage = $('toastMessage');
    let toastTimer;
    
    function showToast(msg, type) {
      clearTimeout(toastTimer);
      toast.className = 'floating-toast ' + (type || 'error');
      const icons = { error: 'fa-circle-xmark', warning: 'fa-triangle-exclamation', success: 'fa-circle-check', info: 'fa-circle-info' };
      toastIcon.className = 'fa-solid ' + (icons[type] || icons.error);
      toastMessage.textContent = msg;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 5000);
    }
    
    function hideToast() { toast.classList.remove('show'); clearTimeout(toastTimer); }
    
    function checkSession() {
      const d = localStorage.getItem('admin_session');
      if (!d) { window.location.href = 'login.html'; return null; }
      try {
        const s = JSON.parse(d);
        if (Date.now() - s.timestamp > 1800000) { localStorage.clear(); window.location.href = 'login.html'; return null; }
        return s;
      } catch(e) { localStorage.clear(); window.location.href = 'login.html'; return null; }
    }
    
    const session = checkSession();
    if (!session) throw new Error();
    
    const admin = session.admin;
    const sessionToken = localStorage.getItem('session_token');
    
    if (!sessionToken) { localStorage.clear(); window.location.href = 'login.html'; }
    if (admin.role !== 'سازنده' && admin.role !== 'مالک') { window.location.href = 'dashboard.html'; }
    
    (function() {
      const t = localStorage.getItem('heyat-theme');
      if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); $('themeToggle').querySelector('i').className = 'fa-solid fa-sun'; }
      $('themeToggle').onclick = () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
        $('themeToggle').querySelector('i').className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        localStorage.setItem('heyat-theme', isDark ? 'light' : 'dark');
      };
    })();
    
    (async function() {
      try {
        const now = new Date();
        const d = String(now.getDate()).padStart(2,'0'), m = String(now.getMonth()+1).padStart(2,'0'), y = now.getFullYear();
        const r = await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
        const j = await r.json();
        if (j.code === 200 && j.data.hijri.month.number === 1) document.documentElement.setAttribute('data-muharram', 'true');
      } catch(e) {}
    })();
    
    $('logoutBtn').onclick = () => { localStorage.clear(); window.location.href = 'login.html'; };
    
    async function loadAdmins() {
      const list = $('adminsList');
      try {
        const res = await fetch(API_URL + '?action=getAdmins', {
          method: 'POST',
          body: JSON.stringify({ adminId: admin.id, sessionToken })
        });
        const data = await res.json();
        
        if (data.success && data.data.length > 0) {
          list.innerHTML = data.data.map(item => {
            let roleClass = '';
            if (item.role === 'سازنده') roleClass = 'maker';
            else if (item.role === 'مالک') roleClass = 'owner';
            
            let actionsHTML = '';
            if (admin.role === 'سازنده' && item.role !== 'سازنده') {
              actionsHTML = `<button class="action-btn" onclick="openEditModal('${item.id}', '${item.role}')"><i class="fa-solid fa-pen-to-square"></i></button><button class="action-btn delete" onclick="openDeleteModal('${item.id}')"><i class="fa-solid fa-trash"></i></button>`;
            } else if (admin.role === 'مالک' && (item.role === 'ادمین' || item.role === 'ادمین ویژه')) {
              actionsHTML = `<button class="action-btn delete" onclick="openDeleteModal('${item.id}')"><i class="fa-solid fa-trash"></i></button>`;
            }
            
            return `<div class="admin-card"><div class="admin-avatar"><i class="fa-solid fa-user"></i></div><div class="admin-info"><div class="admin-name">${item.name}</div><div class="admin-username">@${item.username}</div></div><span class="admin-role ${roleClass}">${item.role}</span>${actionsHTML ? `<div class="admin-actions">${actionsHTML}</div>` : ''}</div>`;
          }).join('');
        } else {
          list.innerHTML = `<div style="text-align: center; padding: 32px; color: var(--text-light);"><i class="fa-solid fa-users-slash" style="font-size: 36px; margin-bottom: 8px; display: block;"></i><p style="font-size: 13px;">مدیری یافت نشد</p></div>`;
        }
      } catch(e) { showToast('خطا در دریافت لیست مدیران', 'error'); }
    }
    
    function openAddModal() { $('addModal').classList.add('active'); $('addName').focus(); }
    function closeAddModal() { $('addModal').classList.remove('active'); $('addName').value = ''; $('addUsername').value = ''; $('addPassword').value = ''; $('addRole').value = 'ادمین'; }
    
    $('addAdminBtn').onclick = openAddModal;
    $('addModal').onclick = (e) => { if (e.target === $('addModal')) closeAddModal(); };
    
    $('submitAdd').onclick = async () => {
      const name = $('addName').value.trim(), username = $('addUsername').value.trim(), password = $('addPassword').value, role = $('addRole').value;
      if (!name || !username || !password) { showToast('لطفاً همه فیلدها را پر کنید', 'warning'); return; }
      
      $('submitAdd').disabled = true; $('submitAdd').textContent = 'در حال افزودن...';
      
      try {
        const res = await fetch(API_URL + '?action=addAdmin', { method: 'POST', body: JSON.stringify({ adminId: admin.id, sessionToken, name, username, password, role }) });
        const data = await res.json();
        if (data.success) { showToast('مدیر جدید با موفقیت اضافه شد', 'success'); closeAddModal(); loadAdmins(); }
        else showToast(data.message, 'error');
      } catch(e) { showToast('خطای سرور رخ داده است', 'error'); }
      
      $('submitAdd').disabled = false; $('submitAdd').textContent = 'افزودن';
    };
    
    function openEditModal(targetId, currentRole) { $('editTargetId').value = targetId; $('editRole').value = currentRole; $('editModal').classList.add('active'); }
    function closeEditModal() { $('editModal').classList.remove('active'); }
    $('editModal').onclick = (e) => { if (e.target === $('editModal')) closeEditModal(); };
    
    $('submitEdit').onclick = async () => {
      const targetId = $('editTargetId').value, newRole = $('editRole').value;
      $('submitEdit').disabled = true; $('submitEdit').textContent = 'در حال ذخیره...';
      
      try {
        const res = await fetch(API_URL + '?action=changeRole', { method: 'POST', body: JSON.stringify({ adminId: admin.id, sessionToken, targetId, newRole }) });
        const data = await res.json();
        if (data.success) { showToast('مقام با موفقیت تغییر کرد', 'success'); closeEditModal(); loadAdmins(); }
        else showToast(data.message, 'error');
      } catch(e) { showToast('خطای سرور رخ داده است', 'error'); }
      
      $('submitEdit').disabled = false; $('submitEdit').textContent = 'ذخیره';
    };
    
    function openDeleteModal(targetId) { $('deleteTargetId').value = targetId; $('deleteModal').classList.add('active'); }
    function closeDeleteModal() { $('deleteModal').classList.remove('active'); }
    $('deleteModal').onclick = (e) => { if (e.target === $('deleteModal')) closeDeleteModal(); };
    
    $('submitDelete').onclick = async () => {
      const targetId = $('deleteTargetId').value;
      $('submitDelete').disabled = true; $('submitDelete').textContent = 'در حال حذف...';
      
      try {
        const res = await fetch(API_URL + '?action=deleteAdmin', { method: 'POST', body: JSON.stringify({ adminId: admin.id, sessionToken, targetId }) });
        const data = await res.json();
        if (data.success) { showToast('مدیر با موفقیت حذف شد', 'success'); closeDeleteModal(); loadAdmins(); }
        else showToast(data.message, 'error');
      } catch(e) { showToast('خطای سرور رخ داده است', 'error'); }
      
      $('submitDelete').disabled = false; $('submitDelete').textContent = 'حذف';
    };
    
    loadAdmins();
  </script>

</body>
</html>
