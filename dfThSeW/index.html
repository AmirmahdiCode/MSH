<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت | شهدای گمنام شورابیل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --primary-rgb: 13, 148, 136;
    }
    
    [data-muharram="true"] {
      --primary: #dc2626;
      --primary-dark: #b91c1c;
      --primary-rgb: 220, 38, 38;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .splash {
      text-align: center;
      animation: fadeOut 0.6s ease forwards;
      animation-delay: 2.5s;
      opacity: 1;
    }
    
    @keyframes fadeOut {
      to { opacity: 0; transform: scale(1.05); }
    }
    
    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    
    .particle {
      position: absolute;
      background: rgba(var(--primary-rgb), 0.12);
      border-radius: 50%;
      animation: float 5s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 0.4; }
      100% { transform: translateY(-100px) scale(0.5); opacity: 0; }
    }
    
    .logo-wrapper {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 50px rgba(var(--primary-rgb), 0.4), 0 0 100px rgba(var(--primary-rgb), 0.15);
      animation: logoPulse 2s ease-in-out infinite;
      overflow: hidden;
      padding: 12px;
    }
    
    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }
    
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 50px rgba(var(--primary-rgb), 0.4), 0 0 100px rgba(var(--primary-rgb), 0.15); }
      50% { transform: scale(1.04); box-shadow: 0 0 70px rgba(var(--primary-rgb), 0.6), 0 0 140px rgba(var(--primary-rgb), 0.25); }
    }
    
    .title {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
      animation: slideUp 0.8s ease forwards;
      opacity: 0;
      animation-delay: 0.4s;
    }
    
    .subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 28px;
      animation: slideUp 0.8s ease forwards;
      opacity: 0;
      animation-delay: 0.7s;
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .lock-icon {
      font-size: 18px;
      color: rgba(var(--primary-rgb), 0.7);
      animation: slideUp 0.8s ease forwards, lockGlow 2s ease-in-out infinite;
      opacity: 0;
      animation-delay: 1s;
    }
    
    @keyframes lockGlow {
      0%, 100% { color: rgba(var(--primary-rgb), 0.5); }
      50% { color: rgba(var(--primary-rgb), 0.9); }
    }
    
    .spinner-ring {
      width: 36px;
      height: 36px;
      margin: 20px auto 0;
      border: 2px solid rgba(var(--primary-rgb), 0.12);
      border-top-color: rgba(var(--primary-rgb), 0.7);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <div class="splash" id="splash">
    <div class="logo-wrapper">
      <img src="https://cdn.imgurl.ir/uploads/f57721_InShot_20260714_014548498.png" alt="لوگو">
    </div>
    <div class="title">پنل مدیریت</div>
    <div class="subtitle">شهدای گمنام شورابیل</div>
    <div class="lock-icon"><i class="fa-solid fa-lock"></i> ورود به بخش مدیریت</div>
    <div class="spinner-ring"></div>
  </div>

  <script>
    (async function() {
      try {
        const now = new Date();
        const d = String(now.getDate()).padStart(2,'0'), m = String(now.getMonth()+1).padStart(2,'0'), y = now.getFullYear();
        const r = await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
        const j = await r.json();
        if (j.code === 200 && j.data.hijri.month.number === 1) {
          document.documentElement.setAttribute('data-muharram', 'true');
        }
      } catch(e) {}
    })();
    
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      const size = Math.random() * 6 + 2;
      particle.style.cssText = `
        width: ${size}px; height: ${size}px;
        top: ${Math.random() * 100}%;
        left: ${Math.random() * 100}%;
        animation-delay: ${Math.random() * 5}s;
        animation-duration: ${Math.random() * 3 + 3}s;
      `;
      particlesContainer.appendChild(particle);
    }
    
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 3000);
  </script>

</body>
</html>
