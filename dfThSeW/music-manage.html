<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت لیست پخش | شهدای گمنام شورابیل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #f8fafc; --bg2: #f1f5f9; --bg3: #e2e8f0;
      --primary: #0d9488; --primary-dark: #0f766e; --primary-rgb: 13, 148, 136;
      --dark: #0f172a; --text: #334155; --text-light: #94a3b8;
      --white: #ffffff; --card-bg: #ffffff; --card-border: #e2e8f0;
      --shadow: 0 2px 12px rgba(0,0,0,0.04); --header-bg: #ffffff;
      --logo-filter: none; --danger: #dc2626; --danger-light: #fef2f2;
      --success: #10b981; --success-light: #ecfdf5;
      --warning: #f59e0b; --warning-light: #fffbeb;
    }
    
    [data-theme="dark"] {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
      --primary: #14b8a6; --primary-dark: #0d9488; --primary-rgb: 20, 184, 166;
      --dark: #f1f5f9; --text: #cbd5e1; --text-light: #64748b;
      --white: #1e293b; --card-bg: #1e293b; --card-border: #334155;
      --shadow: 0 2px 12px rgba(0,0,0,0.3); --header-bg: #1e293b;
      --logo-filter: brightness(0) invert(1); --danger-light: #2e1a1a;
      --success-light: #1a2e2b; --warning-light: #2e2a1a;
    }
    
    [data-muharram="true"] {
      --primary: #dc2626; --primary-dark: #b91c1c; --primary-rgb: 220, 38, 38;
    }
    
    [data-theme="dark"][data-muharram="true"] {
      --primary: #ef4444; --primary-dark: #dc2626; --primary-rgb: 239, 68, 68;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; transition: all 0.3s ease;
    }
    
    .floating-toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-120px);
      z-index: 9999; min-width: 300px; max-width: 90%; padding: 14px 20px;
      border-radius: 12px; font-size: 13px; font-weight: 600; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    
    .floating-toast.show { transform: translateX(-50%) translateY(0); }
    .floating-toast.error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
    .floating-toast.warning { background: #fffbeb; border: 1px solid #fde68a; color: #d97706; }
    .floating-toast.success { background: #ecfdf5; border: 1px solid #a7f3d0; color: #059669; }
    .floating-toast.info { background: #eff6ff; border: 1px solid #bfdbfe; color: #2563eb; }
    .floating-toast i { font-size: 18px; }
    .floating-toast .toast-close { margin-right: auto; cursor: pointer; opacity: 0.6; font-size: 14px; }
    .floating-toast .toast-close:hover { opacity: 1; }
    
    .header { background: var(--header-bg); box-shadow: 0 1px 8px rgba(0,0,0,0.03); padding: 14px 20px; border-bottom: 1px solid var(--bg3); transition: all 0.3s ease; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1100px; margin: 0 auto; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .header-logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 12px rgba(var(--primary-rgb), 0.2); overflow: hidden; padding: 6px; }
    .header-logo img { width: 100%; height: 100%; object-fit: contain; filter: var(--logo-filter); }
    .header-title { font-size: 18px; font-weight: 700; color: var(--dark); }
    .header-btns { display: flex; align-items: center; gap: 8px; }
    .back-btn { background: var(--bg2); border: none; padding: 10px; border-radius: 50%; cursor: pointer; font-size: 18px; color: var(--text); display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; text-decoration: none; }
    .back-btn:hover { background: var(--primary); color: #fff; }
    .theme-toggle { background: var(--bg2); border: none; padding: 10px; border-radius: 50%; cursor: pointer; font-size: 18px; color: var(--text); display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; }
    .theme-toggle:hover { background: var(--primary); color: #fff; transform: rotate(15deg); }
    .logout-btn { background: var(--danger-light); border: 1px solid #fecaca; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--danger); display: flex; align-items: center; gap: 6px; font-family: inherit; }
    .logout-btn:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    
    .main-container { max-width: 700px; width: 100%; margin: 24px auto; padding: 0 12px; }
    .page-title { font-size: 18px; font-weight: 700; color: var(--dark); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .add-btn { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; margin-right: auto; display: flex; align-items: center; gap: 6px; }
    .add-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.3); }
    
    .music-list { display: flex; flex-direction: column; gap: 8px; }
    
    .music-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
    .music-index { width: 32px; height: 32px; border-radius: 50%; background: var(--bg2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--text-light); flex-shrink: 0; }
    .music-icon { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; flex-shrink: 0; }
    .music-info { flex: 1; min-width: 0; }
    .music-url { font-size: 11px; color: var(--text-light); direction: ltr; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .music-actions { display: flex; gap: 6px; flex-shrink: 0; }
    
    .action-btn { width: 34px; height: 34px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; background: var(--bg2); color: var(--text); }
    .action-btn:hover { background: var(--primary); color: #fff; }
    .action-btn.delete:hover { background: var(--danger); color: #fff; }
    .action-btn.playing { background: var(--success); color: #fff; }
    .action-btn.stop-btn:hover { background: var(--warning); color: #fff; }
    
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card-bg); border-radius: 16px; padding: 24px; width: 90%; max-width: 460px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .modal h3 { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .form-group label .hint { font-weight: 400; color: var(--text-light); font-size: 9px; }
    .form-input { width: 100%; padding: 10px 12px; border: 1px solid var(--card-border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 12px; font-family: inherit; direction: ltr; text-align: left; }
    .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.1); }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .btn-cancel { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--bg); color: var(--text); cursor: pointer; font-size: 12px; font-family: inherit; }
    .btn-submit { padding: 8px 16px; border-radius: 8px; border: none; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; cursor: pointer; font-size: 12px; font-weight: 600; font-family: inherit; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .stop-all-btn {
      background: var(--danger); color: #fff; border: none;
      padding: 8px 14px; border-radius: 8px; cursor: pointer;
      font-size: 12px; font-family: inherit; display: flex; align-items: center;
      gap: 6px; margin-right: 8px;
    }
    .stop-all-btn:hover { background: #b91c1c; }
    
    @media (max-width: 500px) {
      .music-card { flex-wrap: wrap; gap: 8px; }
      .music-actions { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>

  <div class="floating-toast" id="floatingToast">
    <i id="toastIcon"></i>
    <span id="toastMessage"></span>
    <span class="toast-close" onclick="hideToast()"><i class="fa-solid fa-xmark"></i></span>
  </div>

  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/f57721_InShot_20260714_014548498.png" alt="لوگو"></div>
        <div><div class="header-title">مدیریت لیست پخش</div></div>
      </div>
      <div class="header-btns">
        <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i></a>
        <button class="theme-toggle" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
        <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
      </div>
    </div>
  </header>

  <section class="main-container">
    <div class="page-title">
      <i class="fa-solid fa-music"></i> لیست مداحی‌ها
      <button class="add-btn" id="addMusicBtn"><i class="fa-solid fa-plus"></i> افزودن مداحی</button>
      <button class="stop-all-btn" id="stopAllBtn" style="display:none;"><i class="fa-solid fa-stop"></i> توقف پخش</button>
    </div>
    <div class="music-list" id="musicList">
      <div style="text-align: center; padding: 32px; color: var(--text-light);"><i class="fa-solid fa-spinner fa-pulse"></i><p style="margin-top: 8px; font-size: 12px;">در حال بارگذاری...</p></div>
    </div>
  </section>

  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h3><i class="fa-solid fa-plus"></i> افزودن مداحی جدید</h3>
      <div class="form-group">
        <label>لینک فایل صوتی <span class="hint">(لینک مستقیم mp3)</span></label>
        <input type="url" class="form-input" id="musicUrl" placeholder="https://example.com/music.mp3">
      </div>
      <div class="modal-btns"><button class="btn-cancel" onclick="closeAddModal()">انصراف</button><button class="btn-submit" id="submitAdd">افزودن</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3><i class="fa-solid fa-triangle-exclamation" style="color: var(--danger);"></i> حذف مداحی</h3>
      <p style="font-size: 13px; color: var(--text); margin-bottom: 16px;">آیا از حذف این مداحی از لیست پخش اطمینان دارید؟</p>
      <input type="hidden" id="deleteRow">
      <div class="modal-btns"><button class="btn-cancel" onclick="closeDeleteModal()">انصراف</button><button class="btn-submit" id="submitDelete" style="background: var(--danger);">حذف</button></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwwVtBTWyDPuyRV7XHo3THXdFN4LMxYeNJpNLG02bG8lLhzj66hqpwZHz12Du-av_SV/exec';
    
    const $ = (id) => document.getElementById(id);
    const toast = $('floatingToast'), toastIcon = $('toastIcon'), toastMessage = $('toastMessage');
    let toastTimer;
    let currentAudio = null;
    let currentPlayingBtn = null;
    
    function showToast(msg, type) {
      clearTimeout(toastTimer);
      toast.className = 'floating-toast ' + (type || 'error');
      const icons = { error: 'fa-circle-xmark', warning: 'fa-triangle-exclamation', success: 'fa-circle-check', info: 'fa-circle-info' };
      toastIcon.className = 'fa-solid ' + (icons[type] || icons.error);
      toastMessage.textContent = msg;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 5000);
    }
    
    function hideToast() { toast.classList.remove('show'); clearTimeout(toastTimer); }
    
    function stopAllAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      if (currentPlayingBtn) {
        currentPlayingBtn.classList.remove('playing');
        currentPlayingBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        currentPlayingBtn = null;
      }
      $('stopAllBtn').style.display = 'none';
    }
    
    function checkSession() {
      const d = localStorage.getItem('admin_session');
      if (!d) { window.location.href = 'login.html'; return null; }
      try { const s = JSON.parse(d); if (Date.now() - s.timestamp > 3600000) { localStorage.clear(); window.location.href = 'login.html'; return null; } return s; }
      catch(e) { localStorage.clear(); window.location.href = 'login.html'; return null; }
    }
    
    const session = checkSession(); if (!session) throw new Error();
    const sessionToken = localStorage.getItem('session_token');
    const admin = session.admin;
    
    if (admin.role !== 'super_admin' && admin.role !== 'admin') { window.location.href = 'dashboard.html'; }
    
    (function() {
      const t = localStorage.getItem('heyat-theme');
      if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); $('themeToggle').querySelector('i').className = 'fa-solid fa-sun'; }
      $('themeToggle').onclick = () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
        $('themeToggle').querySelector('i').className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        localStorage.setItem('heyat-theme', isDark ? 'light' : 'dark');
      };
    })();
    
    (async function() {
      try {
        const now = new Date();
        const d = String(now.getDate()).padStart(2,'0'), m = String(now.getMonth()+1).padStart(2,'0'), y = now.getFullYear();
        const r = await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
        const j = await r.json();
        if (j.code === 200 && j.data.hijri.month.number === 1) document.documentElement.setAttribute('data-muharram', 'true');
      } catch(e) {}
    })();
    
    $('logoutBtn').onclick = () => { stopAllAudio(); localStorage.clear(); window.location.href = 'login.html'; };
    $('stopAllBtn').onclick = stopAllAudio;
    
    let musicData = [];
    
    async function loadMusic() {
      const list = $('musicList');
      try {
        const res = await fetch(API_URL + '?action=getMusicList');
        const data = await res.json();
        
        if (data.success && data.data.length > 0) {
          musicData = data.data;
          list.innerHTML = musicData.map((item, index) => `
            <div class="music-card">
              <div class="music-index">${index + 1}</div>
              <div class="music-icon"><i class="fa-solid fa-music"></i></div>
              <div class="music-info">
                <div class="music-url" title="${item.src}">${item.src}</div>
              </div>
              <div class="music-actions">
                <button class="action-btn play-btn" data-src="${item.src.replace(/"/g, '&quot;')}" data-index="${index}"><i class="fa-solid fa-play"></i></button>
                <button class="action-btn delete" onclick="openDeleteModal(${item.id})"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          `).join('');
          
          document.querySelectorAll('.play-btn').forEach(btn => {
            btn.addEventListener('click', function() {
              const src = this.dataset.src;
              
              if (currentAudio && currentPlayingBtn === this) {
                stopAllAudio();
                return;
              }
              
              stopAllAudio();
              
              currentAudio = new Audio(src);
              currentAudio.volume = 0.3;
              currentAudio.play().catch(() => showToast('خطا در پخش فایل', 'error'));
              
              this.classList.add('playing');
              this.innerHTML = '<i class="fa-solid fa-pause"></i>';
              currentPlayingBtn = this;
              $('stopAllBtn').style.display = 'flex';
              
              currentAudio.addEventListener('ended', () => {
                this.classList.remove('playing');
                this.innerHTML = '<i class="fa-solid fa-play"></i>';
                currentAudio = null;
                currentPlayingBtn = null;
                $('stopAllBtn').style.display = 'none';
              });
            });
          });
        } else {
          list.innerHTML = `<div style="text-align:center;padding:32px;color:var(--text-light);"><i class="fa-solid fa-music" style="font-size:36px;margin-bottom:8px;display:block;opacity:0.5;"></i><p style="font-size:13px;">مداحی‌ای ثبت نشده است</p></div>`;
        }
      } catch(e) { showToast('خطا در دریافت لیست', 'error'); }
    }
    
    function openAddModal() { $('musicUrl').value = ''; $('addModal').classList.add('active'); $('musicUrl').focus(); }
    function closeAddModal() { $('addModal').classList.remove('active'); }
    $('addMusicBtn').onclick = openAddModal;
    $('addModal').onclick = (e) => { if (e.target === $('addModal')) closeAddModal(); };
    
    $('submitAdd').onclick = async () => {
      const src = $('musicUrl').value.trim();
      if (!src) { showToast('لطفاً لینک فایل را وارد کنید', 'warning'); return; }
      
      $('submitAdd').disabled = true; $('submitAdd').textContent = 'در حال افزودن...';
      try {
        const res = await fetch(API_URL + '?action=addMusic', { method: 'POST', body: JSON.stringify({ src, sessionToken }) });
        const data = await res.json();
        if (data.success) { showToast('مداحی اضافه شد', 'success'); closeAddModal(); loadMusic(); }
        else showToast(data.message || 'خطا', 'error');
      } catch(e) { showToast('خطای سرور', 'error'); }
      $('submitAdd').disabled = false; $('submitAdd').textContent = 'افزودن';
    };
    
    function openDeleteModal(row) { $('deleteRow').value = row; $('deleteModal').classList.add('active'); }
    function closeDeleteModal() { $('deleteModal').classList.remove('active'); }
    $('deleteModal').onclick = (e) => { if (e.target === $('deleteModal')) closeDeleteModal(); };
    
    $('submitDelete').onclick = async () => {
      const row = parseInt($('deleteRow').value);
      $('submitDelete').disabled = true; $('submitDelete').textContent = 'در حال حذف...';
      try {
        const res = await fetch(API_URL + '?action=deleteMusic', { method: 'POST', body: JSON.stringify({ row, sessionToken }) });
        const data = await res.json();
        if (data.success) { showToast('مداحی حذف شد', 'success'); closeDeleteModal(); loadMusic(); }
        else showToast(data.message || 'خطا', 'error');
      } catch(e) { showToast('خطای سرور', 'error'); }
      $('submitDelete').disabled = false; $('submitDelete').textContent = 'حذف';
    };
    
    loadMusic();
  </script>

</body>
</html>
