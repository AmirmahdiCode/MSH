<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت مراسمات | شهدای گمنام شورابیل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #f8fafc; --bg2: #f1f5f9; --bg3: #e2e8f0;
      --primary: #0d9488; --primary-dark: #0f766e; --primary-rgb: 13, 148, 136;
      --dark: #0f172a; --text: #334155; --text-light: #94a3b8;
      --white: #ffffff; --card-bg: #ffffff; --card-border: #e2e8f0;
      --shadow: 0 2px 12px rgba(0,0,0,0.04); --shadow-hover: 0 8px 24px rgba(0,0,0,0.08);
      --header-bg: #ffffff; --logo-filter: none;
      --danger: #dc2626; --danger-light: #fef2f2;
      --success: #10b981; --success-light: #ecfdf5;
      --info: #3b82f6; --purple: #8b5cf6;
    }
    
    [data-theme="dark"] {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
      --primary: #14b8a6; --primary-dark: #0d9488; --primary-rgb: 20, 184, 166;
      --dark: #f1f5f9; --text: #cbd5e1; --text-light: #64748b;
      --white: #1e293b; --card-bg: #1e293b; --card-border: #334155;
      --shadow: 0 2px 12px rgba(0,0,0,0.3); --shadow-hover: 0 8px 24px rgba(0,0,0,0.5);
      --header-bg: #1e293b; --logo-filter: brightness(0) invert(1);
      --danger-light: #2e1a1a; --success-light: #1a2e2b;
    }
    
    [data-muharram="true"] {
      --primary: #dc2626; --primary-dark: #b91c1c; --primary-rgb: 220, 38, 38;
    }
    
    [data-theme="dark"][data-muharram="true"] {
      --primary: #ef4444; --primary-dark: #dc2626; --primary-rgb: 239, 68, 68;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; transition: all 0.3s ease;
    }
    
    .floating-toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-120px);
      z-index: 9999; min-width: 300px; max-width: 90%; padding: 14px 20px;
      border-radius: 12px; font-size: 13px; font-weight: 600; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    
    .floating-toast.show { transform: translateX(-50%) translateY(0); }
    .floating-toast.error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
    .floating-toast.warning { background: #fffbeb; border: 1px solid #fde68a; color: #d97706; }
    .floating-toast.success { background: #ecfdf5; border: 1px solid #a7f3d0; color: #059669; }
    .floating-toast.info { background: #eff6ff; border: 1px solid #bfdbfe; color: #2563eb; }
    .floating-toast i { font-size: 18px; }
    .floating-toast .toast-close { margin-right: auto; cursor: pointer; opacity: 0.6; font-size: 14px; }
    .floating-toast .toast-close:hover { opacity: 1; }
    
    .header { background: var(--header-bg); box-shadow: 0 1px 8px rgba(0,0,0,0.03); padding: 14px 20px; border-bottom: 1px solid var(--bg3); transition: all 0.3s ease; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1100px; margin: 0 auto; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .header-logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 12px rgba(var(--primary-rgb), 0.2); overflow: hidden; padding: 6px; }
    .header-logo img { width: 100%; height: 100%; object-fit: contain; filter: var(--logo-filter); }
    .header-title { font-size: 18px; font-weight: 700; color: var(--dark); }
    .header-btns { display: flex; align-items: center; gap: 8px; }
    .back-btn { background: var(--bg2); border: none; padding: 10px; border-radius: 50%; cursor: pointer; font-size: 18px; color: var(--text); display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; text-decoration: none; }
    .back-btn:hover { background: var(--primary); color: #fff; }
    .theme-toggle { background: var(--bg2); border: none; padding: 10px; border-radius: 50%; cursor: pointer; font-size: 18px; color: var(--text); display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; }
    .theme-toggle:hover { background: var(--primary); color: #fff; transform: rotate(15deg); }
    .logout-btn { background: var(--danger-light); border: 1px solid #fecaca; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--danger); display: flex; align-items: center; gap: 6px; font-family: inherit; }
    .logout-btn:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    
    .main-container { max-width: 1000px; width: 100%; margin: 24px auto; padding: 0 12px; }
    .page-title { font-size: 18px; font-weight: 700; color: var(--dark); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .add-btn { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; margin-right: auto; display: flex; align-items: center; gap: 6px; }
    .add-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.3); }
    
    .events-list { display: flex; flex-direction: column; gap: 8px; }
    
    .event-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); }
    .event-image { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--bg2); flex-shrink: 0; }
    .event-image.placeholder { display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--primary); }
    .event-info { flex: 1; min-width: 0; }
    .event-name { font-size: 13px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
    .event-meta { font-size: 10px; color: var(--text-light); display: flex; flex-wrap: wrap; gap: 8px; }
    .event-meta span { display: flex; align-items: center; gap: 3px; }
    .event-actions { display: flex; gap: 6px; }
    
    .action-btn { width: 34px; height: 34px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; background: var(--bg2); color: var(--text); }
    .action-btn:hover { background: var(--primary); color: #fff; }
    .action-btn.delete:hover { background: var(--danger); color: #fff; }
    
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; align-items: center; justify-content: center; overflow-y: auto; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card-bg); border-radius: 16px; padding: 24px; width: 90%; max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .form-group label .hint { font-weight: 400; color: var(--text-light); font-size: 9px; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--card-border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 12px; font-family: inherit; }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.1); }
    
    .image-input-row { display: flex; gap: 8px; }
    .image-input-row .form-input { flex: 1; }
    
    .upload-btn { width: 42px; height: 42px; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; overflow: hidden; text-decoration: none; }
    .upload-btn.drive-upload { background: var(--info); }
    .upload-btn.drive-upload:hover { background: #2563eb; }
    .upload-btn.web-upload { background: var(--purple); }
    .upload-btn.web-upload:hover { background: #7c3aed; }
    .upload-btn input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .upload-btn.loading { pointer-events: none; opacity: 0.7; }
    
    .image-preview { width: 100%; max-width: 200px; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; margin-top: 8px; display: none; background: var(--bg2); }
    .image-preview.show { display: block; }
    
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .btn-cancel { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--bg); color: var(--text); cursor: pointer; font-size: 12px; font-family: inherit; }
    .btn-submit { padding: 8px 16px; border-radius: 8px; border: none; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; cursor: pointer; font-size: 12px; font-weight: 600; font-family: inherit; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    
    @media (max-width: 650px) {
      .event-card { flex-wrap: wrap; gap: 10px; }
      .event-actions { width: 100%; justify-content: flex-end; }
      .image-input-row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <div class="floating-toast" id="floatingToast">
    <i id="toastIcon"></i>
    <span id="toastMessage"></span>
    <span class="toast-close" onclick="hideToast()"><i class="fa-solid fa-xmark"></i></span>
  </div>

  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/f57721_InShot_20260714_014548498.png" alt="لوگو"></div>
        <div><div class="header-title">مدیریت مراسمات</div></div>
      </div>
      <div class="header-btns">
        <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i></a>
        <button class="theme-toggle" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
        <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
      </div>
    </div>
  </header>

  <section class="main-container">
    <div class="page-title">
      <i class="fa-solid fa-calendar-check"></i> لیست مراسمات
      <button class="add-btn" id="addEventBtn"><i class="fa-solid fa-plus"></i> افزودن مراسم</button>
    </div>
    <div class="events-list" id="eventsList">
      <div style="text-align: center; padding: 32px; color: var(--text-light);"><i class="fa-solid fa-spinner fa-pulse"></i><p style="margin-top: 8px; font-size: 12px;">در حال بارگذاری...</p></div>
    </div>
  </section>

  <div class="modal-overlay" id="eventModal">
    <div class="modal">
      <h3 id="modalTitle"><i class="fa-solid fa-plus"></i> افزودن مراسم جدید</h3>
      <input type="hidden" id="editEventId">
      <div class="form-group"><label>عنوان</label><input type="text" class="form-input" id="eventTitle" placeholder="عنوان مراسم"></div>
      <div class="form-group">
        <label>پوستر مراسم <span class="hint">(لینک وارد کنید یا آپلود نمایید)</span></label>
        <div class="image-input-row">
          <input type="url" class="form-input" id="eventImage" placeholder="لینک تصویر...">
          <button type="button" class="upload-btn drive-upload" id="uploadDriveBtn" title="آپلود در گوگل درایو"><i class="fa-brands fa-google-drive"></i><input type="file" accept="image/*" id="driveFileInput"></button>
          <a href="https://imgurl.ir" target="_blank" class="upload-btn web-upload" title="آپلود در imgurl"><i class="fa-solid fa-cloud-arrow-up"></i></a>
        </div>
        <img src="" class="image-preview" id="imagePreview" alt="پیش‌نمایش">
      </div>
      <div class="form-group"><label>توضیحات</label><textarea class="form-textarea" id="eventDescription" placeholder="توضیحات مراسم..."></textarea></div>
      <div class="form-group"><label>تگ</label><input type="text" class="form-input" id="eventTag" placeholder="مثلاً: عزاداری، جشن، دعا"></div>
      <div class="form-group"><label>تاریخ برگزاری</label><input type="date" class="form-input" id="eventDate"></div>
      <div class="form-group"><label>مکان</label><input type="text" class="form-input" id="eventLocation" placeholder="مکان برگزاری"></div>
      <div class="modal-btns"><button class="btn-cancel" onclick="closeEventModal()">انصراف</button><button class="btn-submit" id="submitEvent">ذخیره</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3><i class="fa-solid fa-triangle-exclamation" style="color: var(--danger);"></i> حذف مراسم</h3>
      <p style="font-size: 13px; color: var(--text); margin-bottom: 16px;">آیا از حذف این مراسم اطمینان دارید؟</p>
      <input type="hidden" id="deleteEventId">
      <div class="modal-btns"><button class="btn-cancel" onclick="closeDeleteModal()">انصراف</button><button class="btn-submit" id="submitDelete" style="background: var(--danger);">حذف</button></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxieKNrkN-g2-WsVCOvIrRjNHcBM_6rh-LdY-UQRrmXXLnFjfqqndLTSeZh-R0ZqmjT/exec';
    
    const $ = (id) => document.getElementById(id);
    const toast = $('floatingToast'), toastIcon = $('toastIcon'), toastMessage = $('toastMessage');
    let toastTimer;
    
    function showToast(msg, type) {
      clearTimeout(toastTimer);
      toast.className = 'floating-toast ' + (type || 'error');
      const icons = { error: 'fa-circle-xmark', warning: 'fa-triangle-exclamation', success: 'fa-circle-check', info: 'fa-circle-info' };
      toastIcon.className = 'fa-solid ' + (icons[type] || icons.error);
      toastMessage.textContent = msg;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 5000);
    }
    
    function hideToast() { toast.classList.remove('show'); clearTimeout(toastTimer); }
    
    function checkSession() {
      const d = localStorage.getItem('admin_session');
      if (!d) { window.location.href = 'login.html'; return null; }
      try { const s = JSON.parse(d); if (Date.now() - s.timestamp > 1800000) { localStorage.clear(); window.location.href = 'login.html'; return null; } return s; }
      catch(e) { localStorage.clear(); window.location.href = 'login.html'; return null; }
    }
    
    const session = checkSession(); if (!session) throw new Error();
    const admin = session.admin;
    
    (function() {
      const t = localStorage.getItem('heyat-theme');
      if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); $('themeToggle').querySelector('i').className = 'fa-solid fa-sun'; }
      $('themeToggle').onclick = () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
        $('themeToggle').querySelector('i').className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        localStorage.setItem('heyat-theme', isDark ? 'light' : 'dark');
      };
    })();
    
    (async function() {
      try {
        const now = new Date();
        const d = String(now.getDate()).padStart(2,'0'), m = String(now.getMonth()+1).padStart(2,'0'), y = now.getFullYear();
        const r = await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
        const j = await r.json();
        if (j.code === 200 && j.data.hijri.month.number === 1) document.documentElement.setAttribute('data-muharram', 'true');
      } catch(e) {}
    })();
    
    $('logoutBtn').onclick = () => { localStorage.clear(); window.location.href = 'login.html'; };
    
    let allEvents = [];
    
    $('driveFileInput').onchange = async function() {
      const file = this.files[0]; if (!file) return;
      const btn = $('uploadDriveBtn'); btn.classList.add('loading'); const orig = btn.innerHTML; btn.innerHTML = '<i class="fa-solid fa-spinner fa-pulse"></i>';
      try {
        const reader = new FileReader();
        reader.onload = async function(e) {
          const base64 = e.target.result.split(',')[1];
          const res = await fetch(API_URL + '?action=uploadImage', { method: 'POST', body: JSON.stringify({ base64, mimeType: file.type, fileName: file.name }) });
          const data = await res.json();
          if (data.success) { $('eventImage').value = data.url; $('imagePreview').src = data.url; $('imagePreview').classList.add('show'); }
          else showToast('خطا در آپلود', 'error');
          btn.classList.remove('loading'); btn.innerHTML = orig; $('driveFileInput').value = '';
        };
        reader.readAsDataURL(file);
      } catch(e) { btn.classList.remove('loading'); btn.innerHTML = orig; }
    };
    
    $('eventImage').oninput = function() {
      const url = this.value.trim();
      if (url) { $('imagePreview').src = url; $('imagePreview').classList.add('show'); }
      else $('imagePreview').classList.remove('show');
    };
    
    async function loadEvents() {
      const list = $('eventsList');
      try {
        const res = await fetch(API_URL + '?action=getEvents');
        const data = await res.json();
        if (data.success && data.data.length > 0) {
          allEvents = data.data;
          list.innerHTML = allEvents.map((event, index) => {
            const d = new Date(event.date);
            return `<div class="event-card">
              ${event.image ? `<img src="${event.image}" class="event-image" alt="">` : `<div class="event-image placeholder"><i class="fa-solid fa-mosque"></i></div>`}
              <div class="event-info"><div class="event-name">${event.title}</div><div class="event-meta"><span><i class="fa-solid fa-clock"></i> ${d.toLocaleDateString('fa-IR')}</span><span><i class="fa-solid fa-location-dot"></i> ${event.location || 'نامشخص'}</span><span><i class="fa-solid fa-tag"></i> ${event.tag || 'بدون تگ'}</span></div></div>
              <div class="event-actions">
                <button class="action-btn edit-btn" data-index="${index}"><i class="fa-solid fa-pen-to-square"></i></button>
                <button class="action-btn delete delete-btn" data-index="${index}"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>`;
          }).join('');
          
          document.querySelectorAll('.edit-btn').forEach(btn => btn.onclick = function() { editEvent(allEvents[parseInt(this.dataset.index)]); });
          document.querySelectorAll('.delete-btn').forEach(btn => btn.onclick = function() { openDeleteModal(allEvents[parseInt(this.dataset.index)].id); });
        } else {
          list.innerHTML = `<div style="text-align: center; padding: 32px; color: var(--text-light);"><i class="fa-solid fa-calendar-xmark" style="font-size: 36px; margin-bottom: 8px; display: block;"></i><p style="font-size: 13px;">مراسمی ثبت نشده است</p></div>`;
        }
      } catch(e) { showToast('خطا در دریافت مراسمات', 'error'); }
    }
    
    function openAddModal() {
      $('modalTitle').innerHTML = '<i class="fa-solid fa-plus"></i> افزودن مراسم جدید';
      $('editEventId').value = ''; $('eventTitle').value = ''; $('eventImage').value = ''; $('eventDescription').value = ''; $('eventTag').value = ''; $('eventDate').value = ''; $('eventLocation').value = '';
      $('imagePreview').classList.remove('show'); $('eventModal').classList.add('active');
    }
    
    function editEvent(event) {
      $('modalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> ویرایش مراسم';
      $('editEventId').value = event.id; $('eventTitle').value = event.title; $('eventImage').value = event.image || ''; $('eventDescription').value = event.description || ''; $('eventTag').value = event.tag || ''; $('eventDate').value = event.date; $('eventLocation').value = event.location || '';
      if (event.image) { $('imagePreview').src = event.image; $('imagePreview').classList.add('show'); } else $('imagePreview').classList.remove('show');
      $('eventModal').classList.add('active');
    }
    
    function closeEventModal() { $('eventModal').classList.remove('active'); }
    
    $('addEventBtn').onclick = openAddModal;
    $('eventModal').onclick = (e) => { if (e.target === $('eventModal')) closeEventModal(); };
    
    $('submitEvent').onclick = async () => {
      const id = $('editEventId').value;
      const title = $('eventTitle').value.trim(), image = $('eventImage').value.trim(), description = $('eventDescription').value.trim(), tag = $('eventTag').value.trim(), date = $('eventDate').value, location = $('eventLocation').value.trim();
      if (!title || !date) { showToast('عنوان و تاریخ الزامی است', 'warning'); return; }
      
      $('submitEvent').disabled = true; $('submitEvent').textContent = 'در حال ذخیره...';
      try {
        const newId = id || ('EVT-' + Date.now());
        const res = await fetch(API_URL + '?action=' + (id ? 'updateEvent' : 'addEvent'), { method: 'POST', body: JSON.stringify({ id: newId, title, image, description, tag, date, location }) });
        const data = await res.json();
        if (data.success) { closeEventModal(); loadEvents(); showToast(id ? 'مراسم ویرایش شد' : 'مراسم اضافه شد', 'success'); }
        else showToast(data.message || 'خطا', 'error');
      } catch(e) { showToast('خطای سرور', 'error'); }
      $('submitEvent').disabled = false; $('submitEvent').textContent = 'ذخیره';
    };
    
    function openDeleteModal(eventId) { $('deleteEventId').value = eventId; $('deleteModal').classList.add('active'); }
    function closeDeleteModal() { $('deleteModal').classList.remove('active'); }
    $('deleteModal').onclick = (e) => { if (e.target === $('deleteModal')) closeDeleteModal(); };
    
    $('submitDelete').onclick = async () => {
      const eventId = $('deleteEventId').value;
      $('submitDelete').disabled = true; $('submitDelete').textContent = 'در حال حذف...';
      try {
        const res = await fetch(API_URL + '?action=deleteEvent', { method: 'POST', body: JSON.stringify({ id: eventId }) });
        const data = await res.json();
        if (data.success) { closeDeleteModal(); loadEvents(); showToast('مراسم حذف شد', 'success'); }
        else showToast(data.message || 'خطا', 'error');
      } catch(e) { showToast('خطای سرور', 'error'); }
      $('submitDelete').disabled = false; $('submitDelete').textContent = 'حذف';
    };
    
    loadEvents();
  </script>

</body>
</html>
