<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نشانی ما | شهدای گمنام شورابیل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #f8fafc; --bg2: #f1f5f9; --bg3: #e2e8f0;
      --primary: #0d9488; --primary-dark: #0f766e; --primary-light: #5eead4;
      --primary-rgb: 13, 148, 136; --dark: #0f172a; --text: #334155;
      --text-light: #94a3b8; --white: #ffffff; --card-bg: #ffffff;
      --card-border: #e2e8f0; --shadow: 0 2px 12px rgba(0,0,0,0.04);
      --header-bg: #ffffff; --footer-bg: #ffffff; --logo-filter: none;
    }
    
    [data-theme="dark"] {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
      --primary: #14b8a6; --primary-dark: #0d9488; --primary-light: #5eead4;
      --primary-rgb: 20, 184, 166; --dark: #f1f5f9; --text: #cbd5e1;
      --text-light: #64748b; --white: #1e293b; --card-bg: #1e293b;
      --card-border: #334155; --shadow: 0 2px 12px rgba(0,0,0,0.3);
      --header-bg: #1e293b; --footer-bg: #1e293b;
      --logo-filter: brightness(0) invert(1);
    }
    
    [data-muharram="true"] {
      --primary: #dc2626; --primary-dark: #b91c1c; --primary-light: #fca5a5;
      --primary-rgb: 220, 38, 38;
    }
    
    [data-theme="dark"][data-muharram="true"] {
      --primary: #ef4444; --primary-dark: #dc2626; --primary-light: #fca5a5;
      --primary-rgb: 239, 68, 68;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      transition: all 0.3s ease;
    }
    
    .header {
      background: var(--header-bg); box-shadow: 0 1px 8px rgba(0,0,0,0.03);
      padding: 14px 20px; position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--bg3); transition: all 0.3s ease;
    }
    
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; max-width: 1100px; margin: 0 auto;
    }
    
    .header-right { display: flex; align-items: center; gap: 10px; }
    
    .header-logo {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 12px rgba(var(--primary-rgb), 0.2);
      overflow: hidden; padding: 6px;
    }
    
    .header-logo img { width: 100%; height: 100%; object-fit: contain; filter: var(--logo-filter); }
    .header-title { font-size: 20px; font-weight: 700; color: var(--dark); transition: color 0.3s; }
    .header-subtitle { font-size: 10px; color: var(--text-light); transition: color 0.3s; }
    .header-btns { display: flex; align-items: center; gap: 8px; }
    
    .back-btn {
      background: var(--bg2); border: none; padding: 10px; border-radius: 50%;
      cursor: pointer; font-size: 18px; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; text-decoration: none; transition: all 0.3s ease;
    }
    .back-btn:hover { background: var(--primary); color: #fff; }
    
    .theme-toggle {
      background: var(--bg2); border: none; padding: 10px; border-radius: 50%;
      cursor: pointer; font-size: 18px; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; transition: all 0.3s ease;
    }
    .theme-toggle:hover { background: var(--primary); color: #fff; transform: rotate(15deg); }
    
    .main-container { flex: 1; max-width: 800px; width: 100%; margin: 24px auto; padding: 0 12px; }
    
    .page-title { font-size: 18px; font-weight: 700; color: var(--dark); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; transition: color 0.3s; }
    
    .info-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; padding: 20px; margin-bottom: 14px;
      box-shadow: var(--shadow); transition: all 0.3s ease;
    }
    
    .info-card-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    
    .info-card-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; flex-shrink: 0;
    }
    
    .info-card-title { font-size: 15px; font-weight: 700; color: var(--dark); transition: color 0.3s; }
    
    .info-card-content {
      font-size: 13px; color: var(--text); line-height: 1.8;
      padding: 14px; background: var(--bg2); border-radius: 10px;
      transition: color 0.3s;
    }
    
    .copy-row {
      display: flex; align-items: center; gap: 8px; margin-top: 10px;
    }
    
    .copy-btn {
      padding: 8px 16px; border-radius: 8px; border: none;
      background: var(--primary); color: #fff; cursor: pointer;
      font-size: 12px; font-weight: 600; font-family: inherit;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.3s ease;
    }
    .copy-btn:hover { background: var(--primary-dark); }
    .copy-btn.copied { background: #10b981; }
    
    .map-container {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
      height: 450px;
    }
    .map-container iframe { width: 100%; height: 100%; border: none; }
    
    .footer {
      text-align: center; padding: 20px; background: var(--footer-bg);
      border-top: 1px solid var(--bg3); margin-top: auto; transition: all 0.3s ease;
    }
    .footer-links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
    .footer-links a { color: var(--primary-dark); font-size: 11px; text-decoration: none; display: flex; align-items: center; gap: 4px; transition: color 0.3s; }
    .footer-links a:hover { color: var(--dark); }
    .footer-text { font-size: 10px; color: var(--text-light); transition: color 0.3s; }
    
    @media (max-width: 650px) {
      .header-title { font-size: 17px; }
      .map-container { height: 350px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <div class="header-logo">
          <img src="https://cdn.imgurl.ir/uploads/f57721_InShot_20260714_014548498.png" alt="لوگو">
        </div>
        <div>
          <div class="header-title">شهدای گمنام شورابیل</div>
          <div class="header-subtitle">سایت رسمی اطلاع رسانی و گزارش مراسمات</div>
        </div>
      </div>
      <div class="header-btns">
        <a href="../dashboard/" class="back-btn" title="بازگشت"><i class="fa-solid fa-arrow-right"></i></a>
        <button class="theme-toggle" id="themeToggle" title="تغییر تم"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <section class="main-container">
    
    <div class="page-title"><i class="fa-solid fa-location-dot"></i> نشانی ما</div>
    
    <div class="info-card">
      <div class="info-card-header">
        <div class="info-card-icon"><i class="fa-solid fa-map-pin"></i></div>
        <div class="info-card-title">آدرس</div>
      </div>
      <div class="info-card-content">اردبیل، شورابیل، شهدای گمنام شورابیل</div>
      <div class="copy-row">
        <button class="copy-btn" onclick="copyText('اردبیل، شورابیل، شهدای گمنام شورابیل', this)"><i class="fa-solid fa-copy"></i> کپی آدرس</button>
      </div>
    </div>
    
    <div class="info-card">
      <div class="info-card-header">
        <div class="info-card-icon"><i class="fa-solid fa-compass"></i></div>
        <div class="info-card-title">مختصات دقیق</div>
      </div>
      <div class="info-card-content">38.217378, 48.294300</div>
      <div class="copy-row">
        <button class="copy-btn" onclick="copyText('38.217378, 48.294300', this)"><i class="fa-solid fa-copy"></i> کپی مختصات</button>
        <button class="copy-btn" onclick="copyText('38°13\'02.6\"N 48°17\'39.5\"E', this)"><i class="fa-solid fa-copy"></i> کپی فرمت GPS</button>
      </div>
    </div>
    
    <div class="map-container">
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3180.6!2d48.2943!3d38.2174!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzjCsDEzJzAyLjYiTiA0OMKwMTcnMzkuNSJF!5e0!3m2!1sen!2s!4v1620000000000"
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

  </section>

  <footer class="footer">
    <div class="footer-links">
      <a href="../Contact/"><i class="fa-solid fa-phone"></i> ارتباط با ما</a>
      <a href="../Address/"><i class="fa-solid fa-location-dot"></i> نشانی ما</a>
    </div>
    <p class="footer-text">خادمین شهدای گمنام شورابیل — کلیه حقوق محفوظ است</p>
  </footer>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const icon = themeToggle.querySelector('i');
    
    const savedTheme = localStorage.getItem('heyat-theme');
    if (savedTheme === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); icon.classList.replace('fa-moon', 'fa-sun'); }
    
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      icon.className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
      localStorage.setItem('heyat-theme', isDark ? 'light' : 'dark');
    });
    
    (async function() {
      try {
        const now = new Date();
        const d = String(now.getDate()).padStart(2,'0'), m = String(now.getMonth()+1).padStart(2,'0'), y = now.getFullYear();
        const r = await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
        const j = await r.json();
        if (j.code === 200 && j.data.hijri.month.number === 1) document.documentElement.setAttribute('data-muharram', 'true');
      } catch(e) {}
    })();
    
    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> کپی شد';
        btn.classList.add('copied');
        setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 2000);
      });
    }
  </script>

</body>
</html>
