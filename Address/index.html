<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نشانی ما | شهدای گمنام شورابیل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #f8fafc; --bg2: #f1f5f9; --bg3: #e2e8f0;
      --primary: #0d9488; --primary-dark: #0f766e; --primary-light: #5eead4;
      --primary-rgb: 13, 148, 136; --dark: #0f172a; --text: #334155;
      --text-light: #94a3b8; --white: #ffffff; --card-bg: #ffffff;
      --card-border: #e2e8f0; --shadow: 0 2px 12px #000000;
      --header-bg: #ffffff; --footer-bg: #ffffff; --logo-filter: none;
    }
    
    [data-theme="dark"] {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
      --primary: #14b8a6; --primary-dark: #0d9488; --primary-light: #5eead4;
      --primary-rgb: 20, 184, 166; --dark: #f1f5f9; --text: #cbd5e1;
      --text-light: #64748b; --white: #1e293b; --card-bg: #1e293b;
      --card-border: #334155; --shadow: 0 2px 12px #000000;
      --header-bg: #1e293b; --footer-bg: #1e293b;
      --logo-filter: brightness(0) invert(1);
    }
    
    [data-muharram="true"] {
      --primary: #dc2626; --primary-dark: #b91c1c; --primary-light: #fca5a5;
      --primary-rgb: 220, 38, 38;
    }
    
    [data-theme="dark"][data-muharram="true"] {
      --primary: #ef4444; --primary-dark: #dc2626; --primary-light: #fca5a5;
      --primary-rgb: 239, 68, 68;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      transition: all 0.3s ease;
    }
    
    .header {
      background: var(--header-bg); box-shadow: 0 1px 8px #000000;
      padding: 14px 20px; position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--bg3); transition: all 0.3s ease;
    }
    
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; max-width: 1100px; margin: 0 auto;
    }
    
    .header-right { display: flex; align-items: center; gap: 10px; }
    
    .header-logo {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 12px #000000;
      overflow: hidden; padding: 6px;
    }
    
    .header-logo img { width: 100%; height: 100%; object-fit: contain; filter: var(--logo-filter); }
    .header-title { font-size: 16px; font-weight: 700; color: var(--dark); transition: color 0.3s; }
    .header-subtitle { font-size: 8px; color: var(--text-light); transition: color 0.3s; }
    .header-btns { display: flex; align-items: center; gap: 8px; }
    
    .back-btn, .theme-toggle {
      background: var(--bg2); border: none; padding: 10px; border-radius: 50%;
      cursor: pointer; font-size: 18px; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; transition: all 0.3s ease; text-decoration: none;
    }
    .back-btn:hover, .theme-toggle:hover { background: var(--primary); color: #fff; }
    .theme-toggle:hover { transform: rotate(15deg); }
    
    .main-container { flex: 1; max-width: 800px; width: 100%; margin: 24px auto; padding: 0 12px 80px; }
    
    .page-header {
      text-align: center; margin-bottom: 28px;
    }
    
    .page-icon {
      width: 64px; height: 64px; margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 26px; color: #fff;
      box-shadow: 0 8px 24px #000000;
    }
    
    .page-title {
      font-size: 20px; font-weight: 800; color: var(--dark);
      margin-bottom: 4px;
    }
    
    .page-subtitle {
      font-size: 11px; color: var(--text-light);
    }
    
    .cards-row {
      display: flex; gap: 12px; margin-bottom: 20px;
    }
    
    .info-card {
      flex: 1; background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 18px; box-shadow: var(--shadow);
      transition: all 0.3s ease; position: relative; overflow: hidden;
    }
    
    .info-card-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: rgba(var(--primary-rgb), 0.1);
      display: flex; align-items: center; justify-content: center;
      color: var(--primary); font-size: 18px; margin-bottom: 12px;
    }
    
    .info-card-label {
      font-size: 10px; color: var(--text-light); margin-bottom: 6px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    }
    
    .info-card-value {
      font-size: 13px; font-weight: 700; color: var(--dark);
      line-height: 1.6; margin-bottom: 12px;
    }
    
    .copy-btn {
      padding: 6px 14px; border-radius: 8px; border: none;
      background: rgba(var(--primary-rgb), 0.1); color: var(--primary-dark);
      cursor: pointer; font-size: 11px; font-weight: 600; font-family: inherit;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.3s ease;
    }
    .copy-btn:hover { background: var(--primary); color: #fff; }
    .copy-btn.copied { background: #10b981; color: #fff; }
    
    .map-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 20px; overflow: hidden; box-shadow: var(--shadow);
      height: 400px;
    }
    .map-card iframe { width: 100%; height: 100%; border: none; }
    
    .action-buttons {
      display: flex; gap: 10px; margin-top: 16px;
    }
    
    .action-btn {
      flex: 1; padding: 12px; border-radius: 14px; border: none;
      font-size: 12px; font-weight: 700; font-family: inherit;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 8px; transition: all 0.3s ease; text-decoration: none;
      background: var(--card-bg); color: var(--primary-dark);
      border: 1px solid var(--card-border); box-shadow: var(--shadow);
    }
    .action-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    
    .floating-actions {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 12px;
      z-index: 998;
    }
    
    .floating-btn {
      width: 48px;
      height: 48px;
      border-radius: 24px;
      background: var(--primary);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0;
      overflow: hidden;
      white-space: nowrap;
      transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2), border-radius 0.4s ease;
      box-shadow: 0 2px 12px #000000;
      position: relative;
      direction: rtl;
      font-family: inherit;
    }
    
    .floating-btn i {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      position: absolute;
      right: 0;
      top: 0;
    }
    
    .floating-btn .btn-text {
      opacity: 0;
      padding: 0 56px 0 18px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      direction: rtl;
      text-align: right;
    }
    
    .floating-btn.expanded {
      width: 150px;
      border-radius: 24px;
    }
    
    .floating-btn.expanded .btn-text {
      opacity: 1;
    }
    
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      background: #fff;
      margin-right: 2px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    .footer {
      text-align: center;
      padding: 20px;
      background: var(--footer-bg);
      border-top: 1px solid var(--bg3);
      transition: all 0.3s ease;
      margin-top: auto;
    }
    
    .footer-text { font-size: 10px; color: var(--text-light); }
    
    @media (max-width: 650px) {
      .cards-row { flex-direction: column; }
      .header-title { font-size: 14px; }
      .header-subtitle { font-size: 7px; }
      .map-card { height: 300px; }
      .floating-actions { bottom: 16px; right: 12px; gap: 8px; }
      .floating-btn { width: 42px; height: 42px; }
      .floating-btn i { width: 42px; height: 42px; font-size: 16px; }
      .floating-btn .btn-text { padding: 0 48px 0 14px; font-size: 11px; }
      .floating-btn.expanded { width: 135px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <div class="header-logo">
          <img src="https://cdn.imgurl.ir/uploads/f57721_InShot_20260714_014548498.png" alt="لوگو">
        </div>
        <div>
          <div class="header-title">شهدای گمنام شورابیل</div>
          <div class="header-subtitle">سایت رسمی اطلاع رسانی و گزارش مراسمات</div>
        </div>
      </div>
      <div class="header-btns">
        <a href="../dashboard/" class="back-btn" title="بازگشت"><i class="fa-solid fa-arrow-right"></i></a>
        <button class="theme-toggle" id="themeToggle" title="تغییر تم"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <section class="main-container">
    
    <div class="page-header">
      <div class="page-icon"><i class="fa-solid fa-location-dot"></i></div>
      <div class="page-title">نشانی ما</div>
      <div class="page-subtitle">مزار شهدای گمنام — اردبیل، شورابیل</div>
    </div>
    
    <div class="cards-row">
      <div class="info-card">
        <div class="info-card-icon"><i class="fa-solid fa-map-pin"></i></div>
        <div class="info-card-label">آدرس</div>
        <div class="info-card-value">اردبیل، شورابیل، مزار شهدای گمنام شورابیل</div>
        <button class="copy-btn" onclick="copyText('اردبیل، شورابیل، مزار شهدای گمنام شورابیل', this)"><i class="fa-solid fa-copy"></i> کپی</button>
      </div>
      
      <div class="info-card">
        <div class="info-card-icon"><i class="fa-solid fa-compass"></i></div>
        <div class="info-card-label">مختصات</div>
        <div class="info-card-value">38.217378, 48.294300</div>
        <button class="copy-btn" onclick="copyText('38.217378, 48.294300', this)"><i class="fa-solid fa-copy"></i> کپی</button>
      </div>
    </div>
    
    <div class="map-card">
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3180.6!2d48.2943!3d38.2174!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzjCsDEzJzAyLjYiTiA0OMKwMTcnMzkuNSJF!5e0!3m2!1sen!2s!4v1620000000000"
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>
    
    <div class="action-buttons">
      <a href="https://www.google.com/maps/dir/?api=1&destination=38.217378,48.294300" target="_blank" class="action-btn">
        <i class="fa-solid fa-route"></i> مسیریابی گوگل مپ
      </a>
      <a href="https://nshn.ir/destination?lat=38.217378&lng=48.294300" target="_blank" class="action-btn">
        <i class="fa-solid fa-map-location-dot"></i> نشان
      </a>
      <a href="https://balad.ir/destination?lat=38.217378&lng=48.294300" target="_blank" class="action-btn">
        <i class="fa-solid fa-location-arrow"></i> بلد
      </a>
    </div>

  </section>

  <div class="floating-actions">
    <button class="floating-btn" id="floatingPhone" onclick="window.location.href='../Contact/'" title="ارتباط با ما">
      <span class="btn-text" id="phoneText"></span>
      <i class="fa-solid fa-phone"></i>
    </button>
    <button class="floating-btn" id="floatingAddress" onclick="window.location.href='../Address/'" title="نشانی ما">
      <span class="btn-text" id="addressText"></span>
      <i class="fa-solid fa-location-dot"></i>
    </button>
  </div>

  <footer class="footer">
    <p class="footer-text">خادمین شهدای گمنام شورابیل — کلیه حقوق محفوظ است</p>
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const themeToggle = $('themeToggle');
    const icon = themeToggle.querySelector('i');
    
    const savedTheme = localStorage.getItem('heyat-theme');
    if (savedTheme === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); icon.classList.replace('fa-moon', 'fa-sun'); }
    
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      icon.className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
      localStorage.setItem('heyat-theme', isDark ? 'light' : 'dark');
    });
    
    (async function() {
      try {
        const now = new Date();
        const d = String(now.getDate()).padStart(2,'0'), m = String(now.getMonth()+1).padStart(2,'0'), y = now.getFullYear();
        const r = await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
        const j = await r.json();
        if (j.code === 200 && j.data.hijri.month.number === 1) document.documentElement.setAttribute('data-muharram', 'true');
      } catch(e) {}
    })();
    
    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> کپی شد';
        btn.classList.add('copied');
        setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 2000);
      });
    }
    
    function typeText(element, text, callback) {
      let i = 0;
      element.innerHTML = '<span class="typing-cursor"></span>';
      const cursor = element.querySelector('.typing-cursor');
      
      function type() {
        if (i < text.length) {
          cursor.insertAdjacentText('beforebegin', text[i]);
          i++;
          setTimeout(type, 80);
        } else {
          cursor.remove();
          if (callback) setTimeout(callback, 2000);
        }
      }
      type();
    }
    
    function clearText(element, callback) {
      element.textContent = '';
      if (callback) callback();
    }
    
    function animateFloatingButtons() {
      const phoneBtn = $('floatingPhone');
      const addrBtn = $('floatingAddress');
      const phoneText = $('phoneText');
      const addrText = $('addressText');
      
      if (!phoneBtn || !addrBtn) return;
      
      let toggle = true;
      
      function cycle() {
        if (toggle) {
          if (addrBtn.classList.contains('expanded')) {
            clearText(addrText);
            addrBtn.classList.remove('expanded');
          }
          setTimeout(() => {
            phoneBtn.classList.add('expanded');
            typeText(phoneText, 'ارتباط با ما', () => {
              clearText(phoneText);
              phoneBtn.classList.remove('expanded');
            });
          }, 400);
        } else {
          if (phoneBtn.classList.contains('expanded')) {
            clearText(phoneText);
            phoneBtn.classList.remove('expanded');
          }
          setTimeout(() => {
            addrBtn.classList.add('expanded');
            typeText(addrText, 'نشانی ما', () => {
              clearText(addrText);
              addrBtn.classList.remove('expanded');
            });
          }, 400);
        }
        toggle = !toggle;
      }
      
      cycle();
      setInterval(cycle, 5000);
    }
    
    setTimeout(animateFloatingButtons, 1000);
  </script>

  <script src="../music.js"></script>
</body>
</html>
