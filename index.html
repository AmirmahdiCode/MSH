<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شهدای گمنام شورابیل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --primary-rgb: 13, 148, 136;
    }
    
    [data-muharram="true"] {
      --primary: #dc2626;
      --primary-dark: #b91c1c;
      --primary-rgb: 220, 38, 38;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .splash {
      text-align: center;
      animation: fadeOut 0.8s ease forwards;
      animation-delay: 3s;
      opacity: 1;
    }
    
    @keyframes fadeOut {
      to { opacity: 0; transform: scale(1.1); }
    }
    
    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    
    .particle {
      position: absolute;
      background: rgba(var(--primary-rgb), 0.15);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 0.5; }
      100% { transform: translateY(-120px) scale(0.5); opacity: 0; }
    }
    
    .logo-wrapper {
      width: 110px;
      height: 110px;
      margin: 0 auto 24px;
      border-radius: 30px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 60px rgba(var(--primary-rgb), 0.5), 0 0 120px rgba(var(--primary-rgb), 0.2);
      animation: logoPulse 2s ease-in-out infinite;
      overflow: hidden;
      padding: 14px;
    }
    
    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }
    
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(var(--primary-rgb), 0.5), 0 0 120px rgba(var(--primary-rgb), 0.2); }
      50% { transform: scale(1.05); box-shadow: 0 0 80px rgba(var(--primary-rgb), 0.7), 0 0 160px rgba(var(--primary-rgb), 0.3); }
    }
    
    .title {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: 1px;
      animation: slideUp 1s ease forwards;
      opacity: 0;
      animation-delay: 0.5s;
    }
    
    .subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 32px;
      animation: slideUp 1s ease forwards;
      opacity: 0;
      animation-delay: 0.8s;
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .zikr {
      font-size: 16px;
      color: rgba(var(--primary-rgb), 0.8);
      animation: slideUp 1s ease forwards, zikrGlow 2s ease-in-out infinite;
      opacity: 0;
      animation-delay: 1.2s;
    }
    
    @keyframes zikrGlow {
      0%, 100% { color: rgba(var(--primary-rgb), 0.6); }
      50% { color: rgba(var(--primary-rgb), 1); }
    }
    
    .spinner-ring {
      width: 40px;
      height: 40px;
      margin: 24px auto 0;
      border: 2px solid rgba(var(--primary-rgb), 0.15);
      border-top-color: rgba(var(--primary-rgb), 0.8);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <div class="splash" id="splash">
    <div class="logo-wrapper">
      <img src="https://cdn.imgurl.ir/uploads/f57721_InShot_20260714_014548498.png" alt="لوگو">
    </div>
    <div class="title">شهدای گمنام شورابیل</div>
    <div class="subtitle">سایت رسمی اطلاع رسانی و گزارش مراسمات</div>
    <div class="zikr">السلام علیک یا اباعبدالله الحسین (ع)</div>
    <div class="spinner-ring"></div>
  </div>

  <script>
    (async function() {
      try {
        const now = new Date();
        const d = String(now.getDate()).padStart(2,'0'), m = String(now.getMonth()+1).padStart(2,'0'), y = now.getFullYear();
        const r = await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
        const j = await r.json();
        if (j.code === 200 && j.data.hijri.month.number === 1) {
          document.documentElement.setAttribute('data-muharram', 'true');
          document.querySelector('.zikr').textContent = 'السلام علیک یا ثارالله و ابن ثاره';
        }
      } catch(e) {}
    })();
    
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      const size = Math.random() * 8 + 3;
      particle.style.cssText = `
        width: ${size}px; height: ${size}px;
        top: ${Math.random() * 100}%;
        left: ${Math.random() * 100}%;
        animation-delay: ${Math.random() * 6}s;
        animation-duration: ${Math.random() * 4 + 4}s;
      `;
      particlesContainer.appendChild(particle);
    }
    
    setTimeout(() => {
      window.location.href = 'dashboard/';
    }, 3800);
  </script>

</body>
</html>
