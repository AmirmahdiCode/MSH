<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شهدای گمنام شورابیل</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{
  --accent:#1e7a5a;
  --accent-soft:#2fa87d;
  --accent-glow:rgba(47,168,125,.45);
  --accent-line:rgba(30,122,90,.25);
  --text:#1a2e26;
  --text-soft:rgba(26,46,38,.6);
  --glass-bg:rgba(255,255,255,.55);
  --glass-bg-strong:rgba(255,255,255,.68);
  --glass-border:rgba(30,122,90,.18);
  --glass-shadow:0 8px 32px rgba(30,122,90,.12);
  --radius:18px;
  --radius-sm:16px;
  --font:'Vazirmatn',Tahoma,sans-serif;
}

[data-season="muharram"]{
  --accent:#a82f2f;
  --accent-soft:#c95a5a;
  --accent-glow:rgba(168,47,47,.45);
  --accent-line:rgba(168,47,47,.25);
  --glass-border:rgba(168,47,47,.18);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{height:100%;}

body{
  font-family:var(--font);
  background:#fdfcf9;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  transition:background 1s ease,color .5s ease;
  position:relative;
}

[data-season="muharram"] body{
  background:#fdf9f9;
}

.bg-orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;animation:floatOrb 22s ease-in-out infinite;}
.orb:nth-child(1){width:320px;height:320px;background:var(--accent-soft);top:-100px;right:-80px;animation-delay:0s;}
.orb:nth-child(2){width:260px;height:260px;background:var(--accent);bottom:-80px;left:-60px;animation-delay:-8s;}
.orb:nth-child(3){width:200px;height:200px;background:var(--accent-soft);top:45%;left:35%;animation-delay:-15s;opacity:.15;}

@keyframes floatOrb{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(30px,-40px) scale(1.15);}
}

.header{
  position:fixed;
  top:3px;right:3px;left:3px;
  z-index:100;
  border-radius:var(--radius);
  background:var(--glass-bg-strong);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  padding:12px 16px;
  display:flex;align-items:center;gap:12px;
  animation:headerEnter .8s cubic-bezier(.2,.8,.2,1);
  transition:background .5s ease,border .5s ease;
}
@keyframes headerEnter{
  from{opacity:0;transform:translateY(-20px);}
  to{opacity:1;transform:translateY(0);}
}

.header-logo{
  width:48px;height:48px;
  object-fit:contain;
  flex-shrink:0;
  filter:drop-shadow(0 0 10px var(--accent-glow));
  animation:logoGlow 3.5s ease-in-out infinite;
}
@keyframes logoGlow{
  0%,100%{filter:drop-shadow(0 0 8px var(--accent-glow));}
  50%{filter:drop-shadow(0 0 16px var(--accent-glow));}
}

.header-text{display:flex;flex-direction:column;gap:2px;overflow:hidden;}
.header-title{
  font-size:16px;font-weight:800;
  color:var(--text);
  letter-spacing:.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  animation:titleFade .9s ease .2s backwards;
}
.header-subtitle{
  font-size:10px;
  color:var(--text-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  animation:titleFade .9s ease .35s backwards;
}
@keyframes titleFade{
  from{opacity:0;transform:translateX(8px);}
  to{opacity:1;transform:translateX(0);}
}

.header-sub{
  position:fixed;
  top:80px;right:3px;left:3px;
  z-index:99;
  border-radius:var(--radius-sm);
  background:var(--glass-bg);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  padding:4px 10px;
  display:flex;align-items:center;
  gap:6px;
  animation:headerEnter .8s cubic-bezier(.2,.8,.2,1) .15s backwards;
  transition:background .5s ease,border .5s ease;
}

.sub-profile{
  flex:0 0 50%;
  display:flex;align-items:center;gap:7px;
  padding:4px 8px;
  border-radius:10px;
  background:transparent;
  border:none;
  cursor:pointer;
  transition:all .3s ease;
  animation:itemSlide .6s ease .3s backwards;
}
.sub-profile:hover{background:rgba(47,168,125,.08);}
.sub-profile:active{transform:scale(.97);}

.profile-avatar{
  width:26px;height:26px;border-radius:50%;
  background:transparent;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--accent);
  flex-shrink:0;
  overflow:hidden;
}
.profile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}

.profile-name{
  font-size:11px;font-weight:700;
  color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.sub-notif{
  flex:0 0 25%;
  display:flex;align-items:center;justify-content:center;gap:5px;
  padding:4px 8px;
  border-radius:10px;
  background:transparent;
  border:none;
  cursor:pointer;
  font-size:11px;font-weight:700;
  color:var(--text);
  transition:all .3s ease;
  position:relative;
  animation:itemSlide .6s ease .4s backwards;
}
.sub-notif:hover{background:rgba(47,168,125,.08);}
.sub-notif:active{transform:scale(.97);}
.sub-notif i{font-size:13px;color:var(--accent);}
.sub-notif .badge{
  position:absolute;top:0;right:2px;
  min-width:14px;height:14px;
  border-radius:7px;
  background:var(--accent);
  color:#fff;
  font-size:8px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  padding:0 3px;
  animation:badgePulse 2s ease-in-out infinite;
}
@keyframes badgePulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.15);}
}

.sub-actions{
  flex:0 0 25%;
  display:flex;align-items:center;gap:6px;
  animation:itemSlide .6s ease .5s backwards;
}

.icon-btn{
  flex:1;
  aspect-ratio:1;
  max-height:26px;
  border-radius:50%;
  background:transparent;
  border:none;
  color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:all .3s ease;
}
.icon-btn:hover{background:rgba(47,168,125,.1);}
.icon-btn:active{transform:scale(.9);}
.icon-btn i{font-size:13px;color:var(--accent);}

@keyframes itemSlide{
  from{opacity:0;transform:translateX(15px);}
  to{opacity:1;transform:translateX(0);}
}

.main{
  position:relative;z-index:5;
  padding:135px 12px 110px;
  min-height:100vh;
}

.footer{
  position:fixed;
  bottom:8px;right:5%;left:5%;width:90%;
  margin:0 auto;
  z-index:999;
  border-radius:25px;
  background:var(--glass-bg-strong);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--accent-line);
  box-shadow:0 4px 20px rgba(30,122,90,.10);
  padding:4px 0;
  display:flex;justify-content:space-around;align-items:center;
  animation:footerEnter .8s cubic-bezier(.2,.8,.2,1) .3s backwards;
  transition:background .5s ease,border .5s ease;
}
@keyframes footerEnter{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}

.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  background:none;border:none;
  color:var(--text-soft);
  font-family:var(--font);
  cursor:pointer;
  padding:4px 10px;
  border-radius:12px;
  transition:all .2s ease;
}
.nav-item i{
  font-size:20px;
  transition:all .3s ease;
  color:var(--text-soft);
}
.nav-item span{font-size:7px;font-weight:600;}
.nav-item:active{transform:scale(.9);}
.nav-item.active{color:var(--accent);}
.nav-item.active i{
  color:var(--accent);
  filter:drop-shadow(0 0 6px var(--accent-glow));
}
</style>
</head>
<body data-season="normal">

<div class="bg-orbs">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>

<header class="header">
  <img src="images/logo.png" alt="لوگو" class="header-logo">
  <div class="header-text">
    <div class="header-title">شهدای گمنام شورابیل</div>
    <div class="header-subtitle">سایت رسمی شهدای گمنام شورابیل</div>
  </div>
</header>

<div class="header-sub">
  <div class="sub-profile" id="subProfile">
    <div class="profile-avatar"><i class="fa-solid fa-user-plus fa-jello"></i></div>
    <span class="profile-name">ثبت پروفایل</span>
  </div>

  <div class="sub-notif" id="subNotif">
    <i class="fa-solid fa-bell fa-float"></i>
    <span>اعلان‌ها</span>
    <span class="badge">3</span>
  </div>

  <div class="sub-actions">
    <button class="icon-btn" id="btnMusic" aria-label="موسیقی">
      <i class="fa-solid fa-music fa-float"></i>
    </button>
    <button class="icon-btn" id="btnTheme" aria-label="تغییر تم">
      <i class="fa-solid fa-moon fa-float"></i>
    </button>
  </div>
</div>

<main class="main"></main>

<footer class="footer">
  <button class="nav-item active">
    <i class="fa-solid fa-house fa-bounce"></i>
    <span>خانه</span>
  </button>
  <button class="nav-item">
    <i class="fa-solid fa-calendar fa-float"></i>
    <span>رویداد</span>
  </button>
  <button class="nav-item">
    <i class="fa-solid fa-user fa-float"></i>
    <span>پروفایل</span>
  </button>
  <button class="nav-item">
    <i class="fa-solid fa-photo-film fa-float"></i>
    <span>اکسپلور</span>
  </button>
  <button class="nav-item">
    <i class="fa-solid fa-book-bookmark fa-float"></i>
    <span>کتابخانه</span>
  </button>
</footer>

<script>
(function(){
  'use strict';

  var body = document.body;

  function taghirinClassIcon(el, classJadid){
    el.className = classJadid;
  }

  function gereftanTheme(){
    return localStorage.getItem('shohada-theme') || 'light';
  }

  function zakhireTheme(v){
    localStorage.setItem('shohada-theme', v);
  }

  var btnTheme = document.getElementById('btnTheme');
  var themeIcon = btnTheme.querySelector('i');

  function aemalTheme(t){
    if(t === 'dark'){
      body.style.background = '#0d1f18';
      body.style.color = '#e8f5ef';
      document.documentElement.style.setProperty('--text','#e8f5ef');
      document.documentElement.style.setProperty('--text-soft','rgba(232,245,239,.6)');
      document.documentElement.style.setProperty('--glass-bg','rgba(20,40,32,.55)');
      document.documentElement.style.setProperty('--glass-bg-strong','rgba(20,40,32,.72)');
      document.documentElement.style.setProperty('--accent-soft','#5fd0a4');
      document.documentElement.style.setProperty('--accent-glow','rgba(95,208,164,.5)');
      taghirinClassIcon(themeIcon, 'fa-solid fa-sun fa-float');
    } else {
      body.style.background = '#fdfcf9';
      body.style.color = '#1a2e26';
      document.documentElement.style.setProperty('--text','#1a2e26');
      document.documentElement.style.setProperty('--text-soft','rgba(26,46,38,.6)');
      document.documentElement.style.setProperty('--glass-bg','rgba(255,255,255,.55)');
      document.documentElement.style.setProperty('--glass-bg-strong','rgba(255,255,255,.68)');
      document.documentElement.style.setProperty('--accent-soft','#2fa87d');
      document.documentElement.style.setProperty('--accent-glow','rgba(47,168,125,.45)');
      taghirinClassIcon(themeIcon, 'fa-solid fa-moon fa-float');
    }
  }

  aemalTheme(gereftanTheme());

  btnTheme.addEventListener('click', function(){
    var jadid = gereftanTheme() === 'dark' ? 'light' : 'dark';
    zakhireTheme(jadid);
    aemalTheme(jadid);
  });

  var btnMusic = document.getElementById('btnMusic');
  var musicIcon = btnMusic.querySelector('i');
  var musicRooshan = false;

  btnMusic.addEventListener('click', function(){
    musicRooshan = !musicRooshan;
    if(musicRooshan){
      taghirinClassIcon(musicIcon, 'fa-solid fa-music fa-buzz');
    } else {
      taghirinClassIcon(musicIcon, 'fa-solid fa-music fa-float');
    }
  });

  var navItems = document.querySelectorAll('.nav-item');
  var iconsMap = {
    'خانه':       {on:'fa-solid fa-house fa-bounce',        off:'fa-solid fa-house fa-float'},
    'رویداد':     {on:'fa-solid fa-calendar fa-bounce',     off:'fa-solid fa-calendar fa-float'},
    'پروفایل':    {on:'fa-solid fa-user fa-bounce',         off:'fa-solid fa-user fa-float'},
    'اکسپلور':    {on:'fa-solid fa-photo-film fa-bounce',   off:'fa-solid fa-photo-film fa-float'},
    'کتابخانه':   {on:'fa-solid fa-book-bookmark fa-bounce',off:'fa-solid fa-book-bookmark fa-float'}
  };

  navItems.forEach(function(item){
    item.addEventListener('click', function(){
      navItems.forEach(function(n){
        n.classList.remove('active');
        var label = n.querySelector('span').textContent.trim();
        var icon = n.querySelector('i');
        if(iconsMap[label]) taghirinClassIcon(icon, iconsMap[label].off);
      });
      item.classList.add('active');
      var label = item.querySelector('span').textContent.trim();
      var icon = item.querySelector('i');
      if(iconsMap[label]) taghirinClassIcon(icon, iconsMap[label].on);
    });
  });

  var fasl = localStorage.getItem('shohada-season') || 'normal';
  body.setAttribute('data-season', fasl);

})();
</script>
</body>
</html>
