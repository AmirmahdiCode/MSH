<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مراسمات | شهدای گمنام شورابیل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/estedad-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #f8fafc; --bg2: #f1f5f9; --bg3: #e2e8f0;
      --primary: #0d9488; --primary-dark: #0f766e; --primary-light: #5eead4;
      --primary-rgb: 13, 148, 136; --dark: #0f172a; --text: #334155;
      --text-light: #94a3b8; --white: #ffffff; --card-bg: #ffffff;
      --card-border: #e2e8f0; --shadow: 4px 4px 0 #000000;
      --header-bg: #ffffff; --footer-bg: #ffffff;
      --overlay: rgba(13, 148, 136, 0.05);
      --logo-filter: none; --modal-bg: rgba(0,0,0,0.9);
      --radius: 12px;
      --font: 'Vazirmatn', Tahoma, sans-serif;
    }
    
    [data-theme="dark"] {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
      --primary: #14b8a6; --primary-dark: #0d9488; --primary-light: #5eead4;
      --primary-rgb: 20, 184, 166; --dark: #f1f5f9; --text: #cbd5e1;
      --text-light: #64748b; --white: #1e293b; --card-bg: #1e293b;
      --card-border: #334155; --header-bg: #1e293b; --footer-bg: #1e293b;
      --overlay: rgba(20, 184, 166, 0.08);
      --logo-filter: brightness(0) invert(1);
    }
    
    [data-special-theme="muharram"] {
      --primary: #dc2626; --primary-dark: #b91c1c; --primary-light: #fca5a5;
      --primary-rgb: 220, 38, 38; --overlay: rgba(220, 38, 38, 0.05);
    }
    [data-theme="dark"][data-special-theme="muharram"] {
      --primary: #ef4444; --primary-dark: #dc2626; --primary-light: #fca5a5;
      --primary-rgb: 239, 68, 68; --overlay: rgba(239, 68, 68, 0.08);
    }
    
    [data-special-theme="blue"] {
      --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #60a5fa;
      --primary-rgb: 37, 99, 235; --overlay: rgba(37, 99, 235, 0.05);
    }
    [data-theme="dark"][data-special-theme="blue"] {
      --primary: #3b82f6; --primary-dark: #2563eb; --primary-light: #93c5fd;
      --primary-rgb: 59, 130, 246; --overlay: rgba(59, 130, 246, 0.08);
    }
    
    [data-special-theme="wiladat"] {
      --primary: #22c55e; --primary-dark: #16a34a; --primary-light: #86efac;
      --primary-rgb: 34, 197, 94; --overlay: rgba(34, 197, 94, 0.05);
    }
    [data-theme="dark"][data-special-theme="wiladat"] {
      --primary: #4ade80; --primary-dark: #22c55e; --primary-light: #bbf7d0;
      --primary-rgb: 74, 222, 128; --overlay: rgba(74, 222, 128, 0.08);
    }
    
    body {
      font-family: var(--font);
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      transition: all 0.3s ease;
    }
    
    .header {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--primary);
      padding: 10px 20px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
    }
    [data-theme="dark"] .header {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--primary);
    }
    
    .header-inner { display: flex; align-items: center; justify-content: flex-start; gap: 12px; max-width: 1100px; margin: 0 auto; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    
    .header-logo {
      width: 42px; height: 42px; border-radius: 4px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 3px 3px 0 #000000; overflow: hidden; padding: 6px; border: 1px solid #000000;
    }
    .header-logo img { width: 130%; height: 130%; object-fit: contain; filter: var(--logo-filter); }
    .header-title { font-size: 16px; font-weight: 700; color: var(--dark); }
    .header-subtitle { font-size: 8px; color: var(--text-light); }
    
    .main-container { flex: 1; max-width: 900px; width: 100%; margin: 16px auto; padding: 0 12px 100px; }
    
    .loader-wrapper { display: flex; align-items: center; justify-content: center; min-height: 60vh; }
    .loader { width: 48px; height: 48px; border: 4px solid #000000; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .section-title { font-size: 16px; font-weight: 800; color: var(--dark); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .section-title::after { content: ''; flex: 1; height: 2px; background: #000000; }
    .section-title i { color: var(--primary); }
    
    .events-section { margin-bottom: 24px; }
    .search-box { width: 100%; padding: 10px 14px; border: 1px solid #000000; border-radius: 8px; background: var(--card-bg); color: var(--text); font-size: 13px; font-family: inherit; margin-bottom: 12px; box-shadow: 2px 2px 0 #000000; }
    .search-box:focus { outline: none; }
    
    .events-track { display: flex; gap: 10px; overflow-x: auto; padding: 8px 2px 16px; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--primary) var(--bg2); }
    .events-track::-webkit-scrollbar { height: 5px; }
    .events-track::-webkit-scrollbar-track { background: var(--bg2); border-radius: 3px; }
    .events-track::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }
    
    .event-card { min-width: 200px; max-width: 200px; background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: 3px 3px 0 #000000; transition: all 0.15s ease; cursor: pointer; border: 1px solid #000000; flex-shrink: 0; }
    .event-card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000000; }
    .event-card.today { border-color: var(--primary); border-width: 2px; animation: glowBorder 2s ease-in-out infinite alternate; }
    @keyframes glowBorder { from { border-color: var(--primary); } to { border-color: var(--primary-light); } }
    .event-card.past { opacity: 0.5; }
    .event-image { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: var(--bg2); }
    .event-image.placeholder { display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--primary); }
    .event-info { padding: 10px 12px; }
    .event-title { font-size: 12px; font-weight: 700; color: var(--dark); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event-meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; }
    .event-date { font-size: 9px; color: var(--text-light); display: flex; align-items: center; gap: 3px; }
    .event-location { font-size: 9px; color: var(--text-light); display: flex; align-items: center; gap: 3px; }
    .event-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .event-tag { font-size: 9px; color: var(--primary-dark); background: var(--overlay); padding: 3px 10px; border-radius: 20px; font-weight: 600; border: 1px solid #000000; }
    .today-tag { font-size: 9px; background: var(--primary); color: #fff; padding: 3px 10px; border-radius: 20px; font-weight: 700; animation: pulse 1.5s ease-in-out infinite; border: 1px solid #000000; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } }
    
    .donation-card { min-width: 200px; max-width: 200px; background: linear-gradient(135deg, #ecfdf5, #d1fae5); border-radius: var(--radius); overflow: hidden; box-shadow: 3px 3px 0 #000000; transition: all 0.15s ease; cursor: pointer; border: 1px solid #000000; flex-shrink: 0; position: relative; display: flex; flex-direction: column; }
    [data-theme="dark"] .donation-card { background: linear-gradient(135deg, #1a2e2b, #164e4a); }
    [data-special-theme="muharram"] .donation-card { background: linear-gradient(135deg, #fef2f2, #fecaca); }
    [data-theme="dark"][data-special-theme="muharram"] .donation-card { background: linear-gradient(135deg, #2e1a1a, #4e1616); }
    .donation-card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000000; }
    .donation-card .card-content { position: relative; z-index: 1; padding: 16px 12px 0 12px; display: flex; flex-direction: column; align-items: center; text-align: center; flex: 1; }
    .donation-card .donation-icon-circle { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; font-size: 24px; color: #fff; box-shadow: 2px 2px 0 #000000; border: 1px solid #000000; }
    .donation-card .donation-title { font-size: 13px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
    .donation-card .donation-subtitle { font-size: 10px; color: var(--text-light); margin-bottom: 12px; }
    .donation-card .donation-tag { font-size: 9px; background: var(--primary); color: #fff; padding: 3px 10px; border-radius: 20px; font-weight: 600; margin-bottom: 8px; border: 1px solid #000000; }
    .clouds-row { position: relative; width: 100%; height: 48px; margin-bottom: 4px; }
    .cloud-float { position: absolute; top: 50%; transform: translateY(-50%); animation: cloudDrift 6s ease-in-out infinite; }
    @keyframes cloudDrift { 0%, 100% { transform: translateY(-50%) translateX(0); } 25% { transform: translateY(-60%) translateX(8px); } 50% { transform: translateY(-50%) translateX(16px); } 75% { transform: translateY(-40%) translateX(8px); } }
    .donation-logo-img { width: 100%; object-fit: contain; margin-top: auto; }
    
    .event-hero { display: flex; justify-content: center; margin-bottom: 24px; }
    .event-hero-image { width: 100%; max-width: 350px; aspect-ratio: 2/3; object-fit: cover; display: block; background: var(--bg2); border-radius: var(--radius); box-shadow: 3px 3px 0 #000000; border: 1px solid #000000; }
    .event-hero-placeholder { width: 100%; max-width: 350px; aspect-ratio: 2/3; background: linear-gradient(135deg, var(--primary-dark), var(--primary)); display: flex; align-items: center; justify-content: center; font-size: 64px; color: rgba(255,255,255,0.3); border-radius: var(--radius); box-shadow: 3px 3px 0 #000000; border: 1px solid #000000; }
    
    .event-info-card { background: var(--card-bg); border: 1px solid #000000; border-radius: var(--radius); padding: 24px; margin-bottom: 24px; box-shadow: 3px 3px 0 #000000; }
    .event-info-card .event-title-detail { font-size: 22px; font-weight: 800; color: var(--dark); margin-bottom: 16px; line-height: 1.5; }
    .timeline { display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 20px; }
    .timeline-item { display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: var(--bg2); border-radius: 8px; font-size: 11px; color: var(--text); margin-left: 6px; margin-bottom: 6px; border: 1px solid #000000; }
    .timeline-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
    .event-tag-badge { display: inline-flex; align-items: center; font-size: 10px; background: rgba(var(--primary-rgb), 0.1); color: var(--primary-dark); padding: 6px 12px; border-radius: 20px; font-weight: 700; margin-left: 6px; margin-bottom: 6px; border: 1px solid #000000; }
    .event-description-box { background: var(--bg2); border-radius: 8px; padding: 20px; font-size: 14px; line-height: 2; color: var(--text); white-space: pre-line; border: 1px solid #000000; border-right: 4px solid var(--primary); }
    .share-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; background: var(--primary); color: #fff; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #000000; font-family: inherit; transition: all 0.15s ease; margin-top: 12px; box-shadow: 2px 2px 0 #000000; }
    .share-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000000; }
    .share-btn.copied { background: #10b981; }
    
    .gallery-section { margin-bottom: 24px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .gallery-card { background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: 3px 3px 0 #000000; border: 1px solid #000000; transition: all 0.15s ease; cursor: pointer; aspect-ratio: 4/3; }
    .gallery-card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000000; }
    .gallery-image { width: 100%; height: 100%; object-fit: cover; }
    .empty-state { text-align: center; padding: 32px 16px; color: var(--text-light); grid-column: 1/-1; }
    .empty-state i { font-size: 44px; margin-bottom: 10px; display: block; color: var(--primary-light); }
    .empty-state p { font-size: 13px; }
    
    .bottom-nav {
      position: fixed; bottom: 8px; right: 10%; left: 10%;
      width: 80%; margin: 0 auto;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
      border-radius: 25px;
      display: flex; justify-content: space-around; align-items: center;
      padding: 4px 0; z-index: 999;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    [data-theme="dark"] .bottom-nav {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
    }
    
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      cursor: pointer; text-decoration: none; color: var(--text-light);
      padding: 4px 6px; font-family: inherit; background: none; border: none;
    }
    .nav-item img { width: 20px; height: 20px; opacity: 0.5; filter: brightness(0); }
    [data-theme="dark"] .nav-item img { filter: brightness(0) invert(1); }
    .nav-item.active { color: var(--primary); }
    .nav-item.active img {
      opacity: 1;
      filter: none;
      animation: bounce 1.5s ease-in-out infinite;
    }
    [data-theme="dark"] .nav-item.active img {
      filter: brightness(0) invert(1);
    }
    .nav-item span { font-size: 7px; font-weight: 600; }
    
    .more-popup {
      position: fixed; bottom: 70px; left: 10%;
      width: 15%;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
      border-radius: 20px;
      padding: 6px;
      z-index: 998;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: none;
      animation: popupIn 0.3s ease;
    }
    [data-theme="dark"] .more-popup {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
    }
    .more-popup.active { display: block; }
    .more-popup .popup-title {
      font-size: 9px; font-weight: 800; color: var(--dark);
      margin-bottom: 4px; text-align: center;
    }
    .more-popup .popup-items {
      display: flex; flex-direction: column; gap: 2px;
    }
    .more-popup .more-item {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; text-decoration: none; color: var(--text-light);
      padding: 4px 8px; font-family: inherit;
      background: none; border: none;
      text-align: right;
    }
    .more-popup .more-item img { width: 16px; height: 16px; opacity: 0.6; filter: brightness(0); }
    [data-theme="dark"] .more-popup .more-item img { filter: brightness(0) invert(1); }
    .more-popup .more-item span { font-size: 8px; font-weight: 600; }
    
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes popupIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    @media (max-width: 900px) and (min-width: 651px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 650px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .header-title { font-size: 14px; }
      .more-popup { width: 30%; }
      .event-info-card { padding: 18px; }
      .event-info-card .event-title-detail { font-size: 18px; }
      .event-hero-image, .event-hero-placeholder { max-width: 280px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <div class="header-logo">
          <img src="https://cdn.imgurl.ir/uploads/f57721_InShot_20260714_014548498.png" alt="لوگو">
        </div>
        <div>
          <div class="header-title">مراسمات</div>
          <div class="header-subtitle">شهدای گمنام شورابیل</div>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container" id="mainContent">
    <div class="loader-wrapper"><div class="loader"></div></div>
  </main>

  <div class="more-popup" id="morePopup">
    <div class="popup-title">سایر</div>
    <div class="popup-items">
      <button class="more-item" onclick="window.location.href='../About/';">
        <img src="https://uploadkon.ir/uploads/60be06_26info-circle-iconbase.svg" alt="درباره ما">
        <span>درباره ما</span>
      </button>
      <button class="more-item" onclick="window.location.href='../Address/';">
        <img src="https://uploadkon.ir/uploads/204a06_26location-iconbase.svg" alt="مکان ما">
        <span>مکان ما</span>
      </button>
      <button class="more-item" onclick="window.location.href='../Contact/';">
        <img src="https://uploadkon.ir/uploads/393e06_26calling-iconbase.svg" alt="ارتباط با ما">
        <span>ارتباط با ما</span>
      </button>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <div class="nav-item" onclick="window.location.href='../dashboard/';">
      <img src="https://uploadkon.ir/uploads/bdf329_26home-iconbase-1-.svg" alt="خانه">
      <span>خانه</span>
    </div>
    <div class="nav-item active" onclick="window.location.href='../Events/';">
      <img src="https://uploadkon.ir/uploads/d24706_26calendar-iconbase.svg" alt="مراسمات">
      <span>مراسمات</span>
    </div>
    <div class="nav-item" onclick="window.location.href='../Occasion/';">
      <img src="https://uploadkon.ir/uploads/6e4206_26notification-iconbase.svg" alt="رویدادها">
      <span>رویدادها</span>
    </div>
    <div class="nav-item" onclick="window.location.href='../prayer/';">
      <img src="https://uploadkon.ir/uploads/99db06_26camera-iconbase.svg" alt="آرشیوها">
      <span>آرشیوها</span>
    </div>
    <div class="nav-item" onclick="window.location.href='../Setting/';">
      <img src="https://uploadkon.ir/uploads/629f29_26setting-iconbase.svg" alt="تنظیمات">
      <span>تنظیمات</span>
    </div>
    <button class="nav-item" onclick="toggleMorePopup()">
      <i class="fa-solid fa-ellipsis" style="font-size:18px; color:var(--text-light);"></i>
      <span>بیشتر</span>
    </button>
  </nav>

  <script src="../music.js"></script>
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbypWWml5JQ0CIjurUfrOVRkI5O33d2u3GT-51hzEliYa1JZ8_3oA9Mfh8gNeCDhIvRS/exec';
    const $ = (id) => document.getElementById(id);
    
    const fontMap = {
      'Samim': "'Samim', Tahoma, sans-serif",
      'Sahel': "'Sahel', Tahoma, sans-serif",
      'IRANSans': "'IRANSans', Tahoma, sans-serif",
      'Vazirmatn': "'Vazirmatn', Tahoma, sans-serif",
      'Estedad': "'Estedad', Tahoma, sans-serif"
    };
    
    function getSettings() {
      try {
        return JSON.parse(localStorage.getItem('shohada-settings')) || { font: 'Vazirmatn', theme: 'none', themeMode: 'light' };
      } catch(e) { return { font: 'Vazirmatn', theme: 'none', themeMode: 'light' }; }
    }
    
    function applyTheme(s) {
      const root = document.documentElement;
      root.setAttribute('data-theme', s.themeMode);
      root.setAttribute('data-special-theme', s.theme || 'none');
      const fontFamily = fontMap[s.font] || fontMap['Vazirmatn'];
      root.style.setProperty('--font', fontFamily);
      document.body.style.fontFamily = fontFamily;
    }
    
    let settings = getSettings();
    applyTheme(settings);
    
    let allEvents = [];
    
    function toggleMorePopup() { $('morePopup').classList.toggle('active'); }
    function openEvent(id) { localStorage.setItem('selectedEventId', id); window.location.href = '../Events/?id=' + id; }
    
    function getDonationLogo() { return 'https://cdn.imgurl.ir/uploads/l811037_InShot_20260727_155607399.png'; }
    
    function buildDonationCard() {
      return `<div class="donation-card" onclick="window.location.href='../Donates/';"><div class="card-content"><div class="donation-icon-circle"><i class="fa-solid fa-hand-holding-heart"></i></div><div class="donation-title">منتظر کمک‌های نقدی شما هستیم</div><div class="donation-subtitle">با کمک های خود یاری‌گر برگزاری مراسمات باشید</div><span class="donation-tag">رسمی</span><div class="clouds-row"><i class="fa-solid fa-cloud cloud-float" style="font-size:40px; color:rgba(13,148,136,0.5); left:10%;"></i><i class="fa-solid fa-cloud cloud-float" style="font-size:32px; color:rgba(13,148,136,0.3); left:40%; animation-delay:1s;"></i></div><img src="${getDonationLogo()}" class="donation-logo-img" alt="شهدای گمنام"></div></div>`;
    }
    
    async function loadEvents() {
      const container = $('mainContent');
      try {
        const res = await fetch(API_URL + '?action=getEvents');
        const raw = await res.json();
        
        let events = [];
        if (Array.isArray(raw)) events = raw;
        else if (raw.success && Array.isArray(raw.data)) events = raw.data;
        else if (raw.data && Array.isArray(raw.data)) events = raw.data;
        
        allEvents = events;
        
        const today = new Date(); today.setHours(0,0,0,0);
        const upcoming = events.filter(e => new Date(e.date) >= today);
        upcoming.sort((a,b) => new Date(a.date) - new Date(b.date));
        const past = events.filter(e => new Date(e.date) < today);
        past.sort((a,b) => new Date(b.date) - new Date(a.date));
        
        let trackHTML = '';
        
        upcoming.forEach(event => {
          const d = new Date(event.date);
          const isToday = d.toDateString() === new Date().toDateString();
          trackHTML += `<div class="event-card ${isToday?'today':''}" onclick="openEvent('${event.id}')">
            ${event.image ? `<img src="${event.image}" class="event-image" alt="">` : `<div class="event-image placeholder"><i class="fa-solid fa-mosque"></i></div>`}
            <div class="event-info"><div class="event-title">${event.title}</div>
            <div class="event-meta"><span class="event-date"><i class="fa-solid fa-clock"></i> ${d.toLocaleDateString('fa-IR')}</span><span class="event-location"><i class="fa-solid fa-location-dot"></i> ${event.location||'مشخص نشده'}</span></div>
            <div class="event-tags">${isToday?'<span class="today-tag"><i class="fa-solid fa-calendar-check"></i> امروز</span>':''}<span class="event-tag">${event.tag||'مراسم'}</span></div></div></div>`;
          if (isToday) trackHTML += buildDonationCard();
        });
        
        if (!upcoming.some(e => new Date(e.date).toDateString() === new Date().toDateString())) {
          trackHTML = buildDonationCard() + trackHTML;
        }
        
        past.forEach(event => {
          const d = new Date(event.date);
          trackHTML += `<div class="event-card past" onclick="openEvent('${event.id}')">
            ${event.image ? `<img src="${event.image}" class="event-image" alt="">` : `<div class="event-image placeholder"><i class="fa-solid fa-mosque"></i></div>`}
            <div class="event-info"><div class="event-title">${event.title}</div>
            <div class="event-meta"><span class="event-date"><i class="fa-solid fa-clock"></i> ${d.toLocaleDateString('fa-IR')}</span><span class="event-location"><i class="fa-solid fa-location-dot"></i> ${event.location||'مشخص نشده'}</span></div>
            <div class="event-tags"><span class="event-tag">${event.tag||'مراسم'}</span></div></div></div>`;
        });
        
        container.innerHTML = `<div class="events-section"><div class="section-title"><i class="fa-solid fa-calendar-check"></i> مراسمات</div><input type="text" class="search-box" id="eventSearch" placeholder="جستجو در مراسمات..."><div class="events-track" id="eventsTrack">${trackHTML || '<div class="empty-state"><i class="fa-solid fa-calendar-xmark"></i><p>مراسمی ثبت نشده است</p></div>'}</div></div>`;
        
        const searchBox = $('eventSearch');
        if (searchBox) {
          searchBox.oninput = function() {
            const q = this.value.toLowerCase().trim();
            document.querySelectorAll('.event-card').forEach(c => {
              c.style.display = (q==='' || c.textContent.toLowerCase().includes(q)) ? '' : 'none';
            });
          };
        }
      } catch(e) {
        container.innerHTML = `<div class="loader-wrapper"><div style="text-align:center;color:var(--text-light);"><i class="fa-solid fa-circle-exclamation" style="font-size:48px;margin-bottom:12px;"></i><p>خطا در دریافت اطلاعات</p><button onclick="loadEvents()" style="margin-top:12px;padding:8px 20px;background:var(--primary);color:#fff;border:1px solid #000000;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;">تلاش مجدد</button></div></div>`;
      }
    }
    
    loadEvents();
  </script>
</body>
</html>
