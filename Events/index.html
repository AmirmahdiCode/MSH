<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات مراسم | شهدای گمنام شورابیل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #f8fafc; --bg2: #f1f5f9; --bg3: #e2e8f0;
      --primary: #0d9488; --primary-dark: #0f766e; --primary-light: #5eead4;
      --primary-rgb: 13, 148, 136; --dark: #0f172a; --text: #334155;
      --text-light: #94a3b8; --white: #ffffff; --card-bg: #ffffff;
      --card-border: #e2e8f0; --shadow: 0 2px 12px rgba(0,0,0,0.04);
      --shadow-hover: 0 8px 24px rgba(0,0,0,0.08);
      --header-bg: #ffffff; --footer-bg: #ffffff;
      --overlay: rgba(13, 148, 136, 0.05);
      --logo-filter: none; --modal-bg: rgba(0,0,0,0.9);
    }
    
    [data-theme="dark"] {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
      --primary: #14b8a6; --primary-dark: #0d9488; --primary-light: #5eead4;
      --primary-rgb: 20, 184, 166; --dark: #f1f5f9; --text: #cbd5e1;
      --text-light: #64748b; --white: #1e293b; --card-bg: #1e293b;
      --card-border: #334155; --shadow: 0 2px 12px rgba(0,0,0,0.3);
      --shadow-hover: 0 8px 24px rgba(0,0,0,0.5);
      --header-bg: #1e293b; --footer-bg: #1e293b;
      --overlay: rgba(20, 184, 166, 0.08);
      --logo-filter: brightness(0) invert(1);
    }
    
    [data-muharram="true"] {
      --primary: #dc2626; --primary-dark: #b91c1c; --primary-light: #fca5a5;
      --primary-rgb: 220, 38, 38; --overlay: rgba(220, 38, 38, 0.05);
    }
    
    [data-theme="dark"][data-muharram="true"] {
      --primary: #ef4444; --primary-dark: #dc2626; --primary-light: #fca5a5;
      --primary-rgb: 239, 68, 68; --overlay: rgba(239, 68, 68, 0.08);
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      transition: all 0.3s ease;
    }
    
    .header {
      background: var(--header-bg); box-shadow: 0 1px 8px rgba(0,0,0,0.03);
      padding: 14px 20px; position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--bg3); transition: all 0.3s ease;
    }
    
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; max-width: 1100px; margin: 0 auto;
    }
    
    .header-right { display: flex; align-items: center; gap: 10px; }
    
    .header-logo {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 12px rgba(var(--primary-rgb), 0.2);
      overflow: hidden; padding: 6px;
    }
    
    .header-logo img { width: 100%; height: 100%; object-fit: contain; filter: var(--logo-filter); }
    .header-title { font-size: 16px; font-weight: 700; color: var(--dark); transition: color 0.3s; }
    .header-subtitle { font-size: 8px; color: var(--text-light); transition: color 0.3s; }
    .header-btns { display: flex; align-items: center; gap: 8px; }
    
    .back-btn, .theme-toggle {
      background: var(--bg2); border: none; padding: 10px; border-radius: 50%;
      cursor: pointer; font-size: 18px; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; transition: all 0.3s ease; text-decoration: none;
    }
    .back-btn:hover, .theme-toggle:hover { background: var(--primary); color: #fff; }
    .theme-toggle:hover { transform: rotate(15deg); }
    
    .main-container { flex: 1; max-width: 900px; width: 100%; margin: 24px auto; padding: 0 12px; }
    
    .loader-wrapper { display: flex; align-items: center; justify-content: center; min-height: 50vh; }
    .loader {
      width: 48px; height: 48px; border: 4px solid var(--bg3);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .event-hero {
      margin-bottom: 24px; border-radius: 20px; overflow: hidden;
      box-shadow: 0 12px 40px rgba(var(--primary-rgb), 0.2);
      border: 1px solid var(--card-border);
    }
    
    .event-hero-image {
      width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block;
      background: var(--bg2);
    }
    
    .event-hero-placeholder {
      width: 100%; aspect-ratio: 16/9;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      display: flex; align-items: center; justify-content: center;
      font-size: 72px; color: rgba(255,255,255,0.3);
    }
    
    .event-info-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 20px; padding: 24px; margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    
    .event-info-card .event-title {
      font-size: 22px; font-weight: 800; color: var(--dark);
      margin-bottom: 16px; line-height: 1.5;
    }
    
    .timeline {
      display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 20px;
      position: relative; padding: 0;
    }
    
    .timeline-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; background: var(--bg2);
      border-radius: 20px; font-size: 11px; color: var(--text);
      margin-left: 6px; margin-bottom: 6px;
    }
    
    .timeline-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--primary); flex-shrink: 0;
    }
    
    .event-tag-badge {
      display: inline-flex; align-items: center;
      font-size: 10px; background: rgba(var(--primary-rgb), 0.1);
      color: var(--primary-dark); padding: 6px 12px;
      border-radius: 20px; font-weight: 700;
      margin-left: 6px; margin-bottom: 6px;
    }
    
    .event-description-box {
      background: var(--bg2); border-radius: 14px;
      padding: 20px; font-size: 14px; line-height: 2;
      color: var(--text); white-space: pre-line;
      border-right: 4px solid var(--primary);
    }
    
    .section-title {
      font-size: 16px; font-weight: 700; color: var(--dark);
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
      transition: color 0.3s;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--bg3); }
    
    .gallery-section { margin-bottom: 24px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    
    .gallery-card {
      background: var(--card-bg); border-radius: 16px; overflow: hidden;
      box-shadow: var(--shadow); border: 1px solid var(--card-border);
      transition: all 0.3s ease; cursor: pointer; aspect-ratio: 4/3;
    }
    .gallery-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
    .gallery-image { width: 100%; height: 100%; object-fit: cover; }
    
    .gallery-video-thumb {
      width: 100%; height: 100%; object-fit: cover;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg2); position: relative;
    }
    .gallery-video-thumb .play-btn {
      width: 50px; height: 50px; background: rgba(0,0,0,0.6);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; transition: all 0.3s ease;
    }
    .gallery-card:hover .play-btn { background: var(--primary); transform: scale(1.1); }
    
    .audio-section { margin-bottom: 24px; }
    .audio-list { display: flex; flex-direction: column; gap: 8px; }
    
    .audio-item {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; padding: 14px 18px; display: flex;
      align-items: center; gap: 14px; box-shadow: var(--shadow);
      transition: all 0.3s ease; cursor: pointer;
    }
    .audio-item:hover { border-color: var(--primary-light); box-shadow: var(--shadow-hover); }
    .audio-item.playing { border-color: var(--primary); background: rgba(var(--primary-rgb), 0.03); }
    
    .audio-play-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 18px; flex-shrink: 0; transition: all 0.3s ease;
      border: none; cursor: pointer;
    }
    .audio-play-btn:hover { transform: scale(1.08); }
    .audio-play-btn.playing { background: #10b981; }
    
    .audio-info { flex: 1; min-width: 0; }
    .audio-name { font-size: 13px; font-weight: 600; color: var(--dark); margin-bottom: 4px; }
    .audio-meta { font-size: 10px; color: var(--text-light); }
    
    .audio-download {
      width: 38px; height: 38px; background: var(--bg2); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: var(--primary-dark); text-decoration: none; transition: all 0.3s ease;
      flex-shrink: 0;
    }
    .audio-download:hover { background: var(--primary); color: #fff; }
    
    .share-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 20px; background: var(--primary); color: #fff;
      border-radius: 12px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; font-family: inherit;
      transition: all 0.3s ease; margin-top: 12px;
    }
    .share-btn:hover { background: var(--primary-dark); }
    .share-btn.copied { background: #10b981; }
    
    .image-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--modal-bg); z-index: 9999;
      align-items: center; justify-content: center; flex-direction: column;
    }
    .image-modal.active { display: flex; }
    .image-modal img, .image-modal video, .image-modal iframe { max-width: 90%; max-height: 80vh; border-radius: 8px; }
    .image-modal iframe { width: 80%; height: 60vh; }
    .image-modal .modal-close {
      position: absolute; top: 20px; right: 20px; width: 44px; height: 44px;
      background: rgba(255,255,255,0.1); border: none; border-radius: 50%;
      color: #fff; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    
    .empty-state { text-align: center; padding: 32px 16px; color: var(--text-light); grid-column: 1/-1; }
    .empty-state i { font-size: 44px; margin-bottom: 10px; display: block; color: var(--primary-light); }
    .empty-state p { font-size: 13px; }
    
    .footer {
      text-align: center; padding: 20px; background: var(--footer-bg);
      border-top: 1px solid var(--bg3); margin-top: auto;
    }
    .footer-links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
    .footer-links a { color: var(--primary-dark); font-size: 11px; text-decoration: none; }
    .footer-text { font-size: 10px; color: var(--text-light); }
    
    @media (max-width: 650px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .header-title { font-size: 14px; }
      .header-subtitle { font-size: 7px; }
      .event-info-card { padding: 18px; }
      .event-info-card .event-title { font-size: 18px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <div class="header-logo">
          <img src="https://cdn.imgurl.ir/uploads/f57721_InShot_20260714_014548498.png" alt="لوگو">
        </div>
        <div>
          <div class="header-title">شهدای گمنام شورابیل</div>
          <div class="header-subtitle">سایت رسمی اطلاع رسانی و گزارش مراسمات</div>
        </div>
      </div>
      <div class="header-btns">
        <a href="../dashboard/" class="back-btn" title="بازگشت"><i class="fa-solid fa-arrow-right"></i></a>
        <button class="theme-toggle" id="themeToggle" title="تغییر تم"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <section class="main-container" id="mainContent">
    <div class="loader-wrapper"><div class="loader"></div></div>
  </section>

  <div class="image-modal" id="mediaModal">
    <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-times"></i></button>
    <div id="modalContent"></div>
  </div>

  <footer class="footer">
    <div class="footer-links">
      <a href="../Contact/"><i class="fa-solid fa-phone"></i> ارتباط با ما</a>
      <a href="../Address/"><i class="fa-solid fa-location-dot"></i> نشانی ما</a>
    </div>
    <p class="footer-text">خادمین شهدای گمنام شورابیل — کلیه حقوق محفوظ است</p>
  </footer>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbz0wWRJtCYo-7lyr0zXJm_NyvjA9a7ScXOUDOKJfXMGTatGc3Cze0CBXwoen-VrLqK5/exec';
    
    const urlParams = new URLSearchParams(window.location.search);
    const EVENT_ID = urlParams.get('id') || localStorage.getItem('selectedEventId');
    
    if (urlParams.get('id')) {
      localStorage.setItem('selectedEventId', urlParams.get('id'));
    }
    
    const $ = (id) => document.getElementById(id);
    const themeToggle = $('themeToggle'), icon = themeToggle.querySelector('i');
    
    const savedTheme = localStorage.getItem('heyat-theme');
    if (savedTheme === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); icon.classList.replace('fa-moon', 'fa-sun'); }
    
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      icon.className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
      localStorage.setItem('heyat-theme', isDark ? 'light' : 'dark');
    });
    
    (async function() {
      try {
        const now = new Date();
        const d = String(now.getDate()).padStart(2,'0'), m = String(now.getMonth()+1).padStart(2,'0'), y = now.getFullYear();
        const r = await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
        const j = await r.json();
        if (j.code === 200 && j.data.hijri.month.number === 1) document.documentElement.setAttribute('data-muharram', 'true');
      } catch(e) {}
    })();
    
    function openImageModal(src) {
      $('modalContent').innerHTML = `<img src="${src}" alt="">`;
      $('mediaModal').classList.add('active'); document.body.style.overflow = 'hidden';
    }
    
    function openVideoModal(src) {
      let content;
      if (src.includes('aparat.com') || src.includes('youtube.com') || src.includes('youtu.be') || src.includes('namasha.com')) {
        let embedSrc = src;
        if (src.includes('aparat.com/v/')) embedSrc = `https://www.aparat.com/video/video/embed/videohash/${src.split('/v/')[1]?.split('?')[0]}/vt/frame`;
        else if (src.includes('youtube.com/watch?v=')) embedSrc = `https://www.youtube.com/embed/${src.split('v=')[1]?.split('&')[0]}`;
        else if (src.includes('youtu.be/')) embedSrc = `https://www.youtube.com/embed/${src.split('youtu.be/')[1]?.split('?')[0]}`;
        content = `<iframe src="${embedSrc}" frameborder="0" allowfullscreen></iframe>`;
      } else {
        content = `<video src="${src}" controls></video>`;
      }
      $('modalContent').innerHTML = content;
      $('mediaModal').classList.add('active'); document.body.style.overflow = 'hidden';
    }
    
    function closeModal() {
      $('mediaModal').classList.remove('active'); $('modalContent').innerHTML = ''; document.body.style.overflow = '';
    }
    $('mediaModal').onclick = function(e) { if (e.target === this) closeModal(); };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    
    function getFileNameFromUrl(url) {
      const parts = url.split('/'); return decodeURIComponent(parts[parts.length - 1].split('?')[0]) || 'فایل صوتی';
    }
    
    function shareEvent(title) {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.querySelector('.share-btn');
        const orig = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> لینک کپی شد';
        btn.classList.add('copied');
        setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 2000);
      });
    }
    
    let currentAudio = null;
    
    function toggleAudio(src, btn) {
      if (currentAudio && currentAudio.src === src && !currentAudio.paused) {
        currentAudio.pause();
        btn.classList.remove('playing');
        btn.innerHTML = '<i class="fa-solid fa-play"></i>';
        return;
      }
      
      if (currentAudio) {
        currentAudio.pause();
        const prevBtn = document.querySelector('.audio-play-btn.playing');
        if (prevBtn) { prevBtn.classList.remove('playing'); prevBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; }
      }
      
      currentAudio = new Audio(src);
      currentAudio.volume = 0.5;
      currentAudio.play();
      btn.classList.add('playing');
      btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
      
      currentAudio.addEventListener('ended', () => {
        btn.classList.remove('playing');
        btn.innerHTML = '<i class="fa-solid fa-play"></i>';
      });
    }
    
    async function loadEventData() {
      const container = $('mainContent');
      
      if (!EVENT_ID) {
        container.innerHTML = `<div class="loader-wrapper"><div style="text-align:center;color:var(--text-light);"><i class="fa-solid fa-circle-exclamation" style="font-size:48px;margin-bottom:12px;"></i><p>مراسمی انتخاب نشده است</p><a href="../dashboard/" style="display:inline-block;margin-top:12px;padding:8px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;text-decoration:none;"><i class="fa-solid fa-arrow-right"></i> بازگشت</a></div></div>`;
        return;
      }
      
      try {
        const [eventRes, archiveRes] = await Promise.all([
          fetch(API_URL + '?action=getEventById', { method: 'POST', body: JSON.stringify({ eventId: EVENT_ID }) }),
          fetch(API_URL + '?action=getArchiveByEventId', { method: 'POST', body: JSON.stringify({ eventId: EVENT_ID }) })
        ]);
        
        const eventData = await eventRes.json();
        const archiveData = await archiveRes.json();
        
        if (!eventData.success) {
          container.innerHTML = `<div class="loader-wrapper"><div style="text-align:center;color:var(--text-light);"><i class="fa-solid fa-circle-exclamation" style="font-size:48px;margin-bottom:12px;"></i><p>مراسم پیدا نشد</p><a href="../dashboard/" style="display:inline-block;margin-top:12px;padding:8px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;text-decoration:none;"><i class="fa-solid fa-arrow-right"></i> بازگشت</a></div></div>`;
          return;
        }
        
        const event = eventData.data;
        const archive = archiveData.success ? archiveData.data : { images: [], videos: [], audios: [] };
        const eventDate = new Date(event.date);
        const dateStr = eventDate.toLocaleDateString('fa-IR');
        
        let html = '';
        
        // عکس مستطیل تمام‌عرض
        if (event.image) {
          html += `<div class="event-hero"><img src="${event.image}" class="event-hero-image" alt="${event.title}"></div>`;
        } else {
          html += `<div class="event-hero"><div class="event-hero-placeholder"><i class="fa-solid fa-mosque"></i></div></div>`;
        }
        
        // کارت اطلاعات
        html += `<div class="event-info-card">`;
        html += `<h1 class="event-title">${event.title}</h1>`;
        
        html += `<div class="timeline">`;
        html += `<div class="timeline-item"><div class="timeline-dot"></div> ${dateStr}</div>`;
        if (event.location) html += `<div class="timeline-item"><div class="timeline-dot" style="background:var(--primary-light);"></div> ${event.location}</div>`;
        if (event.tag) html += `<span class="event-tag-badge">${event.tag}</span>`;
        html += `</div>`;
        
        if (event.description) {
          html += `<div class="event-description-box">${event.description}</div>`;
        }
        
        html += `<button class="share-btn" onclick="shareEvent('${event.title.replace(/'/g, "\\'")}')"><i class="fa-solid fa-share-nodes"></i> اشتراک‌گذاری</button>`;
        html += `</div>`;
        
        if (archive.images && archive.images.length > 0) {
          html += `<div class="gallery-section"><div class="section-title"><i class="fa-solid fa-images"></i> تصاویر</div><div class="gallery-grid">${archive.images.map(img => `<div class="gallery-card" onclick="openImageModal('${img}')"><img src="${img}" class="gallery-image" alt="" loading="lazy"></div>`).join('')}</div></div>`;
        } else {
          html += `<div class="gallery-section"><div class="section-title"><i class="fa-solid fa-images"></i> تصاویر</div><div class="gallery-grid"><div class="empty-state"><i class="fa-solid fa-image"></i><p>تصویری برای این مراسم آرشیو نشده است</p></div></div></div>`;
        }
        
        if (archive.videos && archive.videos.length > 0) {
          html += `<div class="gallery-section"><div class="section-title"><i class="fa-solid fa-video"></i> ویدیوها</div><div class="gallery-grid">${archive.videos.map(video => `<div class="gallery-card" onclick="openVideoModal('${video}')"><div class="gallery-video-thumb"><div class="play-btn"><i class="fa-solid fa-play"></i></div></div></div>`).join('')}</div></div>`;
        } else {
          html += `<div class="gallery-section"><div class="section-title"><i class="fa-solid fa-video"></i> ویدیوها</div><div class="gallery-grid"><div class="empty-state"><i class="fa-solid fa-video"></i><p>ویدیویی برای این مراسم آرشیو نشده است</p></div></div></div>`;
        }
        
        if (archive.audios && archive.audios.length > 0) {
          html += `<div class="audio-section"><div class="section-title"><i class="fa-solid fa-podcast"></i> صوت‌ها</div><div class="audio-list">${archive.audios.map((audio, i) => `<div class="audio-item"><button class="audio-play-btn" onclick="toggleAudio('${audio}', this)"><i class="fa-solid fa-play"></i></button><div class="audio-info"><div class="audio-name">${getFileNameFromUrl(audio)}</div><div class="audio-meta">${dateStr} — ${event.title}</div></div><a href="${audio}" download class="audio-download" title="دانلود" onclick="event.stopPropagation()"><i class="fa-solid fa-download"></i></a></div>`).join('')}</div></div>`;
        } else {
          html += `<div class="audio-section"><div class="section-title"><i class="fa-solid fa-podcast"></i> صوت‌ها</div><div class="audio-list"><div class="empty-state" style="grid-column:1/-1;"><i class="fa-solid fa-podcast"></i><p>صوتی برای این مراسم آرشیو نشده است</p></div></div></div>`;
        }
        
        container.innerHTML = html;
        
      } catch(e) {
        container.innerHTML = `<div class="loader-wrapper"><div style="text-align:center;color:var(--text-light);"><i class="fa-solid fa-circle-exclamation" style="font-size:48px;margin-bottom:12px;"></i><p>خطا در دریافت اطلاعات</p><button onclick="loadEventData()" style="margin-top:12px;padding:8px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;"><i class="fa-solid fa-rotate-right"></i> تلاش مجدد</button></div></div>`;
      }
    }
    
    loadEventData();
  </script>

  <script src="../music.js"></script>
</body>
</html>
