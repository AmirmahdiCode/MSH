<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تنظیمات | شهدای گمنام شورابیل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/estedad-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc; --bg2: #f1f5f9; --bg3: #e2e8f0;
      --primary: #0d9488; --primary-dark: #0f766e; --primary-light: #5eead4;
      --primary-rgb: 13, 148, 136;
      --dark: #0f172a; --text: #334155; --text-light: #94a3b8;
      --white: #ffffff; --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --shadow: 4px 4px 0 #000000;
      --radius: 12px;
      --border: 1px solid #000000;
      --header-bg: #ffffff;
      --footer-bg: #ffffff;
      --overlay: rgba(13, 148, 136, 0.05);
      --logo-filter: none;
      --font: 'Vazirmatn', Tahoma, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
      --primary: #14b8a6; --primary-dark: #0d9488; --primary-light: #5eead4;
      --primary-rgb: 20, 184, 166;
      --dark: #f1f5f9; --text: #cbd5e1; --text-light: #64748b;
      --white: #1e293b; --card-bg: #1e293b;
      --card-border: #334155;
      --header-bg: #1e293b;
      --footer-bg: #1e293b;
      --overlay: rgba(20, 184, 166, 0.08);
      --logo-filter: brightness(0) invert(1);
    }

    [data-special-theme="muharram"] {
      --primary: #dc2626; --primary-dark: #b91c1c; --primary-light: #fca5a5;
      --primary-rgb: 220, 38, 38;
      --overlay: rgba(220, 38, 38, 0.05);
    }
    [data-theme="dark"][data-special-theme="muharram"] {
      --primary: #ef4444; --primary-dark: #dc2626; --primary-light: #fca5a5;
      --primary-rgb: 239, 68, 68;
      --overlay: rgba(239, 68, 68, 0.08);
    }

    [data-special-theme="blue"] {
      --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #60a5fa;
      --primary-rgb: 37, 99, 235;
      --overlay: rgba(37, 99, 235, 0.05);
    }
    [data-theme="dark"][data-special-theme="blue"] {
      --primary: #3b82f6; --primary-dark: #2563eb; --primary-light: #93c5fd;
      --primary-rgb: 59, 130, 246;
      --overlay: rgba(59, 130, 246, 0.08);
    }

    [data-special-theme="wiladat"] {
      --primary: #22c55e; --primary-dark: #16a34a; --primary-light: #86efac;
      --primary-rgb: 34, 197, 94;
      --overlay: rgba(34, 197, 94, 0.05);
    }
    [data-theme="dark"][data-special-theme="wiladat"] {
      --primary: #4ade80; --primary-dark: #22c55e; --primary-light: #bbf7d0;
      --primary-rgb: 74, 222, 128;
      --overlay: rgba(74, 222, 128, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    img { pointer-events: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .header {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--primary);
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
    }
    [data-theme="dark"] .header {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--primary);
    }

    .header-inner {
      display: flex; align-items: center; justify-content: flex-start;
      gap: 12px; max-width: 1100px; margin: 0 auto;
    }
    .header-right { display: flex; align-items: center; gap: 10px; }

    .header-logo {
      width: 42px; height: 42px; border-radius: 4px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 3px 3px 0 #000000; overflow: hidden; padding: 6px; border: 1px solid #000000;
    }
    .header-logo img { width: 130%; height: 130%; object-fit: contain; filter: var(--logo-filter); }
    .header-title { font-size: 16px; font-weight: 700; color: var(--dark); }
    .header-subtitle { font-size: 8px; color: var(--text-light); }

    .main-container {
      flex: 1; max-width: 700px; width: 100%;
      margin: 16px auto; padding: 0 12px 120px;
      display: flex; flex-direction: column; gap: 14px;
    }

    .setting-section {
      background: var(--card-bg);
      border: var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 3px 3px 0 #000000;
    }
    .setting-section-header {
      font-size: 12px; font-weight: 800; color: var(--dark);
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--text-light);
      padding-bottom: 8px;
    }
    .setting-section-header i { color: var(--primary); }

    .option-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed var(--card-border);
    }
    .option-row:last-child { border-bottom: none; }
    .option-label { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; color: var(--dark); }
    .option-label i { color: var(--primary); }

    .toggle-switch {
      width: 40px; height: 22px;
      background: var(--bg3);
      border-radius: 11px;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
      border: 1px solid #000000;
      box-shadow: none;
    }
    .toggle-switch::after {
      content: '';
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 2px; right: 2px;
      transition: all 0.3s ease;
    }
    .toggle-switch.active { background: var(--primary); }
    .toggle-switch.active::after { right: 20px; }

    .horizontal-scroll {
      display: flex; gap: 8px;
      overflow-x: auto;
      padding: 8px 2px 12px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) var(--bg2);
      cursor: grab;
    }
    .horizontal-scroll:active { cursor: grabbing; }
    .horizontal-scroll::-webkit-scrollbar { height: 5px; }
    .horizontal-scroll::-webkit-scrollbar-track { background: var(--bg2); border-radius: 3px; }
    .horizontal-scroll::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

    .scroll-option {
      min-width: 90px; max-width: 90px;
      padding: 10px;
      background: var(--bg2);
      border: var(--border);
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      box-shadow: none;
    }
    .scroll-option:active { transform: scale(0.95); }
    .scroll-option.selected {
      background: var(--primary);
      border-color: var(--primary);
    }
    .scroll-option .option-icon { font-size: 18px; margin-bottom: 4px; display: block; }
    .scroll-option .option-name { font-size: 9px; font-weight: 700; }
    .scroll-option.selected .option-icon,
    .scroll-option.selected .option-name { color: #fff; }

    .theme-option {
      min-width: 110px; max-width: 110px;
      flex-shrink: 0;
      border: var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--card-bg);
      box-shadow: 2px 2px 0 #000000;
    }
    .theme-option:active { transform: scale(0.95); }
    .theme-option.selected { outline: 3px solid var(--primary-light); }
    .theme-preview {
      width: 100%; height: 70px;
      display: flex; flex-direction: column;
      border-bottom: 1px solid #000000;
    }
    .theme-preview .preview-header {
      height: 20px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 6px;
    }
    .theme-preview .preview-logo {
      width: 12px; height: 12px; border-radius: 4px;
      display: inline-block;
    }
    .theme-preview .preview-body { flex: 1; padding: 6px; }
    .theme-preview .preview-line {
      height: 6px; border-radius: 3px; margin-bottom: 4px;
    }
    .theme-name {
      padding: 6px; text-align: center;
      font-size: 10px; font-weight: 700;
      color: var(--dark);
    }

    .range-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--bg3);
      outline: none;
      margin: 10px 0;
    }
    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      border: 2px solid #000000;
      box-shadow: none;
    }
    .range-slider::-moz-range-thumb {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      border: 2px solid #000000;
    }

    .range-value { font-size: 10px; font-weight: 700; color: var(--primary); direction: ltr; text-align: right; }

    .music-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px;
      background: var(--bg2);
      border: var(--border);
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: none;
    }
    .music-item.active { border-color: var(--primary); background: var(--overlay); }
    .music-item .music-icon {
      width: 30px; height: 30px;
      background: var(--primary);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 12px; flex-shrink: 0;
      border: none;
      box-shadow: none;
    }
    .music-item .music-info { flex: 1; min-width: 0; }
    .music-item .music-name { font-size: 10px; font-weight: 600; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .music-item .music-check {
      width: 18px; height: 18px;
      border: 2px solid var(--text-light);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: #fff;
      flex-shrink: 0;
      transition: all 0.2s ease;
      box-shadow: none;
    }
    .music-item.active .music-check { background: var(--primary); border-color: var(--primary); }

    .bottom-nav {
      position: fixed; bottom: 8px; right: 10%; left: 10%;
      width: 80%; margin: 0 auto;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
      border-radius: 25px;
      display: flex; justify-content: space-around; align-items: center;
      padding: 4px 0; z-index: 999;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    [data-theme="dark"] .bottom-nav {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
    }

    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      cursor: pointer; text-decoration: none; color: var(--text-light);
      padding: 4px 6px; font-family: inherit; background: none; border: none;
    }
    .nav-item img { width: 20px; height: 20px; opacity: 0.5; filter: brightness(0); }
    [data-theme="dark"] .nav-item img { filter: brightness(0) invert(1); }
    .nav-item.active { color: var(--primary); }
    .nav-item.active img {
      opacity: 1;
      filter: none;
      animation: bounce 1.5s ease-in-out infinite;
    }
    [data-theme="dark"] .nav-item.active img {
      filter: brightness(0) invert(1);
    }
    .nav-item span { font-size: 7px; font-weight: 600; }

    .more-popup {
      position: fixed; bottom: 70px; left: 10%;
      width: 15%;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
      border-radius: 20px;
      padding: 6px;
      z-index: 998;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: none;
      animation: popupIn 0.3s ease;
    }
    [data-theme="dark"] .more-popup {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
    }
    .more-popup.active { display: block; }
    .more-popup .popup-title {
      font-size: 9px; font-weight: 800; color: var(--dark);
      margin-bottom: 4px; text-align: center;
    }
    .more-popup .popup-items {
      display: flex; flex-direction: column; gap: 2px;
    }
    .more-popup .more-item {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; text-decoration: none; color: var(--text-light);
      padding: 4px 8px; font-family: inherit;
      background: none; border: none;
      text-align: right;
      border-radius: 8px;
    }
    .more-popup .more-item img { width: 16px; height: 16px; opacity: 0.6; filter: brightness(0); }
    [data-theme="dark"] .more-popup .more-item img { filter: brightness(0) invert(1); }
    .more-popup .more-item span { font-size: 8px; font-weight: 600; }

    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes popupIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 650px) {
      .more-popup { width: 30%; }
      .header-title { font-size: 14px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <div class="header-logo">
          <img src="https://cdn.imgurl.ir/uploads/f57721_InShot_20260714_014548498.png" alt="لوگو">

        <div>

          <div class="header-subtitle">شهدای گمنام شورابیل</div>

      </div>
    </div>
  </header>

  <main class="main-container">

    <div class="setting-section">
      <div class="setting-section-header"><i class="fa-solid fa-font"></i> فونت</div>

        <div class="scroll-option" data-value="Vazirmatn">
          <span class="option-icon">آ</span>
          <span class="option-name">Vazirmatn</span>
        </div>
        <div class="scroll-option" data-value="Sahel">
          <span class="option-icon">آ</span>
          <span class="option-name">Sahel</span>
        </div>
        <div class="scroll-option" data-value="IRANSans">
          <span class="option-icon">آ</span>
          <span class="option-name">IRANSans</span>
        </div>
        <div class="scroll-option" data-value="Estedad">
          <span class="option-icon">آ</span>
          <span class="option-name">Estedad</span>
        </div>
      </div>
    </div>

    <div class="setting-section">
      <div class="setting-section-header"><i class="fa-solid fa-palette"></i> تم</div>
      <div class="horizontal-scroll" id="themeSelector">

        <div class="theme-option" data-special="none">
          <div class="theme-preview">
            <div class="preview-header" style="background:#ffffff;">
              <span class="preview-logo" style="background:linear-gradient(135deg,#0d9488,#0f766e);"></span>
              <span style="font-size:5px;color:#0f172a;">●</span>
            </div>
            <div class="preview-body" style="background:#f8fafc;">
              <div class="preview-line" style="width:70%;background:#0d9488;"></div>
              <div class="preview-line" style="width:40%;background:#e2e8f0;"></div>
            </div>
          </div>
          <div class="theme-name">عادی ۱</div>
        </div>

        <div class="theme-option" data-special="blue">
          <div class="theme-preview">
            <div class="preview-header" style="background:#ffffff;">
              <span class="preview-logo" style="background:linear-gradient(135deg,#2563eb,#1d4ed8);"></span>
              <span style="font-size:5px;color:#0f172a;">●</span>
            </div>
            <div class="preview-body" style="background:#eff6ff;">
              <div class="preview-line" style="width:70%;background:#2563eb;"></div>
              <div class="preview-line" style="width:40%;background:#dbeafe;"></div>
            </div>
          </div>
          <div class="theme-name">عادی ۲</div>
        </div>

        <div class="theme-option" data-special="muharram">
          <div class="theme-preview">
            <div class="preview-header" style="background:#ffffff;">
              <span class="preview-logo" style="background:linear-gradient(135deg,#dc2626,#b91c1c);"></span>
              <span style="font-size:5px;color:#0f172a;">●</span>
            </div>
            <div class="preview-body" style="background:#fef2f2;">
              <div class="preview-line" style="width:70%;background:#dc2626;"></div>
              <div class="preview-line" style="width:40%;background:#fecaca;"></div>
            </div>
          </div>
          <div class="theme-name">محرم</div>
        </div>

        <div class="theme-option" data-special="wiladat">
          <div class="theme-preview">
            <div class="preview-header" style="background:#ffffff;">
              <span class="preview-logo" style="background:linear-gradient(135deg,#22c55e,#16a34a);"></span>
              <span style="font-size:5px;color:#0f172a;">●</span>
            </div>
            <div class="preview-body" style="background:#f0fdf4;">
              <div class="preview-line" style="width:70%;background:#22c55e;"></div>
              <div class="preview-line" style="width:40%;background:#bbf7d0;"></div>
            </div>
          </div>
          <div class="theme-name">ولادت</div>
        </div>

      </div>
    </div>

    <div class="setting-section">
      <div class="setting-section-header"><i class="fa-solid fa-circle-half-stroke"></i> حالت نمایش</div>
      <div class="option-row">
        <span class="option-label"><i class="fa-solid fa-moon"></i> حالت تاریک</span>
        <div class="toggle-switch" id="darkToggle"></div>
      </div>
    </div>

    <div class="setting-section">

        <span class="option-label"><i class="fa-solid fa-mouse-pointer"></i> صدای کلیک</span>
        <div class="toggle-switch" id="clickToggle"></div>
      </div>

        <span class="option-label"><i class="fa-solid fa-volume-high"></i> درصد صدا</span>

      </div>
      <input type="range" min="0" max="100" value="50" class="range-slider" id="soundVolume">

  </main>

      </button>
      <button class="more-item" onclick="window.location.href='../Contact/';">
        <img src="https://uploadkon.ir/uploads/393e06_26calling-iconbase.svg" alt="ارتباط با ما">
        <span>ارتباط با ما</span>
      </button>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <div class="nav-item" onclick="window.location.href='../dashboard/';">
      <img src="https://uploadkon.ir/uploads/bdf329_26home-iconbase-1-.svg" alt="خانه">
      <span>خانه</span>
    </div>
    <div class="nav-item" onclick="window.location.href='../Events/';">
      <img src="https://uploadkon.ir/uploads/d24706_26calendar-iconbase.svg" alt="مراسمات">
      <span>مراسمات</span>
    </div>
    <div class="nav-item" onclick="window.location.href='../Occasion/';">
      <img src="https://uploadkon.ir/uploads/6e4206_26notification-iconbase.svg" alt="رویدادها">
      <span>رویدادها</span>
    </div>
    <div class="nav-item" onclick="window.location.href='../prayer/';">
      <img src="https://uploadkon.ir/uploads/99db06_26camera-iconbase.svg" alt="آرشیوها">
      <span>آرشیوها</span>
    </div>
    <div class="nav-item active" onclick="window.location.href='../Setting/';">
      <img src="https://uploadkon.ir/uploads/629f29_26setting-iconbase.svg" alt="تنظیمات">
      <span>تنظیمات</span>
    </div>
    <button class="nav-item" id="moreBtn" onclick="toggleMorePopup()">
      <i class="fa-solid fa-ellipsis" style="font-size:18px; color:var(--text-light);"></i>
      <span>بیشتر</span>
    </button>
  </nav>

  <script src="../music.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const API_URL = 'https://script.google.com/macros/s/AKfycbypWWml5JQ0CIjurUfrOVRkI5O33d2u3GT-51hzEliYa1JZ8_3oA9Mfh8gNeCDhIvRS/exec';

    const fontMap = {
      'Samim': "'Samim', Tahoma, sans-serif",
      'Sahel': "'Sahel', Tahoma, sans-serif",
      'IRANSans': "'IRANSans', Tahoma, sans-serif",
      'Vazirmatn': "'Vazirmatn', Tahoma, sans-serif",
      'Estedad': "'Estedad', Tahoma, sans-serif"
    };

    function getSettings() {
      try {
        return JSON.parse(localStorage.getItem('shohada-settings')) || {
          font: 'Vazirmatn', theme: 'none',
          themeMode: 'light', musicEnabled: true, musicVolume: 50,
          musicList: [], soundEnabled: true, soundVolume: 50
        };
      } catch(e) {
        return { font: 'Vazirmatn', theme: 'none', themeMode: 'light', musicEnabled: true, musicVolume: 50, musicList: [], soundEnabled: true, soundVolume: 50 };
      }
    }

    function saveSettings(s) {
      localStorage.setItem('shohada-settings', JSON.stringify(s));
      
      if (window.musicPlayer) {
        window.musicPlayer.settings = s;
        window.musicPlayer.applySettings();
      }
    }

    function applyTheme(s) {
      const root = document.documentElement;
      root.setAttribute('data-theme', s.themeMode);
      root.setAttribute('data-special-theme', s.theme || 'none');
      const fontFamily = fontMap[s.font] || fontMap['Vazirmatn'];
      root.style.setProperty('--font', fontFamily);
      document.body.style.fontFamily = fontFamily;
    }

    let settings = getSettings();
    applyTheme(settings);

    function toggleMorePopup() {
      const popup = $('morePopup');
      popup.classList.toggle('active');
    }

    function setupScrollSelector(selectorId, valueKey, onSelect) {
      const selector = $(selectorId);
      const options = selector.querySelectorAll('.scroll-option');
      const current = settings[valueKey];
      options.forEach(opt => {
        if (opt.dataset.value === current) opt.classList.add('selected');
        else opt.classList.remove('selected');
        opt.onclick = () => {
          options.forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          settings[valueKey] = opt.dataset.value;
          saveSettings(settings);
          if (onSelect) onSelect(settings);
        };
      });
    }

    setupScrollSelector('fontSelector', 'font', (s) => applyTheme(s));

    function setupThemeSelector() {
      const selector = $('themeSelector');
      const options = selector.querySelectorAll('.theme-option');
      const currentTheme = settings.theme;
      options.forEach(opt => {
        if (opt.dataset.special === currentTheme) {
          opt.classList.add('selected');
        } else {
          opt.classList.remove('selected');
        }
        opt.onclick = () => {
          options.forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          settings.theme = opt.dataset.special;
          saveSettings(settings);
          applyTheme(settings);
        };
      });
    }
    setupThemeSelector();

    const darkToggle = $('darkToggle');
    darkToggle.classList.toggle('active', settings.themeMode === 'dark');
    darkToggle.onclick = () => {
      settings.themeMode = settings.themeMode === 'dark' ? 'light' : 'dark';
      saveSettings(settings);
      applyTheme(settings);
      darkToggle.classList.toggle('active', settings.themeMode === 'dark');
    };

    function setupToggle(toggleId, key) {
      const toggle = $(toggleId);
      toggle.classList.toggle('active', settings[key]);
      toggle.onclick = () => {
        settings[key] = !settings[key];
        saveSettings(settings);
        toggle.classList.toggle('active', settings[key]);
      };
    }
    setupToggle('musicToggle', 'musicEnabled');
    setupToggle('clickToggle', 'soundEnabled');

    function setupRange(rangeId, valueId, key) {
      const range = $(rangeId);
      const valueEl = $(valueId);
      range.value = settings[key];
      valueEl.textContent = settings[key] + '%';
      range.oninput = () => {
        settings[key] = parseInt(range.value);
        valueEl.textContent = settings[key] + '%';
        saveSettings(settings);
      };
    }
    setupRange('musicVolume', 'musicVolumeVal', 'musicVolume');
    setupRange('soundVolume', 'soundVolumeVal', 'soundVolume');

    function getFileNameFromUrl(url) {
      const parts = url.split('/');
      const name = decodeURIComponent(parts[parts.length - 1].split('?')[0]);
      return name.replace(/\.[^.]+$/, '') || 'موسیقی';
    }

    async function loadMusicList() {
      const list = $('musicList');
      list.innerHTML = '<div style="font-size:10px;color:var(--text-light);padding:8px;text-align:center;">در حال دریافت...</div>';
      try {
        const res = await fetch(API_URL + '?action=getMusic');
        const raw = await res.json();
        
        let data = [];
        if (Array.isArray(raw)) {
          data = raw;
        } else if (raw.success && Array.isArray(raw.data)) {
          data = raw.data;
        } else if (raw.data && Array.isArray(raw.data)) {
          data = raw.data;
        }
        
        if (data.length > 0) {
          const selected = settings.musicList || [];
          list.innerHTML = data.map((m, i) => {
            const src = typeof m === 'string' ? m : (m.src || '');
            const name = getFileNameFromUrl(src);
            const isActive = selected.length === 0 || selected.includes(src);
            return `<div class="music-item ${isActive ? 'active' : ''}" data-src="${src}">
              <div class="music-icon"><i class="fa-solid fa-music"></i></div>
              <div class="music-info"><div class="music-name">${name}</div></div>
              <div class="music-check">${isActive ? '<i class="fa-solid fa-check"></i>' : ''}</div>
            </div>`;
          }).join('');
          list.querySelectorAll('.music-item').forEach(item => {
            item.onclick = () => {
              item.classList.toggle('active');
              const src = item.dataset.src;
              const musicList = settings.musicList || [];
              const idx = musicList.indexOf(src);
              if (idx === -1) musicList.push(src);
              else musicList.splice(idx, 1);
              settings.musicList = musicList;
              saveSettings(settings);
              const check = item.querySelector('.music-check');
              check.innerHTML = item.classList.contains('active') ? '<i class="fa-solid fa-check"></i>' : '';
            };
          });
        } else {
          list.innerHTML = '<div style="font-size:10px;color:var(--text-light);padding:8px;text-align:center;">موسیقی‌ای یافت نشد</div>';
        }
      } catch(e) {
        list.innerHTML = '<div style="font-size:10px;color:var(--text-light);padding:8px;text-align:center;">خطا در دریافت موسیقی</div>';
      }
    }
    
    loadMusicList();
  </script>
</body>
</html>
