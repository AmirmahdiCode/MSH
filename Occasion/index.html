<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رویدادها | شهدای گمنام شورابیل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/estedad-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #f8fafc; --bg2: #f1f5f9; --bg3: #e2e8f0;
      --primary: #0d9488; --primary-dark: #0f766e; --primary-light: #5eead4;
      --primary-rgb: 13, 148, 136; --dark: #0f172a; --text: #334155;
      --text-light: #94a3b8; --white: #ffffff; --card-bg: #ffffff;
      --card-border: #e2e8f0; --shadow: 4px 4px 0 #000000;
      --header-bg: #ffffff; --footer-bg: #ffffff;
      --overlay: rgba(13, 148, 136, 0.05);
      --logo-filter: none;
      --radius: 12px;
      --font: 'Vazirmatn', Tahoma, sans-serif;
    }
    
    [data-theme="dark"] {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
      --primary: #14b8a6; --primary-dark: #0d9488; --primary-light: #5eead4;
      --primary-rgb: 20, 184, 166; --dark: #f1f5f9; --text: #cbd5e1;
      --text-light: #64748b; --white: #1e293b; --card-bg: #1e293b;
      --card-border: #334155; --header-bg: #1e293b; --footer-bg: #1e293b;
      --overlay: rgba(20, 184, 166, 0.08);
      --logo-filter: brightness(0) invert(1);
    }
    
    [data-special-theme="muharram"] {
      --primary: #dc2626; --primary-dark: #b91c1c; --primary-light: #fca5a5;
      --primary-rgb: 220, 38, 38; --overlay: rgba(220, 38, 38, 0.05);
    }
    [data-theme="dark"][data-special-theme="muharram"] {
      --primary: #ef4444; --primary-dark: #dc2626; --primary-light: #fca5a5;
      --primary-rgb: 239, 68, 68; --overlay: rgba(239, 68, 68, 0.08);
    }
    
    [data-special-theme="blue"] {
      --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #60a5fa;
      --primary-rgb: 37, 99, 235; --overlay: rgba(37, 99, 235, 0.05);
    }
    [data-theme="dark"][data-special-theme="blue"] {
      --primary: #3b82f6; --primary-dark: #2563eb; --primary-light: #93c5fd;
      --primary-rgb: 59, 130, 246; --overlay: rgba(59, 130, 246, 0.08);
    }
    
    [data-special-theme="wiladat"] {
      --primary: #22c55e; --primary-dark: #16a34a; --primary-light: #86efac;
      --primary-rgb: 34, 197, 94; --overlay: rgba(34, 197, 94, 0.05);
    }
    [data-theme="dark"][data-special-theme="wiladat"] {
      --primary: #4ade80; --primary-dark: #22c55e; --primary-light: #bbf7d0;
      --primary-rgb: 74, 222, 128; --overlay: rgba(74, 222, 128, 0.08);
    }
    
    body {
      font-family: var(--font);
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      transition: all 0.3s ease;
    }
    
    .header {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--primary);
      padding: 10px 20px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
    }
    [data-theme="dark"] .header {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--primary);
    }
    
    .header-inner { display: flex; align-items: center; justify-content: flex-start; gap: 12px; max-width: 1100px; margin: 0 auto; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    
    .header-logo {
      width: 42px; height: 42px; border-radius: 4px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 3px 3px 0 #000000; overflow: hidden; padding: 6px; border: 1px solid #000000;
    }
    .header-logo img { width: 130%; height: 130%; object-fit: contain; filter: var(--logo-filter); }
    .header-title { font-size: 16px; font-weight: 700; color: var(--dark); }
    .header-subtitle { font-size: 8px; color: var(--text-light); }
    
    .main-container { flex: 1; max-width: 900px; width: 100%; margin: 16px auto; padding: 0 12px 100px; }
    
    .loader-wrapper { display: flex; align-items: center; justify-content: center; min-height: 60vh; }
    .loader { width: 48px; height: 48px; border: 4px solid #000000; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .section-title { font-size: 16px; font-weight: 800; color: var(--dark); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .section-title::after { content: ''; flex: 1; height: 2px; background: #000000; }
    .section-title i { color: var(--primary); }
    
    .occasions-section { margin-bottom: 24px; }
    .occasions-track { display: flex; gap: 10px; overflow-x: auto; padding: 8px 2px 16px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--primary) var(--bg2); }
    .occasions-track::-webkit-scrollbar { height: 5px; }
    .occasions-track::-webkit-scrollbar-track { background: var(--bg2); border-radius: 3px; }
    .occasions-track::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }
    
    .occasion-card {
      min-width: 240px; max-width: 240px; background: var(--card-bg);
      border-radius: var(--radius); overflow: hidden; box-shadow: 3px 3px 0 #000000;
      transition: all 0.15s ease; cursor: pointer; border: 1px solid #000000;
      flex-shrink: 0;
    }
    .occasion-card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000000; }
    .occasion-image { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--bg2); }
    .occasion-image.placeholder { display: flex; align-items: center; justify-content: center; font-size: 36px; color: var(--primary); }
    .occasion-info { padding: 12px 14px; }
    .occasion-name { font-size: 13px; font-weight: 700; color: var(--dark); margin-bottom: 6px; line-height: 1.4; }
    .occasion-desc { font-size: 10px; color: var(--text-light); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
    .occasion-footer { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .occasion-tag { font-size: 9px; color: var(--primary-dark); background: var(--overlay); padding: 3px 8px; border-radius: 20px; font-weight: 600; border: 1px solid #000000; }
    .occasion-status { font-size: 9px; padding: 3px 8px; border-radius: 20px; font-weight: 700; border: 1px solid #000000; }
    .occasion-status.ongoing { background: #10b981; color: #fff; }
    .occasion-status.ended { background: var(--bg2); color: var(--text-light); }
    .occasion-status.upcoming { background: var(--primary); color: #fff; }
    .empty-occasions { text-align: center; padding: 24px; color: var(--text-light); font-size: 12px; border: 1px dashed #000000; border-radius: var(--radius); }
    
    .occasion-detail-section { margin-top: 24px; }
    .occasion-info-card { background: var(--card-bg); border: 1px solid #000000; border-radius: var(--radius); padding: 24px; margin-bottom: 24px; box-shadow: 3px 3px 0 #000000; }
    .occasion-title { font-size: 22px; font-weight: 800; color: var(--dark); margin-bottom: 16px; }
    .occasion-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
    .meta-item { padding: 6px 14px; background: var(--bg2); border-radius: 8px; font-size: 11px; border: 1px solid #000000; }
    .tag-badge { font-size: 10px; background: rgba(var(--primary-rgb), 0.1); color: var(--primary-dark); padding: 6px 12px; border-radius: 20px; font-weight: 700; border: 1px solid #000000; }
    .description-box { background: var(--bg2); border-radius: 8px; padding: 20px; font-size: 14px; line-height: 2; border: 1px solid #000000; border-right: 4px solid var(--primary); white-space: pre-line; margin-bottom: 20px; }
    .share-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; background: var(--primary); color: #fff; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #000000; font-family: inherit; transition: all 0.15s ease; box-shadow: 2px 2px 0 #000000; }
    .share-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000000; }
    .share-btn.copied { background: #10b981; }
    
    .bottom-nav {
      position: fixed; bottom: 8px; right: 10%; left: 10%;
      width: 80%; margin: 0 auto;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
      border-radius: 25px;
      display: flex; justify-content: space-around; align-items: center;
      padding: 4px 0; z-index: 999;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    [data-theme="dark"] .bottom-nav {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
    }
    
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      cursor: pointer; text-decoration: none; color: var(--text-light);
      padding: 4px 6px; font-family: inherit; background: none; border: none;
    }
    .nav-item img { width: 20px; height: 20px; opacity: 0.5; filter: brightness(0); }
    [data-theme="dark"] .nav-item img { filter: brightness(0) invert(1); }
    .nav-item.active { color: var(--primary); }
    .nav-item.active img {
      opacity: 1;
      filter: none;
      animation: bounce 1.5s ease-in-out infinite;
    }
    [data-theme="dark"] .nav-item.active img {
      filter: brightness(0) invert(1);
    }
    .nav-item span { font-size: 7px; font-weight: 600; }
    
    .more-popup {
      position: fixed; bottom: 70px; left: 10%;
      width: 15%;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
      border-radius: 20px;
      padding: 6px;
      z-index: 998;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: none;
      animation: popupIn 0.3s ease;
    }
    [data-theme="dark"] .more-popup {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
    }
    .more-popup.active { display: block; }
    .more-popup .popup-title {
      font-size: 9px; font-weight: 800; color: var(--dark);
      margin-bottom: 4px; text-align: center;
    }
    .more-popup .popup-items {
      display: flex; flex-direction: column; gap: 2px;
    }
    .more-popup .more-item {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; text-decoration: none; color: var(--text-light);
      padding: 4px 8px; font-family: inherit;
      background: none; border: none;
      text-align: right;
    }
    .more-popup .more-item img { width: 16px; height: 16px; opacity: 0.6; filter: brightness(0); }
    [data-theme="dark"] .more-popup .more-item img { filter: brightness(0) invert(1); }
    .more-popup .more-item span { font-size: 8px; font-weight: 600; }
    
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes popupIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    @media (max-width: 650px) {
      .header-title { font-size: 14px; }
      .more-popup { width: 30%; }
      .occasion-info-card { padding: 18px; }
      .occasion-title { font-size: 18px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <div class="header-logo">
          <img src="https://cdn.imgurl.ir/uploads/f57721_InShot_20260714_014548498.png" alt="لوگو">
        </div>
        <div>
          <div class="header-title">رویدادها</div>
          <div class="header-subtitle">شهدای گمنام شورابیل</div>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container" id="mainContent">
    <div class="loader-wrapper"><div class="loader"></div></div>
  </main>

  <div class="more-popup" id="morePopup">
    <div class="popup-title">سایر</div>
    <div class="popup-items">
      <button class="more-item" onclick="window.location.href='../About/';">
        <img src="https://uploadkon.ir/uploads/60be06_26info-circle-iconbase.svg" alt="درباره ما">
        <span>درباره ما</span>
      </button>
      <button class="more-item" onclick="window.location.href='../Address/';">
        <img src="https://uploadkon.ir/uploads/204a06_26location-iconbase.svg" alt="مکان ما">
        <span>مکان ما</span>
      </button>
      <button class="more-item" onclick="window.location.href='../Contact/';">
        <img src="https://uploadkon.ir/uploads/393e06_26calling-iconbase.svg" alt="ارتباط با ما">
        <span>ارتباط با ما</span>
      </button>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <div class="nav-item" onclick="window.location.href='../dashboard/';">
      <img src="https://uploadkon.ir/uploads/bdf329_26home-iconbase-1-.svg" alt="خانه">
      <span>خانه</span>
    </div>
    <div class="nav-item" onclick="window.location.href='../Events/';">
      <img src="https://uploadkon.ir/uploads/d24706_26calendar-iconbase.svg" alt="مراسمات">
      <span>مراسمات</span>
    </div>
    <div class="nav-item active" onclick="window.location.href='../Occasion/';">
      <img src="https://uploadkon.ir/uploads/6e4206_26notification-iconbase.svg" alt="رویدادها">
      <span>رویدادها</span>
    </div>
    <div class="nav-item" onclick="window.location.href='../prayer/';">
      <img src="https://uploadkon.ir/uploads/99db06_26camera-iconbase.svg" alt="آرشیوها">
      <span>آرشیوها</span>
    </div>
    <div class="nav-item" onclick="window.location.href='../Setting/';">
      <img src="https://uploadkon.ir/uploads/629f29_26setting-iconbase.svg" alt="تنظیمات">
      <span>تنظیمات</span>
    </div>
    <button class="nav-item" onclick="toggleMorePopup()">
      <i class="fa-solid fa-ellipsis" style="font-size:18px; color:var(--text-light);"></i>
      <span>بیشتر</span>
    </button>
  </nav>

  <script src="../music.js"></script>
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbypWWml5JQ0CIjurUfrOVRkI5O33d2u3GT-51hzEliYa1JZ8_3oA9Mfh8gNeCDhIvRS/exec';
    const $ = (id) => document.getElementById(id);
    
    const fontMap = {
      'Samim': "'Samim', Tahoma, sans-serif",
      'Sahel': "'Sahel', Tahoma, sans-serif",
      'IRANSans': "'IRANSans', Tahoma, sans-serif",
      'Vazirmatn': "'Vazirmatn', Tahoma, sans-serif",
      'Estedad': "'Estedad', Tahoma, sans-serif"
    };
    
    function getSettings() {
      try {
        return JSON.parse(localStorage.getItem('shohada-settings')) || { font: 'Vazirmatn', theme: 'none', themeMode: 'light' };
      } catch(e) { return { font: 'Vazirmatn', theme: 'none', themeMode: 'light' }; }
    }
    
    function applyTheme(s) {
      const root = document.documentElement;
      root.setAttribute('data-theme', s.themeMode);
      root.setAttribute('data-special-theme', s.theme || 'none');
      const fontFamily = fontMap[s.font] || fontMap['Vazirmatn'];
      root.style.setProperty('--font', fontFamily);
      document.body.style.fontFamily = fontFamily;
    }
    
    let settings = getSettings();
    applyTheme(settings);
    
    let allOccasions = [];
    let selectedOccasionId = null;
    
    function toggleMorePopup() { $('morePopup').classList.toggle('active'); }
    
    function shareOccasion() {
      const url = window.location.origin + window.location.pathname + '?id=' + selectedOccasionId;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.querySelector('.share-btn');
        if (btn) {
          const orig = btn.innerHTML;
          btn.innerHTML = '<i class="fa-solid fa-check"></i> لینک کپی شد';
          btn.classList.add('copied');
          setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 2000);
        }
      });
    }
    
    function getOccasionStatus(startDate, endDate) {
      if (!startDate) return { text: 'نامشخص', class: '' };
      const now = new Date();
      const start = new Date(startDate);
      if (endDate) {
        const end = new Date(endDate);
        if (now >= start && now <= end) return { text: 'در حال برگزاری', class: 'ongoing' };
        if (now > end) return { text: 'پایان یافته', class: 'ended' };
        return { text: 'به‌زودی', class: 'upcoming' };
      }
      if (now >= start) return { text: 'در حال برگزاری', class: 'ongoing' };
      return { text: 'به‌زودی', class: 'upcoming' };
    }
    
    function executeScripts(container) {
      const scripts = container.querySelectorAll('script');
      scripts.forEach(oldScript => {
        const newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });
    }
    
    async function showOccasionDetail(occasionId) {
      selectedOccasionId = occasionId;
      const container = $('mainContent');
      const detailSection = document.getElementById('occasionDetailSection');
      
      if (detailSection) detailSection.remove();
      
      const occasion = allOccasions.find(o => String(o.id) === String(occasionId));
      if (!occasion) return;
      
      const newSection = document.createElement('div');
      newSection.className = 'occasion-detail-section';
      newSection.id = 'occasionDetailSection';
      newSection.innerHTML = '<div class="loader-wrapper"><div class="loader"></div></div>';
      container.appendChild(newSection);
      
      setTimeout(() => {
        newSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
      
      let html = '';
      
      html += `<div class="occasion-info-card">`;
      html += `<h1 class="occasion-title">${occasion.name}</h1>`;
      
      html += `<div class="occasion-meta">`;
      if (occasion.startDate) html += `<span class="meta-item"><i class="fa-solid fa-calendar"></i> ${new Date(occasion.startDate).toLocaleDateString('fa-IR')}</span>`;
      if (occasion.endDate) html += `<span class="meta-item"><i class="fa-solid fa-calendar-check"></i> تا ${new Date(occasion.endDate).toLocaleDateString('fa-IR')}</span>`;
      if (occasion.tag) html += `<span class="tag-badge">${occasion.tag}</span>`;
      html += `</div>`;
      
      if (occasion.description) {
        html += `<div class="description-box">${occasion.description}</div>`;
      }
      
      html += `<button class="share-btn" onclick="shareOccasion()"><i class="fa-solid fa-share-nodes"></i> اشتراک‌گذاری</button>`;
      html += `</div>`;
      
      if (occasion.code) {
        html += occasion.code;
      }
      
      newSection.innerHTML = html;
      
      if (occasion.code) {
        executeScripts(newSection);
      }
    }
    
    async function loadOccasions() {
      const container = $('mainContent');
      try {
        const res = await fetch(API_URL + '?action=getOccasions');
        const raw = await res.json();
        
        let occasions = [];
        if (Array.isArray(raw)) occasions = raw;
        else if (raw.success && Array.isArray(raw.data)) occasions = raw.data;
        else if (raw.data && Array.isArray(raw.data)) occasions = raw.data;
        
        allOccasions = occasions;
        
        let trackHTML = '';
        
        if (occasions.length === 0) {
          trackHTML = '<div class="empty-occasions">تاکنون رویدادی ثبت نشده است</div>';
        } else {
          occasions.forEach(occ => {
            const imgHTML = occ.image ? `<img src="${occ.image}" class="occasion-image" alt="">` : `<div class="occasion-image placeholder"><i class="fa-solid fa-star"></i></div>`;
            const status = getOccasionStatus(occ.startDate, occ.endDate);
            trackHTML += `<div class="occasion-card" onclick="showOccasionDetail('${occ.id}')">
              ${imgHTML}
              <div class="occasion-info">
                <div class="occasion-name">${occ.name}</div>
                ${occ.description ? `<div class="occasion-desc">${occ.description}</div>` : ''}
                <div class="occasion-footer">
                  ${occ.tag ? `<span class="occasion-tag">${occ.tag}</span>` : ''}
                  <span class="occasion-status ${status.class}">${status.text}</span>
                </div>
              </div>
            </div>`;
          });
        }
        
        container.innerHTML = `<div class="occasions-section"><div class="section-title"><i class="fa-solid fa-star"></i> رویدادها</div><div class="occasions-track">${trackHTML}</div></div>`;
        
        const urlParams = new URLSearchParams(window.location.search);
        const occasionIdFromUrl = urlParams.get('id');
        if (occasionIdFromUrl) {
          showOccasionDetail(occasionIdFromUrl);
        }
      } catch(e) {
        container.innerHTML = `<div class="loader-wrapper"><div style="text-align:center;color:var(--text-light);"><i class="fa-solid fa-circle-exclamation" style="font-size:48px;margin-bottom:12px;"></i><p>خطا در دریافت اطلاعات</p><button onclick="loadOccasions()" style="margin-top:12px;padding:8px 20px;background:var(--primary);color:#fff;border:1px solid #000000;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;">تلاش مجدد</button></div></div>`;
      }
    }
    
    loadOccasions();
  </script>
</body>
