<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کمک‌های نقدی | شهدای گمنام شورابیل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #f8fafc; --bg2: #f1f5f9; --bg3: #e2e8f0;
      --primary: #0d9488; --primary-dark: #0f766e; --primary-light: #5eead4;
      --primary-rgb: 13, 148, 136; --dark: #0f172a; --text: #334155;
      --text-light: #94a3b8; --white: #ffffff; --card-bg: #ffffff;
      --card-border: #e2e8f0; --shadow: 0 2px 12px rgba(0,0,0,0.04);
      --shadow-hover: 0 8px 24px rgba(0,0,0,0.08);
      --header-bg: #ffffff; --footer-bg: #ffffff; --logo-filter: none;
    }
    
    [data-theme="dark"] {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
      --primary: #14b8a6; --primary-dark: #0d9488; --primary-light: #5eead4;
      --primary-rgb: 20, 184, 166; --dark: #f1f5f9; --text: #cbd5e1;
      --text-light: #64748b; --white: #1e293b; --card-bg: #1e293b;
      --card-border: #334155; --shadow: 0 2px 12px rgba(0,0,0,0.3);
      --shadow-hover: 0 8px 24px rgba(0,0,0,0.5);
      --header-bg: #1e293b; --footer-bg: #1e293b;
      --logo-filter: brightness(0) invert(1);
    }
    
    [data-muharram="true"] {
      --primary: #dc2626; --primary-dark: #b91c1c; --primary-light: #fca5a5;
      --primary-rgb: 220, 38, 38;
    }
    
    [data-theme="dark"][data-muharram="true"] {
      --primary: #ef4444; --primary-dark: #dc2626; --primary-light: #fca5a5;
      --primary-rgb: 239, 68, 68;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      transition: all 0.3s ease;
    }
    
    .header {
      background: var(--header-bg); box-shadow: 0 1px 8px rgba(0,0,0,0.03);
      padding: 14px 20px; position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--bg3); transition: all 0.3s ease;
    }
    
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; max-width: 1100px; margin: 0 auto;
    }
    
    .header-right { display: flex; align-items: center; gap: 10px; }
    
    .header-logo {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 12px rgba(var(--primary-rgb), 0.2);
      overflow: hidden; padding: 6px;
    }
    
    .header-logo img { width: 100%; height: 100%; object-fit: contain; filter: var(--logo-filter); }
    .header-title { font-size: 20px; font-weight: 700; color: var(--dark); transition: color 0.3s; }
    .header-subtitle { font-size: 10px; color: var(--text-light); transition: color 0.3s; }
    .header-btns { display: flex; align-items: center; gap: 8px; }
    
    .back-btn {
      background: var(--bg2); border: none; padding: 10px; border-radius: 50%;
      cursor: pointer; font-size: 18px; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; text-decoration: none; transition: all 0.3s ease;
    }
    .back-btn:hover { background: var(--primary); color: #fff; }
    
    .theme-toggle {
      background: var(--bg2); border: none; padding: 10px; border-radius: 50%;
      cursor: pointer; font-size: 18px; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; transition: all 0.3s ease;
    }
    .theme-toggle:hover { background: var(--primary); color: #fff; transform: rotate(15deg); }
    
    .main-container { flex: 1; max-width: 500px; width: 100%; margin: 24px auto; padding: 0 12px; }
    
    .page-title {
      font-size: 18px; font-weight: 700; color: var(--dark);
      margin-bottom: 24px; display: flex; align-items: center; gap: 8px;
      transition: color 0.3s;
    }
    
    .card-wrapper {
      display: flex; justify-content: center; margin-bottom: 60px;
    }
    
    .bank-card {
      position: relative;
      width: 360px; height: 210px;
      background: linear-gradient(145deg, #1a3a3a 0%, #0d2525 30%, var(--primary-dark) 60%, var(--primary) 100%);
      border-radius: 18px; padding: 0; color: #e0e0e0;
      box-shadow: 0 16px 48px rgba(var(--primary-rgb), 0.4), 0 4px 12px rgba(0,0,0,0.3);
      overflow: hidden;
      transition: all 0.3s ease;
    }
    
    [data-muharram="true"] .bank-card {
      background: linear-gradient(145deg, #3b1a1a 0%, #2d1010 30%, var(--primary-dark) 60%, var(--primary) 100%);
    }
    
    .bank-card .card-chip {
      position: absolute; top: 28px; left: 28px;
      width: 44px; height: 34px;
      background: linear-gradient(135deg, #c9a84c, #e4c76b);
      border-radius: 6px;
      border: 1px solid #a08030;
    }
    
    .bank-card .card-chip::after {
      content: ''; position: absolute; top: 8px; left: 8px;
      width: 28px; height: 18px; border-radius: 3px;
      background: linear-gradient(180deg, #b8942e, #d4b44a);
    }
    
    .bank-card .card-contactless {
      position: absolute; top: 32px; left: 84px;
      font-size: 20px; color: rgba(255,255,255,0.6);
    }
    
    .bank-card .card-number {
      position: absolute; top: 50%; left: 28px; right: 28px;
      transform: translateY(-60%);
      font-size: 18px; font-weight: 700; letter-spacing: 3px;
      font-variant-numeric: tabular-nums; direction: ltr;
      text-align: left; color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .bank-card .card-info-row {
      position: absolute; bottom: 38px; left: 28px; right: 28px;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    
    .bank-card .card-owner-label {
      font-size: 8px; text-transform: uppercase; letter-spacing: 1.5px;
      color: rgba(255,255,255,0.55); margin-bottom: 3px;
    }
    
    .bank-card .card-owner {
      font-size: 13px; font-weight: 600; color: #fff;
      letter-spacing: 0.5px; white-space: nowrap;
    }
    
    .bank-card .card-bank {
      text-align: right; flex-shrink: 0; margin-right: 16px;
    }
    
    .bank-card .card-bank-name {
      font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.7);
      letter-spacing: 1px;
    }
    
    .bank-card .card-bank-logo {
      font-size: 10px; color: rgba(255,255,255,0.5);
      letter-spacing: 0.5px;
    }
    
    .bank-card .copy-icon-btn {
      position: absolute; top: 18px; right: 18px;
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.08);
      color: #fff; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease; z-index: 2;
      backdrop-filter: blur(4px);
    }
    .copy-icon-btn:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.5);
      transform: scale(1.08);
    }
    .copy-icon-btn.copied {
      background: #10b981; border-color: #10b981;
      animation: popIn 0.4s ease;
    }
    
    @keyframes popIn {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    
    .bank-card .bubbles {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: hidden; z-index: 0;
    }
    
    .bank-card .bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 50%;
      animation: floatBubble 5s ease-in-out infinite;
    }
    
    @keyframes floatBubble {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.08; }
      50% { transform: translateY(-25px) scale(1.4); opacity: 0.2; }
    }
    
    /* بخش احادیث */
    .hadith-section-title {
      font-size: 14px; font-weight: 700; color: var(--dark);
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
      transition: color 0.3s;
      position: relative; z-index: 10;
    }
    
    .hadith-wrapper {
      position: relative; min-height: 340px; margin-bottom: 24px;
    }
    
    .hadith-container {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 340px;
      display: flex; align-items: flex-end; justify-content: center;
    }
    
    .hadith-comment {
      position: absolute; bottom: 0;
      max-width: 100%; width: 100%;
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; padding: 18px 20px;
      box-shadow: var(--shadow); 
      transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1.2);
      opacity: 0; transform: translateY(40px) scale(0.95);
      pointer-events: none;
    }
    
    .hadith-comment.visible {
      opacity: 1; transform: translateY(0) scale(1);
    }
    
    .hadith-comment.fading {
      opacity: 0; transform: translateY(-30px) scale(0.9);
      transition: all 0.6s ease-in;
    }
    
    .hadith-comment .hadith-text {
      font-size: 14px; font-weight: 500; color: var(--dark);
      line-height: 2; margin-bottom: 10px;
      transition: color 0.3s;
    }
    
    .hadith-comment .hadith-text i {
      color: var(--primary); margin: 0 4px; font-size: 12px;
    }
    
    .hadith-comment .hadith-source {
      font-size: 11px; color: var(--primary); font-weight: 700;
      transition: color 0.3s; display: flex; align-items: center; gap: 6px;
    }
    
    .footer {
      text-align: center; padding: 20px; background: var(--footer-bg);
      border-top: 1px solid var(--bg3); margin-top: auto; transition: all 0.3s ease;
    }
    .footer-links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
    .footer-links a { color: var(--primary-dark); font-size: 11px; text-decoration: none; display: flex; align-items: center; gap: 4px; transition: color 0.3s; }
    .footer-links a:hover { color: var(--dark); }
    .footer-text { font-size: 10px; color: var(--text-light); transition: color 0.3s; }
    
    @media (max-width: 400px) {
      .bank-card { width: 300px; height: 180px; }
      .bank-card .card-number { font-size: 15px; letter-spacing: 2px; left: 20px; right: 20px; }
      .bank-card .card-chip { top: 22px; left: 20px; width: 36px; height: 28px; }
      .bank-card .card-contactless { top: 26px; left: 66px; font-size: 16px; }
      .bank-card .card-info-row { bottom: 30px; left: 20px; right: 20px; }
      .bank-card .copy-icon-btn { top: 14px; right: 14px; width: 32px; height: 32px; font-size: 12px; }
      .bank-card .card-owner { font-size: 11px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <div class="header-logo">
          <img src="https://cdn.imgurl.ir/uploads/f57721_InShot_20260714_014548498.png" alt="لوگو">
        </div>
        <div>
          <div class="header-title">شهدای گمنام شورابیل</div>
          <div class="header-subtitle">سایت رسمی اطلاع رسانی و گزارش مراسمات</div>
        </div>
      </div>
      <div class="header-btns">
        <a href="../dashboard/" class="back-btn" title="بازگشت"><i class="fa-solid fa-arrow-right"></i></a>
        <button class="theme-toggle" id="themeToggle" title="تغییر تم"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <section class="main-container">
    
    <div class="page-title"><i class="fa-solid fa-hand-holding-heart"></i> کمک‌های نقدی</div>
    
    <div class="card-wrapper">
      <div class="bank-card" id="cardBox">
        <div class="bubbles" id="cardBubbles"></div>
        
        <button class="copy-icon-btn" onclick="copyCard('5892107046518703', this)" title="کپی شماره کارت">
          <i class="fa-solid fa-copy"></i>
        </button>
        
        <div class="card-chip"></div>
        <div class="card-contactless"><i class="fa-solid fa-wifi"></i></div>
        
        <div class="card-number">5892 1070 4651 8703</div>
        
        <div class="card-info-row">
          <div class="card-owner-col">
            <div class="card-owner-label">هیأت</div>
            <div class="card-owner">شهدای گمنام شورابیل</div>
          </div>
          <div class="card-bank">
            <div class="card-bank-name">SEPAH BANK</div>
            <div class="card-bank-logo">بانک سپه</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="hadith-section-title"><i class="fa-solid fa-book-quran"></i> آیات و روایات</div>
    
    <div class="hadith-wrapper">
      <div class="hadith-container" id="hadithContainer"></div>
    </div>

  </section>

  <footer class="footer">
    <div class="footer-links">
      <a href="../Contact/"><i class="fa-solid fa-phone"></i> ارتباط با ما</a>
      <a href="../Address/"><i class="fa-solid fa-location-dot"></i> نشانی ما</a>
    </div>
    <p class="footer-text">خادمین شهدای گمنام شورابیل — کلیه حقوق محفوظ است</p>
  </footer>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const icon = themeToggle.querySelector('i');
    
    const savedTheme = localStorage.getItem('heyat-theme');
    if (savedTheme === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); icon.classList.replace('fa-moon', 'fa-sun'); }
    
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      icon.className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
      localStorage.setItem('heyat-theme', isDark ? 'light' : 'dark');
      refreshBubbles();
    });
    
    (async function() {
      try {
        const now = new Date();
        const d = String(now.getDate()).padStart(2,'0'), m = String(now.getMonth()+1).padStart(2,'0'), y = now.getFullYear();
        const r = await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
        const j = await r.json();
        if (j.code === 200 && j.data.hijri.month.number === 1) {
          document.documentElement.setAttribute('data-muharram', 'true');
        }
      } catch(e) {}
      refreshBubbles();
    })();
    
    function generateBubbles() {
      let html = '';
      for (let i = 0; i < 14; i++) {
        const size = Math.random() * 30 + 10;
        const left = Math.random() * 90;
        const delay = Math.random() * 5;
        const duration = Math.random() * 5 + 4;
        html += `<div class="bubble" style="width:${size}px;height:${size}px;left:${left}%;bottom:${Math.random()*80}%;animation-delay:${delay}s;animation-duration:${duration}s;"></div>`;
      }
      return html;
    }
    
    function refreshBubbles() {
      const box = document.getElementById('cardBubbles');
      if (box) box.innerHTML = generateBubbles();
    }
    
    refreshBubbles();
    
    function copyCard(number, btn) {
      navigator.clipboard.writeText(number).then(() => {
        const iconEl = btn.querySelector('i');
        const origClass = iconEl.className;
        iconEl.className = 'fa-solid fa-check';
        btn.classList.add('copied');
        setTimeout(() => { 
          iconEl.className = origClass; 
          btn.classList.remove('copied'); 
        }, 2000);
      });
    }
    
    // احادیث
    const hadiths = [
      { text: 'بهترین مردم کسی است که برای مردم سودمندتر باشد.', source: 'پیامبر اکرم (ص)' },
      { text: 'هر کار نیکی صدقه است.', source: 'پیامبر اکرم (ص)' },
      { text: 'دست بالا (دهنده) بهتر از دست پایین (گیرنده) است.', source: 'پیامبر اکرم (ص)' },
      { text: 'مَثَل کسانی که اموال خود را در راه خدا انفاق می‌کنند، همانند دانه‌ای است که هفت خوشه برویاند.', source: 'قرآن کریم - بقره ۲۶۱' },
      { text: 'هرگز به نیکی کامل نمی‌رسید مگر اینکه از آنچه دوست دارید انفاق کنید.', source: 'قرآن کریم - آل‌عمران ۹۲' },
      { text: 'خدا پاداش نیکوکاران را ضایع نمی‌کند.', source: 'قرآن کریم - توبه ۱۲۰' },
      { text: 'صدقه، بلا را دفع می‌کند.', source: 'امام علی (ع)' },
      { text: 'کسی که به فکر کمک به دیگران باشد، خدا در فکر کمک به اوست.', source: 'امام صادق (ع)' },
      { text: 'انفاق در راه خدا، قرض دادن به خداست.', source: 'قرآن کریم - حدید ۱۱' },
      { text: 'آنچه در راه خدا انفاق کنید، خداوند عوض آن را می‌دهد.', source: 'قرآن کریم - سبأ ۳۹' },
      { text: 'نیکی کردن، انسان را از مرگ بد حفظ می‌کند.', source: 'امام صادق (ع)' },
      { text: 'مال، امانت خدا نزد توست؛ در راه خیر مصرف کن.', source: 'امام علی (ع)' },
      { text: 'صدقه پنهانی، خشم پروردگار را فرو می‌نشاند.', source: 'پیامبر اکرم (ص)' },
      { text: 'بهترین انفاق، انفاق به نزدیکان نیازمند است.', source: 'امام باقر (ع)' },
    ];
    
    let currentHadith = 0;
    let visibleComments = [];
    const MAX_VISIBLE = 3;
    
    function createHadithComment() {
      const container = document.getElementById('hadithContainer');
      if (!container) return;
      
      const hadith = hadiths[currentHadith % hadiths.length];
      currentHadith++;
      
      const el = document.createElement('div');
      el.className = 'hadith-comment';
      el.innerHTML = `
        <div class="hadith-text"><i class="fa-solid fa-quote-right"></i> ${hadith.text}</div>
        <div class="hadith-source"><i class="fa-solid fa-circle" style="font-size:5px;"></i> ${hadith.source}</div>
      `;
      el.style.bottom = '0px';
      
      container.appendChild(el);
      visibleComments.push({ el, age: 0 });
      
      requestAnimationFrame(() => {
        el.classList.add('visible');
      });
      
      updatePositions();
      
      if (visibleComments.length > MAX_VISIBLE) {
        const oldest = visibleComments.shift();
        oldest.el.classList.add('fading');
        oldest.el.addEventListener('transitionend', () => oldest.el.remove());
      }
    }
    
    function updatePositions() {
      const spacing = 88;
      const total = visibleComments.length;
      
      for (let i = 0; i < total; i++) {
        const offset = (total - 1 - i) * spacing;
        visibleComments[i].el.style.bottom = offset + 'px';
        visibleComments[i].el.style.zIndex = i;
        visibleComments[i].el.style.opacity = 1 - (total - 1 - i) * 0.15;
      }
    }
    
    setInterval(createHadithComment, 5000);
    createHadithComment();
    
  </script>

</body>
</html>
