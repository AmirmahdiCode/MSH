<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کمک‌های نقدی | شهدای گمنام شورابیل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #f8fafc; --bg2: #f1f5f9; --bg3: #e2e8f0;
      --primary: #0d9488; --primary-dark: #0f766e; --primary-light: #5eead4;
      --primary-rgb: 13, 148, 136; --dark: #0f172a; --text: #334155;
      --text-light: #94a3b8; --white: #ffffff; --card-bg: #ffffff;
      --card-border: #e2e8f0; --shadow: 0 2px 12px #000000;
      --header-bg: #ffffff; --footer-bg: #ffffff; --logo-filter: none;
    }
    
    [data-theme="dark"] {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
      --primary: #14b8a6; --primary-dark: #0d9488; --primary-light: #5eead4;
      --primary-rgb: 20, 184, 166; --dark: #f1f5f9; --text: #cbd5e1;
      --text-light: #64748b; --white: #1e293b; --card-bg: #1e293b;
      --card-border: #334155; --header-bg: #1e293b; --footer-bg: #1e293b;
      --logo-filter: brightness(0) invert(1);
    }
    
    [data-muharram="true"] {
      --primary: #dc2626; --primary-dark: #b91c1c; --primary-light: #fca5a5;
      --primary-rgb: 220, 38, 38;
    }
    
    [data-theme="dark"][data-muharram="true"] {
      --primary: #ef4444; --primary-dark: #dc2626; --primary-light: #fca5a5;
      --primary-rgb: 239, 68, 68;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      transition: all 0.3s ease;
    }
    
    .header {
      background: var(--header-bg); box-shadow: 0 1px 8px #000000;
      padding: 14px 20px; position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--bg3); transition: all 0.3s ease;
    }
    
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; max-width: 1100px; margin: 0 auto;
    }
    
    .header-right { display: flex; align-items: center; gap: 10px; }
    
    .header-logo {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 12px #000000;
      overflow: hidden; padding: 6px;
    }
    
    .header-logo img { width: 100%; height: 100%; object-fit: contain; filter: var(--logo-filter); }
    .header-title { font-size: 16px; font-weight: 700; color: var(--dark); transition: color 0.3s; }
    .header-subtitle { font-size: 8px; color: var(--text-light); transition: color 0.3s; }
    .header-btns { display: flex; align-items: center; gap: 8px; }
    
    .back-btn {
      background: var(--bg2); border: none; padding: 10px; border-radius: 50%;
      cursor: pointer; font-size: 18px; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; text-decoration: none; transition: all 0.3s ease;
    }
    .back-btn:hover { background: var(--primary); color: #fff; }
    
    .theme-toggle {
      background: var(--bg2); border: none; padding: 10px; border-radius: 50%;
      cursor: pointer; font-size: 18px; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; transition: all 0.3s ease;
    }
    .theme-toggle:hover { background: var(--primary); color: #fff; transform: rotate(15deg); }
    
    .main-container { 
      flex: 1; max-width: 900px; width: 100%; margin: 24px auto; padding: 0 12px 80px;
      display: flex; gap: 24px; align-items: flex-start;
    }
    
    .card-wrapper {
      flex-shrink: 0;
    }
    
    .bank-card {
      position: relative;
      width: 340px; height: 200px;
      background: linear-gradient(145deg, #1a3a3a 0%, #0d2525 30%, var(--primary-dark) 60%, var(--primary) 100%);
      border-radius: 18px; padding: 0; color: #e0e0e0;
      box-shadow: 0 16px 48px #000000, 0 4px 12px #000000;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    
    [data-muharram="true"] .bank-card {
      background: linear-gradient(145deg, #3b1a1a 0%, #2d1010 30%, var(--primary-dark) 60%, var(--primary) 100%);
    }
    
    .bank-card .card-chip {
      position: absolute; top: 24px; left: 24px;
      width: 40px; height: 30px;
      background: linear-gradient(135deg, #c9a84c, #e4c76b);
      border-radius: 6px;
      border: 1px solid #a08030;
    }
    
    .bank-card .card-chip::after {
      content: ''; position: absolute; top: 7px; left: 7px;
      width: 26px; height: 16px; border-radius: 3px;
      background: linear-gradient(180deg, #b8942e, #d4b44a);
    }
    
    .bank-card .card-contactless {
      position: absolute; top: 27px; left: 74px;
      font-size: 18px; color: rgba(255,255,255,0.6);
    }
    
    .bank-card .card-number {
      position: absolute; top: 50%; left: 24px; right: 24px;
      transform: translateY(-60%);
      font-size: 16px; font-weight: 700; letter-spacing: 2px;
      font-variant-numeric: tabular-nums; direction: ltr;
      text-align: left; color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
      white-space: nowrap;
    }
    
    .bank-card .card-info-row {
      position: absolute; bottom: 24px; left: 24px; right: 24px;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    
    .bank-card .card-owner {
      font-size: 13px; font-weight: 600; color: #fff;
      letter-spacing: 0.5px; white-space: nowrap;
    }
    
    .bank-card .card-bank {
      text-align: right; flex-shrink: 0;
    }
    
    .bank-card .card-bank-name {
      font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.75);
      letter-spacing: 1.5px;
    }
    
    .bank-card .copy-icon-btn {
      position: absolute; top: 16px; right: 16px;
      width: 32px; height: 32px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.08);
      color: #fff; cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease; z-index: 2;
      backdrop-filter: blur(4px);
    }
    .copy-icon-btn:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.5);
      transform: scale(1.08);
    }
    .copy-icon-btn.copied {
      background: #10b981; border-color: #10b981;
      animation: popIn 0.4s ease;
    }
    
    @keyframes popIn {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    
    .shooting-star-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 0; }
    
    @keyframes shootingStar {
      0% { transform: translateX(0) translateY(0) rotate(-35deg); opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translateX(-300px) translateY(400px) rotate(-35deg); opacity: 0; }
    }
    
    .shooting-star {
      position: absolute;
      width: 2px;
      height: 80px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.6), transparent);
      border-radius: 50%;
      animation: shootingStar 1.5s linear infinite;
      opacity: 0;
    }
    
    .hadith-wrapper {
      flex: 1; min-width: 0;
      align-self: flex-start;
    }
    
    .hadith-container {
      position: relative; width: 100%;
      height: 200px;
      overflow: hidden;
    }
    
    .hadith-comment {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 10px; padding: 10px 14px;
      box-shadow: var(--shadow); 
      transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1.2);
      opacity: 0;
      transform: translateY(30px);
      pointer-events: none;
    }
    
    .hadith-comment.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .hadith-comment.moving {
      transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1.2);
    }
    
    .hadith-comment .hadith-text {
      font-size: 12px; font-weight: 500; color: var(--dark);
      line-height: 1.7;
      transition: color 0.3s;
      display: flex; align-items: center; gap: 6px;
    }
    
    .hadith-comment .hadith-text i {
      color: var(--primary); font-size: 10px; flex-shrink: 0;
    }
    
    .hadith-comment .hadith-source {
      font-size: 9px; color: var(--primary); font-weight: 700;
      transition: color 0.3s; margin-top: 4px;
      display: flex; align-items: center; gap: 4px;
    }
    
    .floating-actions {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 12px;
      z-index: 998;
    }
    
    .floating-btn {
      width: 48px;
      height: 48px;
      border-radius: 24px;
      background: var(--primary);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0;
      overflow: hidden;
      white-space: nowrap;
      transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2), border-radius 0.4s ease;
      box-shadow: 0 2px 12px #000000;
      position: relative;
      direction: rtl;
      font-family: inherit;
    }
    
    .floating-btn i {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      position: absolute;
      right: 0;
      top: 0;
    }
    
    .floating-btn .btn-text {
      opacity: 0;
      padding: 0 56px 0 18px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      direction: rtl;
      text-align: right;
    }
    
    .floating-btn.expanded {
      width: 150px;
      border-radius: 24px;
    }
    
    .floating-btn.expanded .btn-text {
      opacity: 1;
    }
    
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      background: #fff;
      margin-right: 2px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    .footer {
      text-align: center;
      padding: 20px;
      background: var(--footer-bg);
      border-top: 1px solid var(--bg3);
      transition: all 0.3s ease;
    }
    
    .footer-text { font-size: 10px; color: var(--text-light); }
    
    @media (max-width: 700px) {
      .main-container {
        flex-direction: column; align-items: center; gap: 4px;
        max-width: 500px;
      }
      .card-wrapper { display: flex; justify-content: center; }
      .hadith-wrapper { width: 100%; }
      .hadith-container { height: auto; min-height: 180px; }
      .header-title { font-size: 14px; }
      .header-subtitle { font-size: 7px; }
      .floating-actions { bottom: 16px; right: 12px; gap: 8px; }
      .floating-btn { width: 42px; height: 42px; }
      .floating-btn i { width: 42px; height: 42px; font-size: 16px; }
      .floating-btn .btn-text { padding: 0 48px 0 14px; font-size: 11px; }
      .floating-btn.expanded { width: 135px; }
    }
    
    @media (max-width: 400px) {
      .bank-card { width: 300px; height: 180px; }
      .bank-card .card-number { font-size: 14px; letter-spacing: 1.5px; left: 18px; right: 18px; }
      .bank-card .card-chip { top: 20px; left: 18px; width: 34px; height: 26px; }
      .bank-card .card-chip::after { top: 6px; left: 6px; width: 22px; height: 14px; }
      .bank-card .card-contactless { top: 22px; left: 60px; font-size: 15px; }
      .bank-card .card-info-row { bottom: 20px; left: 18px; right: 18px; }
      .bank-card .copy-icon-btn { top: 12px; right: 12px; width: 28px; height: 28px; font-size: 11px; }
      .bank-card .card-owner { font-size: 11px; }
      .bank-card .card-bank-name { font-size: 10px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <div class="header-logo">
          <img src="https://cdn.imgurl.ir/uploads/f57721_InShot_20260714_014548498.png" alt="لوگو">
        </div>
        <div>
          <div class="header-title">شهدای گمنام شورابیل</div>
          <div class="header-subtitle">سایت رسمی اطلاع رسانی و گزارش مراسمات</div>
        </div>
      </div>
      <div class="header-btns">
        <a href="../dashboard/" class="back-btn" title="بازگشت"><i class="fa-solid fa-arrow-right"></i></a>
        <button class="theme-toggle" id="themeToggle" title="تغییر تم"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <section class="main-container">
    
    <div class="card-wrapper">
      <div class="bank-card" id="cardBox">
        <div id="cardStars"></div>
        
        <button class="copy-icon-btn" onclick="copyCard('5892107046518703', this)" title="کپی شماره کارت">
          <i class="fa-solid fa-copy"></i>
        </button>
        
        <div class="card-chip"></div>
        <div class="card-contactless"><i class="fa-solid fa-wifi"></i></div>
        
        <div class="card-number">5892 1070 4651 8703</div>
        
        <div class="card-info-row">
          <div class="card-owner">شهدای گمنام شورابیل</div>
          <div class="card-bank">
            <div class="card-bank-name">SEPAH BANK</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="hadith-wrapper">
      <div class="hadith-container" id="hadithContainer"></div>
    </div>

  </section>

  <div class="floating-actions">
    <button class="floating-btn" id="floatingPhone" onclick="window.location.href='../Contact/'" title="ارتباط با ما">
      <span class="btn-text" id="phoneText"></span>
      <i class="fa-solid fa-phone"></i>
    </button>
    <button class="floating-btn" id="floatingAddress" onclick="window.location.href='../Address/'" title="نشانی ما">
      <span class="btn-text" id="addressText"></span>
      <i class="fa-solid fa-location-dot"></i>
    </button>
  </div>

  <footer class="footer">
    <p class="footer-text">خادمین شهدای گمنام شورابیل — کلیه حقوق محفوظ است</p>
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    
    (function() {
      const saved = localStorage.getItem('heyat-theme');
      if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
    
    const themeToggle = $('themeToggle');
    const icon = themeToggle.querySelector('i');
    
    const savedTheme = localStorage.getItem('heyat-theme');
    if (savedTheme === 'dark') { icon.classList.replace('fa-moon', 'fa-sun'); }
    
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      icon.className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
      localStorage.setItem('heyat-theme', isDark ? 'light' : 'dark');
    });
    
    (async function() {
      try {
        const now = new Date();
        const d = String(now.getDate()).padStart(2,'0'), m = String(now.getMonth()+1).padStart(2,'0'), y = now.getFullYear();
        const r = await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
        const j = await r.json();
        if (j.code === 200 && j.data.hijri.month.number === 1) {
          document.documentElement.setAttribute('data-muharram', 'true');
        }
      } catch(e) {}
    })();
    
    function generateShootingStars(container, count = 10) {
      if (!container) return;
      let html = '<div class="shooting-star-container">';
      for (let i = 0; i < count; i++) {
        const left = Math.random() * 90;
        const top = Math.random() * 60;
        const delay = Math.random() * 3;
        const duration = 1 + Math.random() * 2;
        html += `<div class="shooting-star" style="left:${left}%;top:${top}%;animation-delay:${delay}s;animation-duration:${duration}s;"></div>`;
      }
      html += '</div>';
      container.innerHTML = html;
    }
    
    setTimeout(() => generateShootingStars($('cardStars'), 10), 100);
    
    function copyCard(number, btn) {
      navigator.clipboard.writeText(number).then(() => {
        const iconEl = btn.querySelector('i');
        const origClass = iconEl.className;
        iconEl.className = 'fa-solid fa-check';
        btn.classList.add('copied');
        setTimeout(() => { 
          iconEl.className = origClass; 
          btn.classList.remove('copied'); 
        }, 2000);
      });
    }
    
    function typeText(element, text, callback) {
      let i = 0;
      element.innerHTML = '<span class="typing-cursor"></span>';
      const cursor = element.querySelector('.typing-cursor');
      
      function type() {
        if (i < text.length) {
          cursor.insertAdjacentText('beforebegin', text[i]);
          i++;
          setTimeout(type, 80);
        } else {
          cursor.remove();
          if (callback) setTimeout(callback, 2000);
        }
      }
      type();
    }
    
    function clearText(element, callback) {
      element.textContent = '';
      if (callback) callback();
    }
    
    function animateFloatingButtons() {
      const phoneBtn = $('floatingPhone');
      const addrBtn = $('floatingAddress');
      const phoneText = $('phoneText');
      const addrText = $('addressText');
      
      if (!phoneBtn || !addrBtn) return;
      
      let toggle = true;
      
      function cycle() {
        if (toggle) {
          if (addrBtn.classList.contains('expanded')) {
            clearText(addrText);
            addrBtn.classList.remove('expanded');
          }
          setTimeout(() => {
            phoneBtn.classList.add('expanded');
            typeText(phoneText, 'ارتباط با ما', () => {
              clearText(phoneText);
              phoneBtn.classList.remove('expanded');
            });
          }, 400);
        } else {
          if (phoneBtn.classList.contains('expanded')) {
            clearText(phoneText);
            phoneBtn.classList.remove('expanded');
          }
          setTimeout(() => {
            addrBtn.classList.add('expanded');
            typeText(addrText, 'نشانی ما', () => {
              clearText(addrText);
              addrBtn.classList.remove('expanded');
            });
          }, 400);
        }
        toggle = !toggle;
      }
      
      cycle();
      setInterval(cycle, 5000);
    }
    
    const hadiths = [
      { text: 'انفاق در راه خدا، قرض دادن به خداست.', source: 'قرآن کریم' },
      { text: 'خدا انفاق‌کنندگان را دوست دارد.', source: 'قرآن کریم' },
      { text: 'هرگز به نیکی نمی‌رسید مگر انفاق کنید.', source: 'قرآن کریم' },
      { text: 'انفاق، تجارتی پرسود است.', source: 'قرآن کریم' },
      { text: 'آنچه انفاق کنید، نزد خدا می‌ماند.', source: 'قرآن کریم' },
      { text: 'هر قدم برای عزای حسین، عبادت است.', source: 'امام صادق (ع)' },
      { text: 'محبت به امام حسین، اجر بی‌حساب دارد.', source: 'پیامبر اکرم (ص)' },
      { text: 'هر که در عزای حسین بگرید، بهشت واجب شود.', source: 'امام صادق (ع)' },
      { text: 'خیرات برای امام حسین، ذخیره قیامت است.', source: 'امام باقر (ع)' },
      { text: 'کمک به مراسم اهل بیت، یاری دین است.', source: 'امام علی (ع)' },
      { text: 'انفاق برای عزای حسین، اجر جهاد دارد.', source: 'امام رضا (ع)' },
      { text: 'هر لقمه در راه حسین، نور است.', source: 'امام صادق (ع)' },
      { text: 'برپایی مجلس عزا، احیای امر ماست.', source: 'امام صادق (ع)' },
      { text: 'اشک بر حسین، کفاره گناهان است.', source: 'امام رضا (ع)' },
      { text: 'هر که برای اهل بیت هزینه کند، خدا جبران کند.', source: 'امام جواد (ع)' },
      { text: 'خدمت به دستگاه حسین، عزت دو جهان است.', source: 'علامه مجلسی' },
      { text: 'بخشش در راه خدا، کلید رزق بی‌پایان است.', source: 'امام علی (ع)' },
      { text: 'سفره امام حسین، سفره بهشت است.', source: 'شیخ عباس قمی' },
      { text: 'هر چه برای حسین دهی، هزار برابر برگردد.', source: 'امام صادق (ع)' },
      { text: 'نذری اهل بیت، نذر خداست.', source: 'امام باقر (ع)' },
      { text: 'کمک به هیأت، تعظیم شعائر الهی است.', source: 'قرآن کریم' },
      { text: 'دست دهنده در راه خدا، دست خداست.', source: 'امام علی (ع)' },
      { text: 'برگزاری مراسم حسینی، زنده نگه داشتن اسلام است.', source: 'امام خمینی (ره)' },
      { text: 'هر اشک برای حسین، دریای رحمت آورد.', source: 'امام صادق (ع)' },
      { text: 'اطعام در عزای حسین، اطعام ملائکه است.', source: 'امام صادق (ع)' },
      { text: 'یاری دین با مال، جهاد مالی است.', source: 'امام علی (ع)' },
      { text: 'هر قدم در راه حسین، هزار حسنه دارد.', source: 'امام باقر (ع)' },
      { text: 'انفاق پنهانی، خشم خدا را فرو نشاند.', source: 'پیامبر اکرم (ص)' },
      { text: 'کمک به عزاداری، پاداش شهید دارد.', source: 'امام صادق (ع)' },
      { text: 'مال، امانت خداست؛ در راه حسین خرج کن.', source: 'شهید مطهری' },
      { text: 'هر که مجلس حسینی برپا کند، خدا رحمتش کند.', source: 'امام صادق (ع)' },
      { text: 'انفاق، بلا را دفع می‌کند.', source: 'امام علی (ع)' },
    ];
    
    let currentHadith = 0;
    const MAX_VISIBLE = 3;
    const CARD_HEIGHT = 200;
    const COMMENT_GAP = 8;
    
    function getCommentHeight() { return 62; }
    
    function createHadithComment() {
      const container = document.getElementById('hadithContainer');
      if (!container) return;
      
      const hadith = hadiths[currentHadith % hadiths.length];
      currentHadith++;
      
      const el = document.createElement('div');
      el.className = 'hadith-comment';
      el.innerHTML = `<div class="hadith-text"><i class="fa-solid fa-quote-right"></i> ${hadith.text}</div><div class="hadith-source"><i class="fa-solid fa-circle" style="font-size:3px;"></i> ${hadith.source}</div>`;
      
      container.appendChild(el);
      
      const comments = container.querySelectorAll('.hadith-comment');
      const totalHeight = Math.min(comments.length, MAX_VISIBLE) * (getCommentHeight() + COMMENT_GAP);
      container.style.height = Math.max(CARD_HEIGHT, totalHeight) + 'px';
      
      comments.forEach((c, i) => {
        c.classList.add('moving');
        const positionFromBottom = (comments.length - 1 - i);
        c.style.bottom = positionFromBottom * (getCommentHeight() + COMMENT_GAP) + 'px';
        c.style.zIndex = i;
        c.style.opacity = positionFromBottom < MAX_VISIBLE ? (1 - positionFromBottom * 0.2) : '0';
        c.classList.add('visible');
      });
      
      if (comments.length > MAX_VISIBLE) {
        const oldest = comments[0];
        oldest.style.opacity = '0';
        oldest.style.transform = 'translateY(-20px)';
        setTimeout(() => {
          if (oldest.parentNode) oldest.remove();
          const remaining = container.querySelectorAll('.hadith-comment');
          container.style.height = Math.max(CARD_HEIGHT, remaining.length * (getCommentHeight() + COMMENT_GAP)) + 'px';
          remaining.forEach((c, i) => {
            c.style.bottom = (remaining.length - 1 - i) * (getCommentHeight() + COMMENT_GAP) + 'px';
            c.style.zIndex = i;
          });
        }, 500);
      }
      
      setTimeout(() => { comments.forEach(c => c.classList.remove('moving')); }, 600);
    }
    
    window.addEventListener('pagehide', () => {
      const container = document.getElementById('hadithContainer');
      if (container) container.innerHTML = '';
    });
    
    setInterval(createHadithComment, 5000);
    createHadithComment();
    setTimeout(animateFloatingButtons, 1000);
  </script>

  <script src="../music.js"></script>
</body>
</html>
