<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تست تم — شهدای گمنام شورابیل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f8fafc; --bg2: #f1f5f9; --bg3: #e2e8f0;
      --primary: #0d9488; --primary-dark: #0f766e; --primary-light: #5eead4;
      --primary-rgb: 13, 148, 136; --dark: #0f172a; --text: #334155;
      --text-light: #94a3b8;
    }

    [data-theme="dark"] {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
      --primary: #14b8a6; --primary-dark: #0d9488; --primary-light: #5eead4;
      --primary-rgb: 20, 184, 166; --dark: #f1f5f9; --text: #cbd5e1;
      --text-light: #64748b;
    }

    [data-muharram="true"] {
      --primary: #dc2626; --primary-dark: #b91c1c; --primary-light: #fca5a5;
      --primary-rgb: 220, 38, 38;
    }

    [data-theme="dark"][data-muharram="true"] {
      --primary: #ef4444; --primary-dark: #dc2626; --primary-light: #fca5a5;
      --primary-rgb: 239, 68, 68;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 30px 20px;
      transition: all 0.3s ease;
      text-align: center;
    }

    h1 { color: var(--dark); margin-bottom: 20px; font-size: 22px; }
    h2 { color: var(--text-light); font-size: 14px; margin-bottom: 30px; font-weight: 400; }

    .test-panel {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px;
    }
    .test-panel button {
      padding: 12px 28px; border: none; border-radius: 14px;
      font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .btn-normal {
      background: linear-gradient(135deg, #0d9488, #0f766e); color: #fff;
    }
    .btn-muharram {
      background: linear-gradient(135deg, #dc2626, #b91c1c); color: #fff;
    }
    .btn-dark {
      background: linear-gradient(135deg, #334155, #1e293b); color: #fff;
    }
    .btn-dark-muharram {
      background: linear-gradient(135deg, #7f1d1d, #450a0a); color: #fff;
    }
    .test-panel button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }

    .demo-cards {
      display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
      max-width: 900px; margin: 0 auto;
    }

    .demo-card {
      width: 200px; padding: 24px 16px; border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff; text-align: center; transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(var(--primary-rgb), 0.3);
    }
    .demo-card .icon {
      font-size: 36px; margin-bottom: 12px;
    }
    .demo-card .title {
      font-size: 16px; font-weight: 700; margin-bottom: 8px;
    }
    .demo-card .subtitle {
      font-size: 11px; opacity: 0.85;
    }

    .demo-card-outline {
      background: var(--bg); color: var(--primary);
      border: 1px solid rgba(var(--primary-rgb), 0.5);
      box-shadow: 0 0 0 1px rgba(var(--primary-rgb), 0.3), 0 0 20px rgba(var(--primary-rgb), 0.1);
    }

    .info-row {
      display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
      margin-top: 24px; max-width: 600px; margin-left: auto; margin-right: auto;
    }
    .info-badge {
      padding: 8px 20px; border-radius: 12px;
      background: rgba(var(--primary-rgb), 0.1);
      color: var(--primary-dark); font-size: 12px; font-weight: 600;
    }

    .bubbles-container {
      position: relative; width: 200px; height: 200px; margin: 20px auto;
      background: var(--bg2); border-radius: 16px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(var(--primary-rgb), 0.3), 0 0 20px rgba(var(--primary-rgb), 0.1);
    }
    .bubbles-container .bubble {
      position: absolute;
      background: rgba(var(--primary-rgb), 0.15);
      border-radius: 50%;
      animation: floatBubble 4s ease-in-out infinite;
    }
    @keyframes floatBubble {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.25; }
      50% { transform: translateY(-18px) scale(1.2); opacity: 0.55; }
    }

    .status {
      margin-top: 24px; font-size: 12px; color: var(--text-light);
    }
    .status span {
      font-weight: 700; color: var(--primary-dark);
    }
  </style>
</head>
<body>

  <h1>🎨 تست رنگ‌بندی تم</h1>
  <h2>دکمه‌ها رو بزن و تغییرات رو ببین</h2>

  <div class="test-panel">
    <button class="btn-normal" onclick="setTheme('light','false')">
      🌿 عادی (سبز)
    </button>
    <button class="btn-muharram" onclick="setTheme('light','true')">
      🏴 محرم (قرمز)
    </button>
    <button class="btn-dark" onclick="setTheme('dark','false')">
      🌙 دارک مود (سبز)
    </button>
    <button class="btn-dark-muharram" onclick="setTheme('dark','true')">
      🌙🏴 دارک + محرم
    </button>
  </div>

  <div class="demo-cards">
    <div class="demo-card" id="card1">
      <div class="icon">🕌</div>
      <div class="title">کارت نمونه</div>
      <div class="subtitle">رنگ اصلی تم</div>
    </div>
    <div class="demo-card demo-card-outline" id="card2">
      <div class="icon">📅</div>
      <div class="title">تقویم</div>
      <div class="subtitle">حاشیه درخشان</div>
    </div>
  </div>

  <div class="bubbles-container" id="bubbleBox"></div>
  <p style="font-size:11px;color:var(--text-light);margin-top:6px;">حباب‌های شناور</p>

  <div class="info-row">
    <div class="info-badge">🏷️ تگ: رسمی</div>
    <div class="info-badge">📍 موقعیت: شورابیل</div>
  </div>

  <div class="status">
    تم فعلی: <span id="statusText">عادی (سبز)</span>
  </div>

  <script>
    function setTheme(theme, muharram) {
      document.documentElement.removeAttribute('data-theme');
      document.documentElement.removeAttribute('data-muharram');
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      if (muharram === 'true') document.documentElement.setAttribute('data-muharram', 'true');

      let label = '';
      if (theme === 'light' && muharram === 'false') label = 'عادی (سبز)';
      if (theme === 'light' && muharram === 'true') label = 'محرم (قرمز)';
      if (theme === 'dark' && muharram === 'false') label = 'دارک مود (سبز)';
      if (theme === 'dark' && muharram === 'true') label = 'دارک + محرم (قرمز تیره)';
      document.getElementById('statusText').textContent = label;

      refreshBubbles();
    }

    function refreshBubbles() {
      const box = document.getElementById('bubbleBox');
      const computedStyle = getComputedStyle(document.documentElement);
      const primaryRgb = computedStyle.getPropertyValue('--primary-rgb').trim();
      box.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        const size = Math.random() * 22 + 8;
        const left = Math.random() * 85;
        const delay = Math.random() * 4;
        const duration = Math.random() * 4 + 3;
        box.insertAdjacentHTML('beforeend',
          `<div class="bubble" style="width:${size}px;height:${size}px;left:${left}%;bottom:${Math.random()*70}%;animation-delay:${delay}s;animation-duration:${duration}s;background:rgba(${primaryRgb},0.15);"></div>`
        );
      }
    }

    refreshBubbles();
  </script>

</body>
</html>
