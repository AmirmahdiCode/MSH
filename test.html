<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تست ساده</title>
  <style>
    body { font-family: Tahoma; background: #1e293b; color: #10b981; padding: 30px; text-align: center; }
    button { padding: 16px 40px; font-size: 18px; background: #0d9488; color: #fff; border: none; border-radius: 12px; cursor: pointer; }
    pre { background: #0f172a; padding: 20px; border-radius: 12px; text-align: left; direction: ltr; margin-top: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <h2>تست getAdmins</h2>
  <button onclick="test()">کلیک کن</button>
  <pre id="r">...</pre>

  <script>
    async function test() {
      document.getElementById('r').textContent = 'در حال تست...';
      
      const res = await fetch('https://script.google.com/macros/s/AKfycbxKEBKOUeiLochQX_k6bIxVzY8tLhHuV7gFfSaKHQqbp6wPTPUqeyx6gjaNuR7xzdrr/exec?action=getAdmins', {
        method: 'POST',
        body: JSON.stringify({})
      });
      
      const data = await res.json();
      document.getElementById('r').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
