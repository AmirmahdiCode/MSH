<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تست آرشیو</title>
  <style>
    body { font-family: Tahoma; background: #1e293b; color: #10b981; padding: 30px; text-align: center; }
    button { padding: 16px 40px; font-size: 18px; background: #0d9488; color: #fff; border: none; border-radius: 12px; cursor: pointer; margin: 8px; }
    input { padding: 12px; font-size: 14px; border-radius: 8px; border: none; width: 250px; text-align: center; font-family: inherit; }
    pre { background: #0f172a; padding: 20px; border-radius: 12px; text-align: left; direction: ltr; margin-top: 20px; font-size: 14px; }
    .section { margin: 16px 0; color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <h2>تست آرشیو</h2>
  
  <div class="section">eventId رو وارد کن (از شیت Events):</div>
  <input type="text" id="eventId" placeholder="مثلاً: EVT-123456">
  
  <div class="section">عملیات:</div>
  <button onclick="testAdd()">اضافه کردن آرشیو</button>
  <button onclick="testUpdate()">ویرایش آرشیو</button>
  <button onclick="testDelete()">حذف آرشیو</button>
  <button onclick="testGet()">گرفتن آرشیو</button>
  
  <pre id="r">منتظر کلیک...</pre>

  <script>
    const API = 'https://script.google.com/macros/s/AKfycbyJlSVIO4r7z2scxaMINEykuKDEE37yDOqD_fV18tGk0qCJhK6Ip2t0Tx8HrxyGAL78/exec';
    
    async function getIP() {
      try { const r = await fetch('https://api.ipify.org?format=json'); const d = await r.json(); return d.ip; }
      catch(e) { return '0.0.0.0'; }
    }
    
    function show(msg) { document.getElementById('r').textContent = msg; }
    
    async function testAdd() {
      const eid = document.getElementById('eventId').value.trim();
      if (!eid) { show('❌ eventId رو وارد کن'); return; }
      
      show('در حال اضافه کردن...');
      const ip = await getIP();
      
      const res = await fetch(API + '?action=addArchive', {
        method: 'POST',
        body: JSON.stringify({ eventId: eid, images: 'test.jpg', videos: '', audios: '', clientIP: ip })
      });
      const data = await res.json();
      show('✅ addArchive:\n' + JSON.stringify(data, null, 2));
    }
    
    async function testUpdate() {
      const eid = document.getElementById('eventId').value.trim();
      if (!eid) { show('❌ eventId رو وارد کن'); return; }
      
      show('در حال ویرایش...');
      const ip = await getIP();
      
      const res = await fetch(API + '?action=updateArchive', {
        method: 'POST',
        body: JSON.stringify({ eventId: eid, images: 'updated.jpg', videos: '', audios: '', clientIP: ip })
      });
      const data = await res.json();
      show('✅ updateArchive:\n' + JSON.stringify(data, null, 2));
    }
    
    async function testDelete() {
      const eid = document.getElementById('eventId').value.trim();
      if (!eid) { show('❌ eventId رو وارد کن'); return; }
      
      show('در حال حذف...');
      const ip = await getIP();
      
      const res = await fetch(API + '?action=deleteArchive', {
        method: 'POST',
        body: JSON.stringify({ eventId: eid, clientIP: ip })
      });
      const data = await res.json();
      show('✅ deleteArchive:\n' + JSON.stringify(data, null, 2));
    }
    
    async function testGet() {
      const eid = document.getElementById('eventId').value.trim();
      if (!eid) { show('❌ eventId رو وارد کن'); return; }
      
      show('در حال گرفتن...');
      
      const res = await fetch(API + '?action=getArchiveByEventId', {
        method: 'POST',
        body: JSON.stringify({ eventId: eid })
      });
      const data = await res.json();
      show('✅ getArchive:\n' + JSON.stringify(data, null, 2));
    }
  </script>
</body>
</html>
