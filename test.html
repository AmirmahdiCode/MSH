<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تست لاگین</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f8fafc;
      padding: 20px;
      text-align: center;
      margin-top: 50px;
    }
    button {
      padding: 16px 32px;
      font-size: 18px;
      background: #0d9488;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    button:disabled {
      opacity: 0.5;
    }
    pre {
      background: #1e293b;
      color: #10b981;
      padding: 20px;
      border-radius: 12px;
      text-align: left;
      direction: ltr;
      margin-top: 20px;
      font-size: 14px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h2>تست لاگین API</h2>
  <button onclick="testLogin()">کلیک کن تست کنه</button>
  <pre id="result">منتظر کلیک...</pre>

  <script>
    async function testLogin() {
      document.querySelector('button').disabled = true;
      document.getElementById('result').textContent = 'در حال تست...';
      
      try {
        const res = await fetch('https://script.google.com/macros/s/AKfycbyOUyob6F-5heJiU9MmfewQzPwj_HrrobSwNyC-SwQTKZsW0ho2sMjfiNdm4d6SLxkH/exec?action=login', {
          method: 'POST',
          body: JSON.stringify({
            username: 'Amirmahdi',
            password: 'Amir@mahdi_89',
            ip: '0.0.0.0'
          })
        });
        
        const data = await res.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      } catch(e) {
        document.getElementById('result').textContent = 'ERROR: ' + e.message;
      }
      
      document.querySelector('button').disabled = false;
    }
  </script>
</body>
</html>
