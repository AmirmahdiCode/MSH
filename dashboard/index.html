<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>شهدای گمنام شورابیل</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=23">
<style>
.main{position:relative;z-index:5;padding:0 12px 110px;min-height:100vh;}
.banner{position:relative;width:calc(100% + 24px);margin-right:-12px;height:280px;margin-top:118px;overflow:hidden;animation:bannerEnter .9s ease;
  -webkit-mask-image:linear-gradient(to bottom,black 0%,black 85%,rgba(0,0,0,.95) 89%,rgba(0,0,0,.85) 93%,rgba(0,0,0,.6) 96%,rgba(0,0,0,.3) 98%,transparent 100%);
  mask-image:linear-gradient(to bottom,black 0%,black 85%,rgba(0,0,0,.95) 89%,rgba(0,0,0,.85) 93%,rgba(0,0,0,.6) 96%,rgba(0,0,0,.3) 98%,transparent 100%);}
@keyframes bannerEnter{0%{opacity:0;transform:scale(1.03) translateY(10px);}100%{opacity:1;transform:scale(1) translateY(0);}}
.banner-track{display:flex;gap:5px;height:100%;will-change:transform;padding:0 5px;}
.banner-strip{flex:0 0 auto;height:100%;width:150px;overflow:hidden;border-radius:14px;opacity:0;transform:translateX(30px);animation:stripIn .6s cubic-bezier(.2,.8,.2,1) forwards;}
.banner-strip img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;}
@keyframes stripIn{0%{opacity:0;transform:translateX(30px);}100%{opacity:1;transform:translateX(0);}}
.top-row{display:flex;gap:10px;margin-top:-55px;position:relative;z-index:10;animation:cardEnter .8s cubic-bezier(.2,.8,.2,1) .4s backwards;}
@keyframes cardEnter{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.glass-card{position:relative;background:rgba(255,255,255,.55);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-border);border-radius:24px;box-shadow:var(--glass-shadow);overflow:hidden;transition:background .5s ease,border .5s ease;}
[data-theme="dark"] .glass-card{background:rgba(50,50,50,.55);border:1px solid rgba(255,255,255,.12);}
.shooting-star-container{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.shooting-star{position:absolute;width:2px;height:60px;background:linear-gradient(to bottom,rgba(47,168,125,.6),transparent);border-radius:50%;animation:shootingStar 2s linear infinite;opacity:0;}
[data-theme="dark"] .shooting-star{background:linear-gradient(to bottom,rgba(255,255,255,.55),transparent);}
@keyframes shootingStar{0%{transform:translateX(0) translateY(0) rotate(-35deg);opacity:0;}10%{opacity:1;}70%{opacity:1;}100%{transform:translateX(-250px) translateY(320px) rotate(-35deg);opacity:0;}}
.calendar-section{flex:0 0 calc(48% - 5px);padding:12px 10px;}
.calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;position:relative;z-index:1;}
.calendar-nav{width:26px;height:26px;border-radius:8px;border:1px solid var(--glass-border);background:rgba(255,255,255,.3);cursor:pointer;font-size:11px;color:var(--accent);display:flex;align-items:center;justify-content:center;transition:all .2s ease;font-family:var(--font);}
[data-theme="dark"] .calendar-nav{background:rgba(255,255,255,.06);}
.calendar-nav:hover{background:var(--accent-bg);}
.calendar-nav:active{transform:scale(.9);}
.calendar-month-title{font-size:12px;font-weight:800;color:var(--text);user-select:none;}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;position:relative;z-index:1;}
.calendar-day{text-align:center;padding:4px 1px;border-radius:8px;font-size:10px;cursor:pointer;transition:all .2s ease;position:relative;color:var(--text);min-height:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid transparent;}
.calendar-day:hover{background:var(--accent-bg);border-color:var(--accent-line);}
.calendar-day.today{background:var(--accent);color:#fff;font-weight:800;box-shadow:0 0 10px var(--accent-glow);}
.prayer-section{flex:0 0 calc(52% - 5px);padding:12px 10px;}
.prayer-title{font-size:12px;font-weight:800;color:var(--text);margin-bottom:6px;text-align:center;position:relative;z-index:1;}
.prayer-date{grid-column:1 / -1;text-align:center;font-size:9px;font-weight:600;color:var(--text-soft);margin-bottom:6px;position:relative;z-index:1;padding:5px 6px;background:rgba(255,255,255,.3);border-radius:8px;border:1px solid var(--glass-border);}
[data-theme="dark"] .prayer-date{background:rgba(255,255,255,.06);}
.prayer-list{display:grid;grid-template-columns:1fr 1fr;gap:4px;position:relative;z-index:1;}
.prayer-item{display:flex;justify-content:space-between;align-items:center;padding:5px 7px;border-radius:8px;background:rgba(255,255,255,.3);transition:all .3s ease;border:1px solid transparent;font-size:9px;}
[data-theme="dark"] .prayer-item{background:rgba(255,255,255,.06);}
.prayer-item.next{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow);}
.prayer-item.next .prayer-name,.prayer-item.next .prayer-time,.prayer-item.next .prayer-name i{color:#fff;}
.prayer-item.night{grid-column:1 / -1;justify-content:center;gap:10px;}
.prayer-name{font-size:9px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:3px;}
.prayer-name i{font-size:10px;color:var(--accent);}
.prayer-time{font-size:9px;font-weight:800;color:var(--accent);direction:ltr;}
.prayer-loading{grid-column:1 / -1;text-align:center;font-size:10px;color:var(--text-soft);padding:20px 0;}

.welcome-wrap{
  margin-top:16px;
  padding:21px 12px 18px;
  border-radius:22px;
  position:relative;
  overflow:hidden;
  opacity:0;
  transform:translateY(30px);
  animation:welcomeEnter .9s cubic-bezier(.2,.8,.2,1) .5s forwards;
  z-index:10;
  background:#000;
  min-height:320px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  direction:rtl;
}

@keyframes welcomeEnter{
  0%{opacity:0;transform:translateY(30px);}
  100%{opacity:1;transform:translateY(0);}
}

.welcome-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.35;
  z-index:0;
  pointer-events:none;
}

[data-theme="dark"] .welcome-video{
  opacity:.25;
}

.welcome-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,rgba(0,0,0,.6) 100%);
  z-index:1;
  pointer-events:none;
}

.hand-wave{
  font-size:84px;
  line-height:1;
  position:relative;
  z-index:2;
  transform-origin:60% 80%;
  animation:handWave 4s ease-in-out infinite;
  display:inline-block;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.3));
  align-self:flex-start;
  margin-right:4px;
  margin-bottom:1px;
}

@keyframes handWave{
  0%{transform:rotate(0deg);}
  3%{transform:rotate(-15deg);}
  6%{transform:rotate(15deg);}
  9%{transform:rotate(-15deg);}
  12%{transform:rotate(15deg);}
  15%{transform:rotate(-12deg);}
  20%{transform:rotate(10deg);}
  25%{transform:rotate(-8deg);}
  30%{transform:rotate(6deg);}
  35%{transform:rotate(-4deg);}
  40%{transform:rotate(0deg);}
  100%{transform:rotate(0deg);}
}

.telegram-bubble{
  position:relative;
  z-index:2;
  background:#ffffff;
  border-radius:16px;
  padding:12px 14px 8px;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
  width:80%;
  margin:50px 0 0 auto;
  opacity:0;
  transform:translateY(15px) scale(.95);
  animation:bubbleEnter .6s cubic-bezier(.34,1.56,.64,1) .9s forwards;
  direction:rtl;
  text-align:right;
}

@keyframes bubbleEnter{
  0%{opacity:0;transform:translateY(15px) scale(.95);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}

[data-theme="dark"] .telegram-bubble{
  background:#0f1a2e;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}

.telegram-bubble::after{
  content:'';
  position:absolute;
  top:-8px;
  right:24px;
  width:16px;
  height:16px;
  background:#ffffff;
  transform:rotate(45deg);
  border-top-left-radius:4px;
}

[data-theme="dark"] .telegram-bubble::after{
  background:#0f1a2e;
}

.tg-text{
  font-size:12px;
  font-weight:500;
  color:#1a2e26;
  line-height:1.9;
  direction:rtl !important;
  text-align:right !important;
  width:100%;
  display:block;
}

[data-theme="dark"] .tg-text{
  color:#e6f2e6;
}

.tg-links{
  margin-top:12px;
  display:block;
  width:100%;
  direction:rtl !important;
}

.tg-link{
  display:block;
  padding:7px 4px;
  font-size:12px;
  font-weight:600;
  color:#1a2e26;
  text-decoration:none;
  cursor:pointer;
  transition:all .2s ease;
  font-family:var(--font);
  text-align:right !important;
  border-radius:6px;
  position:relative;
  direction:rtl !important;
  width:100%;
}

[data-theme="dark"] .tg-link{
  color:#e6f2e6;
}

.tg-link:hover{
  background:rgba(30,122,90,.10);
  color:var(--accent);
  padding-right:10px;
}

[data-theme="dark"] .tg-link:hover{
  background:rgba(95,208,164,.14);
}

.tg-link:active{
  transform:scale(.98);
}

.tg-link::before{
  content:'·';
  margin-left:8px;
  font-weight:800;
  color:var(--accent);
}

.tg-time{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:4px;
  margin-top:6px;
  font-size:10px;
  color:#6b8a6b;
  direction:ltr;
}

[data-theme="dark"] .tg-time{
  color:#7fa07f;
}

.martyr-wrap{
  margin-top:16px;
  padding:21px 12px 18px;
  border-radius:22px;
  position:relative;
  overflow:hidden;
  opacity:0;
  transform:translateY(30px);
  animation:welcomeEnter .9s cubic-bezier(.2,.8,.2,1) .7s forwards;
  z-index:10;
  background:#000;
  min-height:320px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  direction:rtl;
}

.martyr-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.35;
  z-index:0;
  pointer-events:none;
}

[data-theme="dark"] .martyr-video{
  opacity:.25;
}

.martyr-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,rgba(0,0,0,.6) 100%);
  z-index:1;
  pointer-events:none;
}

.martyr-photo{
  width:84px;
  height:84px;
  object-fit:cover;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.85);
  box-shadow:0 6px 22px rgba(0,0,0,.4);
  position:relative;
  z-index:2;
  align-self:flex-start;
  margin-right:4px;
  margin-bottom:1px;
  animation:martyrFloat 4s ease-in-out infinite;
}

@keyframes martyrFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-5px);}
}

.martyr-bubble{
  position:relative;
  z-index:2;
  background:#ffffff;
  border-radius:16px;
  padding:12px 14px 8px;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
  width:80%;
  margin:50px 0 0 auto;
  opacity:0;
  transform:translateY(15px) scale(.95);
  animation:bubbleEnter .6s cubic-bezier(.34,1.56,.64,1) 1.1s forwards;
  direction:rtl;
  text-align:right;
}

[data-theme="dark"] .martyr-bubble{
  background:#0f1a2e;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}

.martyr-bubble::after{
  content:'';
  position:absolute;
  top:-8px;
  right:24px;
  width:16px;
  height:16px;
  background:#ffffff;
  transform:rotate(45deg);
  border-top-left-radius:4px;
}

[data-theme="dark"] .martyr-bubble::after{
  background:#0f1a2e;
}

.mt-text{
  font-size:12px;
  font-weight:500;
  color:#1a2e26;
  line-height:1.9;
  direction:rtl !important;
  text-align:right !important;
  width:100%;
  display:block;
}

[data-theme="dark"] .mt-text{
  color:#e6f2e6;
}

.mt-name{
  display:block;
  font-weight:800;
  color:var(--accent);
  margin-bottom:4px;
}

.mt-message{
  display:block;
  white-space:pre-line;
}

.mt-time{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:4px;
  margin-top:6px;
  font-size:10px;
  color:#6b8a6b;
  direction:ltr;
}

[data-theme="dark"] .mt-time{
  color:#7fa07f;
}

.martyr-refresh{
  position:absolute;
  top:12px;
  left:12px;
  z-index:3;
  width:36px;
  height:36px;
  border-radius:50%;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:0 4px 14px rgba(0,0,0,.25);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:var(--accent);
  font-size:14px;
  transition:transform .3s ease,background .3s ease;
}

[data-theme="dark"] .martyr-refresh{
  background:rgba(50,50,50,.85);
  border-color:rgba(255,255,255,.15);
}

.martyr-refresh:hover{
  background:var(--accent);
  color:#fff;
}

.martyr-refresh:active{
  transform:scale(.9);
}

.martyr-refresh.spinning i{
  animation:refreshSpin .8s linear infinite;
}

@keyframes refreshSpin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

.martyr-loading{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  transition:opacity .5s ease,visibility .5s ease;
}

.martyr-loading.hide{
  opacity:0;
  visibility:hidden;
}

.martyr-loader{
  position:relative;
  width:70px;
  height:70px;
}

.martyr-loader span{
  position:absolute;
  inset:0;
  border:3px solid transparent;
  border-radius:50%;
  animation:martyrSpin 1.4s cubic-bezier(.5,0,.5,1) infinite;
}

.martyr-loader span:nth-child(1){
  border-top-color:var(--accent);
  animation-delay:-.45s;
}

.martyr-loader span:nth-child(2){
  inset:10px;
  border-right-color:var(--accent-soft);
  animation-delay:-.3s;
}

.martyr-loader span:nth-child(3){
  inset:20px;
  border-bottom-color:var(--accent);
  animation-delay:-.15s;
}

.martyr-loader span:nth-child(4){
  inset:28px;
  background:var(--accent);
  border:none;
  border-radius:50%;
  animation:martyrPulse 1.4s ease-in-out infinite;
}

@keyframes martyrSpin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

@keyframes martyrPulse{
  0%,100%{transform:scale(.8);opacity:.6;}
  50%{transform:scale(1.15);opacity:1;}
}

.martyr-loading-text{
  font-size:11px;
  font-weight:700;
  color:#fff;
  letter-spacing:.5px;
  opacity:.85;
  animation:loadingFade 1.6s ease-in-out infinite;
}

@keyframes loadingFade{
  0%,100%{opacity:.4;}
  50%{opacity:1;}
}

@media (max-width:400px){
  .top-row{gap:8px;}
  .calendar-section{padding:10px 8px;}
  .prayer-section{padding:10px 8px;}
  .calendar-month-title{font-size:11px;}
  .calendar-day{font-size:9px;min-height:24px;padding:2px 0;}
  .prayer-item{font-size:8px;padding:4px 5px;}
  .prayer-name{font-size:8px;}
  .prayer-name i{font-size:9px;}
  .prayer-time{font-size:8px;}
  .header-title{font-size:12px;}
  .hand-wave{font-size:68px;}
  .welcome-wrap{padding:19px 10px 16px; min-height:290px;}
  .telegram-bubble{width:85%; margin:45px 0 0 auto;}
  .tg-text{font-size:11px;}
  .tg-link{font-size:11px;}
  .martyr-wrap{padding:19px 10px 16px; min-height:290px;}
  .martyr-photo{width:68px;height:68px;}
  .martyr-bubble{width:85%; margin:45px 0 0 auto;}
  .mt-text{font-size:11px;}
  .martyr-refresh{width:32px;height:32px;font-size:12px;top:10px;left:10px;}
  .martyr-loader{width:56px;height:56px;}
}
</style>
</head>
<body data-season="normal" data-theme="light">

<div class="bg-orbs">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>

<div class="top-bar">
  <button class="profile-circle" id="profileBtn" data-href="../profile/new/">
    <i class="fa-solid fa-user-plus fa-jello"></i>
    <span>افزودن حساب</span>
  </button>

  <header class="header">
    <img src="../images/logo.png" alt="لوگو" class="header-logo">
    <div class="header-text">
      <div class="header-title">شهدای گمنام شورابیل</div>
      <div class="header-subtitle">سایت رسمی شهدای گمنام شورابیل</div>
    </div>
  </header>
</div>

<div class="sub-bar" id="subBar">
  <button class="sub-btn sub-notif" id="btnNotif" data-href="../notif/">
    <i class="fa-solid fa-bell fa-swing"></i>
    <span>اعلان‌ها</span>
    <span class="badge hidden">0</span>
  </button>

  <button class="sub-btn sub-music" id="btnMusic">
    <i class="fa-solid fa-music fa-jello"></i>
    <span class="msg"></span>
  </button>

  <button class="sub-btn sub-theme" id="btnTheme">
    <i class="fa-solid fa-moon fa-flip-360"></i>
    <span class="msg"></span>
  </button>
</div>

<main class="main">
  <div class="banner">
    <div class="banner-track" id="bannerTrack">
      <div class="banner-strip"><img src="https://cdn.imgurl.ir/uploads/z3470_InShot_20260930_213454249.jpg" alt=""></div>
      <div class="banner-strip"><img src="https://cdn.imgurl.ir/uploads/y560316_InShot_20260930_213547273.jpg" alt=""></div>
      <div class="banner-strip"><img src="https://cdn.imgurl.ir/uploads/c973164_InShot_20260930_213712458.jpg" alt=""></div>
      <div class="banner-strip"><img src="https://cdn.imgurl.ir/uploads/y3029_InShot_20260930_213813747.jpg" alt=""></div>
    </div>
  </div>

  <div class="top-row">
    <div class="glass-card calendar-section" id="calendarSection">
      <div class="shooting-star-container" id="calendarStars"></div>
      <div class="calendar-header">
        <button class="calendar-nav" id="btnPrevMonth"><i class="fa-solid fa-chevron-right"></i></button>
        <span class="calendar-month-title" id="calendarTitle">—</span>
        <button class="calendar-nav" id="btnNextMonth"><i class="fa-solid fa-chevron-left"></i></button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="glass-card prayer-section">
      <div class="shooting-star-container" id="prayerStars"></div>
      <div class="prayer-title">اوقات شرعی اردبیل</div>
      <div class="prayer-list" id="prayerList">
        <div class="prayer-loading">در حال دریافت اوقات شرعی...</div>
      </div>
    </div>
  </div>

  <div class="welcome-wrap">
    <video class="welcome-video" src="https://cdn.imgurl.ir/uploads/v67507_VID_20260930_200718_578.mp4" autoplay muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
    <div class="welcome-overlay"></div>

    <div class="hand-wave">👋</div>

    <div class="telegram-bubble">
      <div class="tg-text">
        سلام 👋<br>
        به وب‌سایت شهدای گمنام شورابیل خوش آمدی؛<br>
        امروز دوست داری چطور شروع کنیم؟!
      </div>

      <div class="tg-links" id="tgLinks"></div>

      <div class="tg-time">
        <span id="tgClock">00:00</span>
      </div>
    </div>
  </div>

  <div class="martyr-wrap">
    <video class="martyr-video" src="https://cdn.imgurl.ir/uploads/w2862_InShot_20260930_220841337.mp4" autoplay muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
    <div class="martyr-overlay"></div>

    <div class="martyr-loading" id="martyrLoading">
      <div class="martyr-loader">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="martyr-loading-text">در حال دریافت پیام...</div>
    </div>

    <button class="martyr-refresh" id="martyrRefresh" aria-label="پیام جدید">
      <i class="fa-solid fa-rotate-right"></i>
    </button>

    <img class="martyr-photo" id="martyrPhoto" src="" alt="">

    <div class="martyr-bubble">
      <div class="mt-text" id="martyrText">
        <span class="mt-name" id="martyrName"></span>
        <span class="mt-message" id="martyrMessage"></span>
      </div>
      <div class="mt-time" id="martyrDate"></div>
    </div>
  </div>

<script>
(function(){
  'use strict';

  var monthNames = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  var currentMonth = 0;
  var currentYear = 0;

  function toShamsi(gy, gm, gd){
    var g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
    var jy = gy <= 1600 ? 0 : 979;
    gy -= gy <= 1600 ? 621 : 1600;
    var gy2 = gm > 2 ? gy + 1 : gy;
    var days = 365 * gy + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
    var jy2 = jy + 33 * Math.floor(days / 12053);
    days %= 12053;
    jy2 += 4 * Math.floor(days / 1461);
    days %= 1461;
    if(days > 365){jy2 += Math.floor((days - 1) / 365); days = (days - 1) % 365;}
    var jm = days < 186 ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
    var jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
    return {year:jy2, month:jm, day:jd};
  }

  function daysInMonth(sal, mah){
    if(mah <= 6) return 31;
    if(mah <= 11) return 30;
    return ((sal - 1) % 4 === 3) ? 30 : 29;
  }

  function buildStars(containerId, count){
    var container = document.getElementById(containerId);
    if(!container) return;
    container.innerHTML = '';
    for(var i = 0; i < count; i++){
      var s = document.createElement('div');
      s.className = 'shooting-star';
      s.style.left = (Math.random() * 90) + '%';
      s.style.top = (Math.random() * 60) + '%';
      s.style.animationDelay = (Math.random() * 3) + 's';
      s.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
      container.appendChild(s);
    }
  }

  function buildCalendar(){
    var titleEl = document.getElementById('calendarTitle');
    var gridEl = document.getElementById('calendarGrid');
    if(!titleEl || !gridEl) return;
    titleEl.textContent = monthNames[currentMonth - 1] + ' ' + currentYear;
    var now = new Date();
    var today = toShamsi(now.getFullYear(), now.getMonth() + 1, now.getDate());
    var days = daysInMonth(currentYear, currentMonth);
    var html = '';
    for(var d = 1; d <= days; d++){
      var isToday = (currentYear === today.year && currentMonth === today.month && d === today.day);
      html += '<div class="calendar-day' + (isToday ? ' today' : '') + '">' + d + '</div>';
    }
    gridEl.innerHTML = html;
  }

  function changeMonth(dir){
    currentMonth += dir;
    if(currentMonth > 12){currentMonth = 1; currentYear++;}
    if(currentMonth < 1){currentMonth = 12; currentYear--;}
    buildCalendar();
    buildStars('calendarStars', 6);
  }

  function renderPrayers(timings, hijri){
    var box = document.getElementById('prayerList');
    if(!box) return;
    var items = [
      {name:'صبح', icon:'fa-cloud-moon', key:'Fajr'},
      {name:'طلوع', icon:'fa-sun', key:'Sunrise'},
      {name:'ظهر', icon:'fa-cloud-sun', key:'Dhuhr'},
      {name:'عصر', icon:'fa-cloud-sun-rain', key:'Asr'},
      {name:'مغرب', icon:'fa-cloud-moon', key:'Maghrib'},
      {name:'عشا', icon:'fa-moon', key:'Isha'}
    ];
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var activeIndex = -1;
    for(var i = 0; i < items.length; i++){
      var t = timings[items[i].key];
      if(!t) continue;
      var p = t.split(':');
      var dg = parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
      if(dg > nowMin){activeIndex = i; break;}
    }
    var midnight = (timings.Midnight || '').split(' ')[0];
    var midnightMin = 9999;
    if(midnight && midnight.indexOf(':') !== -1){
      var mp = midnight.split(':');
      midnightMin = parseInt(mp[0], 10) * 60 + parseInt(mp[1], 10);
    }
    var midnightActive = (activeIndex === -1 && midnightMin > nowMin) ? ' next' : '';
    var hijriText = '';
    if(hijri){hijriText = hijri.weekday.ar + ' - ' + hijri.day + ' ' + hijri.month.ar + ' ' + hijri.year;}
    var html = '<div class="prayer-date">' + (hijriText || '—') + '</div>';
    for(var j = 0; j < items.length; j++){
      var timeVal = (timings[items[j].key] || '--:--').split(' ')[0];
      var activeClass = (j === activeIndex) ? ' next' : '';
      html += '<div class="prayer-item' + activeClass + '">' +
        '<span class="prayer-name"><i class="fa-solid ' + items[j].icon + '"></i>' + items[j].name + '</span>' +
        '<span class="prayer-time">' + timeVal + '</span>' +
      '</div>';
    }
    html += '<div class="prayer-item night' + midnightActive + '">' +
      '<span class="prayer-name"><i class="fa-solid fa-clock"></i>نیمه‌شب</span>' +
      '<span class="prayer-time">' + (midnight || '--:--') + '</span>' +
    '</div>';
    box.innerHTML = html;
  }

  function fetchPrayers(){
    var now = new Date();
    var d = String(now.getDate()).padStart(2, '0');
    var m = String(now.getMonth() + 1).padStart(2, '0');
    var y = now.getFullYear();
    var url = 'https://api.aladhan.com/v1/timingsByCity/' + d + '-' + m + '-' + y + '?city=Ardabil&country=Iran&method=7';
    fetch(url)
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data && data.code === 200 && data.data && data.data.timings){
          renderPrayers(data.data.timings, data.data.date && data.data.date.hijri);
        } else {
          var box = document.getElementById('prayerList');
          if(box) box.innerHTML = '<div class="prayer-loading">خطا در دریافت اطلاعات</div>';
        }
      })
      .catch(function(){
        var box = document.getElementById('prayerList');
        if(box) box.innerHTML = '<div class="prayer-loading">اتصال اینترنت را بررسی کنید</div>';
      });
  }

  function initBanner(){
    var track = document.getElementById('bannerTrack');
    if(!track) return;
    var strips = Array.prototype.slice.call(track.querySelectorAll('.banner-strip'));
    if(strips.length === 0) return;

    strips.sort(function(){ return Math.random() - 0.5; });

    track.innerHTML = '';
    var fragment = document.createDocumentFragment();
    for(var i = 0; i < strips.length; i++){
      var s = strips[i];
      s.style.animationDelay = (i * 0.08) + 's';
      fragment.appendChild(s);
    }
    track.appendChild(fragment);

    setTimeout(function(){
      var stripWidth = strips[0].offsetWidth;
      var gap = 5;
      if(stripWidth === 0) return;
      var step = stripWidth + gap;
      var totalWidth = step * strips.length;

      var cloneFragment = document.createDocumentFragment();
      for(var i = 0; i < strips.length; i++){
        var clone = strips[i].cloneNode(true);
        clone.style.animation = 'none';
        clone.style.opacity = '1';
        clone.style.transform = 'none';
        cloneFragment.appendChild(clone);
      }
      track.appendChild(cloneFragment);

      var offset = 0;
      var speed = 0.3;

      function animate(){
        offset += speed;
        if(offset >= totalWidth){
          offset -= totalWidth;
        }
        track.style.transform = 'translateX(' + (totalWidth - offset) + 'px)';
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    }, 700);
  }

  function initContinuousVideo(selector){
    var v = document.querySelector(selector);
    if(!v) return;

    v.muted = true;
    v.defaultMuted = true;
    v.volume = 0;
    v.loop = true;
    v.playsInline = true;
    v.setAttribute('muted', '');
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');
    v.setAttribute('disablepictureinpicture', '');

    var duration = 0;

    function play(){
      if(!v.paused) return;
      try{
        var p = v.play();
        if(p && p.catch) p.catch(function(){});
      }catch(e){}
    }

    v.addEventListener('loadedmetadata', function(){
      duration = v.duration || 0;
      play();
    });

    v.addEventListener('timeupdate', function(){
      if(duration > 0 && v.currentTime >= duration - 0.2){
        try{ v.currentTime = 0; }catch(e){}
        play();
      }
    });

    ['pause','stalled','waiting','suspend','abort','emptied'].forEach(function(ev){
      v.addEventListener(ev, function(){
        setTimeout(play, 50);
      });
    });

    v.addEventListener('ended', function(){
      try{ v.currentTime = 0; }catch(e){}
      play();
    });

    document.addEventListener('visibilitychange', function(){
      if(!document.hidden) play();
    });

    window.addEventListener('focus', play);
    window.addEventListener('pageshow', play);
    window.addEventListener('touchstart', play, {passive:true});
    window.addEventListener('scroll', play, {passive:true});

    setInterval(play, 250);

    play();
  }

  function initClock(){
    var clock = document.getElementById('tgClock');
    if(!clock) return;
    function update(){
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      var hh = h < 10 ? '0' + h : String(h);
      var mm = m < 10 ? '0' + m : String(m);
      clock.textContent = hh + ':' + mm;
    }
    update();
    setInterval(update, 30000);
  }

  function initQuickLinks(){
    var container = document.getElementById('tgLinks');
    if(!container) return;

    var allLinks = [
      {text:'مراسمات آتی', href:'../event/'},
      {text:'جدیدترین سرویس‌ها', href:'../service/'},
      {text:'سرویس شهدا', href:'../service/martyrs/'},
      {text:'درباره ما', href:'../library/about/'},
      {text:'ارتباط با ما', href:'../library/connect/'},
      {text:'مطالعه در کتابخانه', href:'../library/'},
      {text:'آخرین اطلاعیه‌ها', href:'../notif/'},
      {text:'پروفایل من', href:'../profile/'}
    ];

    var shuffled = allLinks.slice().sort(function(){ return Math.random() - 0.5; });
    var selected = shuffled.slice(0, 3);

    container.innerHTML = '';
    selected.forEach(function(item){
      var a = document.createElement('a');
      a.className = 'tg-link';
      a.textContent = item.text;
      a.addEventListener('click', function(){
        window.location.href = item.href;
      });
      container.appendChild(a);
    });
  }

  function initMartyrMessage(){
    var API_URL = window.API_URL || '';
    var loadingEl = document.getElementById('martyrLoading');
    var msgEl = document.getElementById('martyrMessage');
    var refreshBtn = document.getElementById('martyrRefresh');
    var refreshIcon = refreshBtn ? refreshBtn.querySelector('i') : null;

    var allMessages = [];
    var martyrsCache = {};
    var currentIndex = -1;

    function hideLoading(){
      if(loadingEl) loadingEl.classList.add('hide');
    }

    function renderMessage(r){
      var nameEl = document.getElementById('martyrName');
      var dateEl = document.getElementById('martyrDate');
      var photoEl = document.getElementById('martyrPhoto');

      var martyr = martyrsCache[r.martyrId] || null;

      if(nameEl) nameEl.textContent = (martyr && martyr.name ? martyr.name : 'شهید') + ':';
      if(msgEl) msgEl.textContent = r.message || '';
      if(dateEl) dateEl.textContent = r.date || '';

      if(photoEl){
        if(martyr && martyr.image){
          photoEl.style.display = '';
          photoEl.src = martyr.image;
        } else {
          photoEl.style.display = 'none';
        }
      }
    }

    function pickRandom(){
      if(allMessages.length === 0) return null;
      if(allMessages.length === 1) return allMessages[0];
      var idx;
      do{
        idx = Math.floor(Math.random() * allMessages.length);
      } while(idx === currentIndex);
      currentIndex = idx;
      return allMessages[idx];
    }

    function showNext(){
      var r = pickRandom();
      if(r) renderMessage(r);
    }

    if(!API_URL){
      if(msgEl) msgEl.textContent = 'خطا در اتصال';
      hideLoading();
      return;
    }

    Promise.all([
      fetch(API_URL + '?action=getMartyrMessages&t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }),
      fetch(API_URL + '?action=getMartyrs&t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); })
    ])
      .then(function(results){
        var msgData = results[0];
        var martyrData = results[1];

        if(martyrData && martyrData.success && Array.isArray(martyrData.data)){
          martyrData.data.forEach(function(m){
            martyrsCache[String(m.id)] = m;
          });
        }

        if(!msgData || !msgData.success || !Array.isArray(msgData.data) || msgData.data.length === 0){
          if(msgEl) msgEl.textContent = 'پیامی موجود نیست';
          hideLoading();
          return;
        }

        allMessages = msgData.data;
        showNext();
        hideLoading();
      })
      .catch(function(){
        if(msgEl) msgEl.textContent = 'خطا در دریافت پیام';
        hideLoading();
      });

    if(refreshBtn){
      refreshBtn.addEventListener('click', function(){
        if(allMessages.length === 0) return;
        if(refreshIcon){
          refreshBtn.classList.add('spinning');
          setTimeout(function(){
            refreshBtn.classList.remove('spinning');
          }, 800);
        }
        showNext();
      });
    }
  }

  function start(){
    var now = new Date();
    var shamsi = toShamsi(now.getFullYear(), now.getMonth() + 1, now.getDate());
    currentMonth = shamsi.month;
    currentYear = shamsi.year;
    buildCalendar();
    buildStars('calendarStars', 6);
    buildStars('prayerStars', 6);
    fetchPrayers();
    document.getElementById('btnPrevMonth').addEventListener('click', function(){ changeMonth(-1); });
    document.getElementById('btnNextMonth').addEventListener('click', function(){ changeMonth(1); });
    setInterval(fetchPrayers, 60 * 60 * 1000);
    initBanner();
    initContinuousVideo('.welcome-video');
    initContinuousVideo('.martyr-video');
    initClock();
    initQuickLinks();
    initMartyrMessage();
  }

  start();

})();
</script>
