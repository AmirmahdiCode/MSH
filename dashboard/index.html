<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شهدای گمنام شورابیل</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
.main{
  position:relative;
  z-index:5;
  padding:0;
  min-height:100vh;
}

.banner{
  position:relative;
  width:100%;
  height:280px;
  margin-top:67px;
  overflow:hidden;
  animation:bannerEnter .9s ease;
  -webkit-mask-image:linear-gradient(to bottom,
    black 0%,
    black 71.4%,
    rgba(0,0,0,.99) 74%,
    rgba(0,0,0,.96) 77%,
    rgba(0,0,0,.92) 80%,
    rgba(0,0,0,.86) 83%,
    rgba(0,0,0,.78) 86%,
    rgba(0,0,0,.68) 89%,
    rgba(0,0,0,.56) 92%,
    rgba(0,0,0,.42) 95%,
    rgba(0,0,0,.25) 98%,
    transparent 100%);
  mask-image:linear-gradient(to bottom,
    black 0%,
    black 71.4%,
    rgba(0,0,0,.99) 74%,
    rgba(0,0,0,.96) 77%,
    rgba(0,0,0,.92) 80%,
    rgba(0,0,0,.86) 83%,
    rgba(0,0,0,.78) 86%,
    rgba(0,0,0,.68) 89%,
    rgba(0,0,0,.56) 92%,
    rgba(0,0,0,.42) 95%,
    rgba(0,0,0,.25) 98%,
    transparent 100%);
}

@keyframes bannerEnter{
  0%{opacity:0;transform:scale(1.03) translateY(10px);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}

.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 15%;
  display:block;
}
</style>
</head>
<body data-season="normal" data-theme="light">

<div class="bg-orbs">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>

<header class="header">
  <img src="../images/logo.png" alt="لوگو" class="header-logo">
  <div class="header-text">
    <div class="header-title">شهدای گمنام شورابیل</div>
    <div class="header-subtitle">سایت رسمی شهدای گمنام شورابیل</div>
  </div>
</header>

<div class="header-sub">
  <div class="sub-profile" id="subProfile" data-href="../profile/new/">
    <div class="profile-avatar"><i class="fa-solid fa-user-plus fa-jello"></i></div>
    <span class="profile-name">ثبت پروفایل</span>
  </div>

  <div class="sub-notif" id="subNotif" data-href="../notif/">
    <i class="fa-solid fa-bell fa-swing"></i>
    <span>اعلان‌ها</span>
    <span class="badge">3</span>
  </div>

  <div class="sub-actions">
    <button class="icon-btn" id="btnMusic" aria-label="موسیقی">
      <i class="fa-solid fa-music fa-jello"></i>
    </button>
    <button class="icon-btn" id="btnTheme" aria-label="تغییر تم">
      <i class="fa-solid fa-moon fa-flip-360"></i>
    </button>
  </div>
</div>

<main class="main">
  <div class="banner">
    <img src="../images/poster.png" alt="بنر" draggable="false">
  </div>
</main>

<footer class="footer">
  <button class="nav-item active" data-href="index.html">
    <i class="fa-solid fa-house"></i>
    <span>خانه</span>
  </button>
  <button class="nav-item" data-href="../service/">
    <i class="fa-solid fa-screwdriver-wrench"></i>
    <span>سرویس</span>
  </button>
  <button class="nav-item" data-href="../event/">
    <i class="fa-solid fa-calendar"></i>
    <span>رویداد</span>
  </button>
  <button class="nav-item" data-href="../library/">
    <i class="fa-solid fa-book-bookmark"></i>
    <span>کتابخانه</span>
  </button>
  <button class="nav-item" data-href="../profile/">
    <i class="fa-solid fa-user"></i>
    <span>پروفایل</span>
  </button>
</footer>

<script src="../script.js"></script>
</body>
</html>
