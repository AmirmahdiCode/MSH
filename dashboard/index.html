<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=7">
<style>
.main{position:relative;z-index:5;padding:0 12px 110px;min-height:100vh;}
.banner{position:relative;width:calc(100% + 24px);margin-right:-12px;height:280px;margin-top:118px;overflow:hidden;animation:bannerEnter .9s ease;
  -webkit-mask-image:linear-gradient(to bottom,black 0%,black 85%,rgba(0,0,0,.95) 89%,rgba(0,0,0,.85) 93%,rgba(0,0,0,.6) 96%,rgba(0,0,0,.3) 98%,transparent 100%);
  mask-image:linear-gradient(to bottom,black 0%,black 85%,rgba(0,0,0,.95) 89%,rgba(0,0,0,.85) 93%,rgba(0,0,0,.6) 96%,rgba(0,0,0,.3) 98%,transparent 100%);}
@keyframes bannerEnter{0%{opacity:0;transform:scale(1.03) translateY(10px);}100%{opacity:1;transform:scale(1) translateY(0);}}
.banner-track{display:flex;gap:5px;height:100%;will-change:transform;padding:0 5px;}
.banner-strip{flex:0 0 auto;height:100%;width:150px;overflow:hidden;border-radius:14px;opacity:0;transform:translateX(30px);animation:stripIn .6s cubic-bezier(.2,.8,.2,1) forwards;}
.banner-strip img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;}
@keyframes stripIn{0%{opacity:0;transform:translateX(30px);}100%{opacity:1;transform:translateX(0);}}
.top-row{display:flex;gap:10px;margin-top:-55px;position:relative;z-index:10;animation:cardEnter .8s cubic-bezier(.2,.8,.2,1) .4s backwards;}
@keyframes cardEnter{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.glass-card{position:relative;background:rgba(255,255,255,.55);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-border);border-radius:24px;box-shadow:var(--glass-shadow);overflow:hidden;transition:background .5s ease,border .5s ease;}
[data-theme="dark"] .glass-card{background:rgba(50,50,50,.55);border:1px solid rgba(255,255,255,.12);}
.shooting-star-container{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.shooting-star{position:absolute;width:2px;height:60px;background:linear-gradient(to bottom,rgba(47,168,125,.6),transparent);border-radius:50%;animation:shootingStar 2s linear infinite;opacity:0;}
[data-theme="dark"] .shooting-star{background:linear-gradient(to bottom,rgba(255,255,255,.55),transparent);}
@keyframes shootingStar{0%{transform:translateX(0) translateY(0) rotate(-35deg);opacity:0;}10%{opacity:1;}70%{opacity:1;}100%{transform:translateX(-250px) translateY(320px) rotate(-35deg);opacity:0;}}
.calendar-section{flex:0 0 calc(48% - 5px);padding:12px 10px;}
.calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;position:relative;z-index:1;}
.calendar-nav{width:26px;height:26px;border-radius:8px;border:1px solid var(--glass-border);background:rgba(255,255,255,.3);cursor:pointer;font-size:11px;color:var(--accent);display:flex;align-items:center;justify-content:center;transition:all .2s ease;font-family:var(--font);}
[data-theme="dark"] .calendar-nav{background:rgba(255,255,255,.06);}
.calendar-nav:hover{background:var(--accent-bg);}
.calendar-nav:active{transform:scale(.9);}
.calendar-month-title{font-size:12px;font-weight:800;color:var(--text);user-select:none;}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;position:relative;z-index:1;}
.calendar-day{text-align:center;padding:4px 1px;border-radius:8px;font-size:10px;cursor:pointer;transition:all .2s ease;position:relative;color:var(--text);min-height:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid transparent;}
.calendar-day:hover{background:var(--accent-bg);border-color:var(--accent-line);}
.calendar-day.today{background:var(--accent);color:#fff;font-weight:800;box-shadow:0 0 10px var(--accent-glow);}
.prayer-section{flex:0 0 calc(52% - 5px);padding:12px 10px;}
.prayer-title{font-size:12px;font-weight:800;color:var(--text);margin-bottom:6px;text-align:center;position:relative;z-index:1;}
.prayer-date{grid-column:1 / -1;text-align:center;font-size:9px;font-weight:600;color:var(--text-soft);margin-bottom:6px;position:relative;z-index:1;padding:5px 6px;background:rgba(255,255,255,.3);border-radius:8px;border:1px solid var(--glass-border);}
[data-theme="dark"] .prayer-date{background:rgba(255,255,255,.06);}
.prayer-list{display:grid;grid-template-columns:1fr 1fr;gap:4px;position:relative;z-index:1;}
.prayer-item{display:flex;justify-content:space-between;align-items:center;padding:5px 7px;border-radius:8px;background:rgba(255,255,255,.3);transition:all .3s ease;border:1px solid transparent;font-size:9px;}
[data-theme="dark"] .prayer-item{background:rgba(255,255,255,.06);}
.prayer-item.next{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow);}
.prayer-item.next .prayer-name,.prayer-item.next .prayer-time,.prayer-item.next .prayer-name i{color:#fff;}
.prayer-item.night{grid-column:1 / -1;justify-content:center;gap:10px;}
.prayer-name{font-size:9px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:3px;}
.prayer-name i{font-size:10px;color:var(--accent);}
.prayer-time{font-size:9px;font-weight:800;color:var(--accent);direction:ltr;}
.prayer-loading{grid-column:1 / -1;text-align:center;font-size:10px;color:var(--text-soft);padding:20px 0;}

/* پیام خوش‌آمد */
.welcome-block{
  margin-top:16px;
  display:flex;
  flex-direction:column;
  gap:8px;
  opacity:0;
  transform:translateY(30px);
  transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1);
  position:relative;
  z-index:10;
}

.welcome-block.show{
  opacity:1;
  transform:translateY(0);
}

.duck-sticker{
  width:100px;
  height:100px;
  align-self:flex-start;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transform:scale(.5) rotate(-20deg);
  transition:all .6s cubic-bezier(.34,1.56,.64,1) .2s;
}

.welcome-block.show .duck-sticker{
  opacity:1;
  transform:scale(1) rotate(0);
}

.duck-svg{
  width:100%;
  height:100%;
  animation:duckBob 2s ease-in-out infinite;
}

@keyframes duckBob{
  0%,100%{transform:translateY(0) rotate(-3deg);}
  50%{transform:translateY(-6px) rotate(3deg);}
}

.msg-bubble{
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-border);
  border-radius:20px 20px 20px 6px;
  box-shadow:var(--glass-shadow);
  padding:14px 16px;
  max-width:100%;
  position:relative;
  animation:msgPop .5s cubic-bezier(.34,1.56,.64,1) .5s backwards;
}

[data-theme="dark"] .msg-bubble{
  background:rgba(50,50,50,.65);
  border:1px solid rgba(255,255,255,.12);
}

@keyframes msgPop{
  0%{opacity:0;transform:scale(.85) translateY(10px);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}

.msg-bubble::before{
  content:'';
  position:absolute;
  bottom:0;
  right:-6px;
  width:14px;
  height:14px;
  background:inherit;
  border-right:1px solid var(--glass-border);
  border-bottom:1px solid var(--glass-border);
  border-radius:0 0 14px 0;
  clip-path:polygon(0 0,100% 0,0 100%);
}

.msg-text{
  font-size:12.5px;
  font-weight:600;
  color:var(--text);
  line-height:1.9;
  margin-bottom:12px;
}

.msg-text .highlight{
  color:var(--accent);
  font-weight:800;
}

.msg-links{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:4px;
  padding-top:10px;
  border-top:1px dashed var(--glass-border);
}

.msg-link{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  border-radius:10px;
  background:rgba(255,255,255,.4);
  border:1px solid var(--glass-border);
  text-decoration:none;
  color:var(--text);
  font-size:11.5px;
  font-weight:700;
  transition:all .25s ease;
  cursor:pointer;
  font-family:var(--font);
}

[data-theme="dark"] .msg-link{
  background:rgba(255,255,255,.06);
}

.msg-link:hover{
  background:var(--accent-bg);
  border-color:var(--accent-line);
  transform:translateX(-3px);
}

.msg-link:active{
  transform:scale(.97);
}

.msg-link-icon{
  width:26px;
  height:26px;
  border-radius:8px;
  background:var(--accent-bg);
  border:1px solid var(--accent-line);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--accent);
  font-size:12px;
  flex-shrink:0;
}

.msg-link-text{
  flex:1;
  color:var(--text);
}

.msg-link-arrow{
  color:var(--accent);
  font-size:10px;
  opacity:.6;
}

@media (max-width:400px){
  .top-row{gap:8px;}
  .calendar-section{padding:10px 8px;}
  .prayer-section{padding:10px 8px;}
  .calendar-month-title{font-size:11px;}
  .calendar-day{font-size:9px;min-height:24px;padding:2px 0;}
  .prayer-item{font-size:8px;padding:4px 5px;}
  .prayer-name{font-size:8px;}
  .prayer-name i{font-size:9px;}
  .prayer-time{font-size:8px;}
  .header-title{font-size:12px;}
  .duck-sticker{width:80px;height:80px;}
  .msg-text{font-size:11.5px;}
}
</style>

<script>
(function(){
  'use strict';

  var mahHa = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  var mahFeli = 0;
  var salFeli = 0;

  function tabdilMiladiBeShamsi(gy, gm, gd){
    var g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
    var jy = gy <= 1600 ? 0 : 979;
    gy -= gy <= 1600 ? 621 : 1600;
    var gy2 = gm > 2 ? gy + 1 : gy;
    var days = 365 * gy + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
    var jy2 = jy + 33 * Math.floor(days / 12053);
    days %= 12053;
    jy2 += 4 * Math.floor(days / 1461);
    days %= 1461;
    if(days > 365){jy2 += Math.floor((days - 1) / 365); days = (days - 1) % 365;}
    var jm = days < 186 ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
    var jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
    return {year:jy2, month:jm, day:jd};
  }

  function roozHayMah(sal, mah){
    if(mah <= 6) return 31;
    if(mah <= 11) return 30;
    return ((sal - 1) % 4 === 3) ? 30 : 29;
  }

  function sakhtanSetareha(containerId, tedad){
    var container = document.getElementById(containerId);
    if(!container) return;
    container.innerHTML = '';
    for(var i = 0; i < tedad; i++){
      var s = document.createElement('div');
      s.className = 'shooting-star';
      s.style.left = (Math.random() * 90) + '%';
      s.style.top = (Math.random() * 60) + '%';
      s.style.animationDelay = (Math.random() * 3) + 's';
      s.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
      container.appendChild(s);
    }
  }

  function sakhtanTaghvim(){
    var titleEl = document.getElementById('calendarTitle');
    var gridEl = document.getElementById('calendarGrid');
    if(!titleEl || !gridEl) return;
    titleEl.textContent = mahHa[mahFeli - 1] + ' ' + salFeli;
    var emroozMiladi = new Date();
    var emrooz = tabdilMiladiBeShamsi(emroozMiladi.getFullYear(), emroozMiladi.getMonth() + 1, emroozMiladi.getDate());
    var roozHa = roozHayMah(salFeli, mahFeli);
    var html = '';
    for(var d = 1; d <= roozHa; d++){
      var isToday = (salFeli === emrooz.year && mahFeli === emrooz.month && d === emrooz.day);
      html += '<div class="calendar-day' + (isToday ? ' today' : '') + '">' + d + '</div>';
    }
    gridEl.innerHTML = html;
  }

  function taghirMah(dir){
    mahFeli += dir;
    if(mahFeli > 12){mahFeli = 1; salFeli++;}
    if(mahFeli < 1){mahFeli = 12; salFeli--;}
    sakhtanTaghvim();
    sakhtanSetareha('calendarStars', 6);
  }

  function namayeshAvaqat(timings, hijri){
    var box = document.getElementById('prayerList');
    if(!box) return;
    var items = [
      {name:'صبح', icon:'fa-cloud-moon', key:'Fajr'},
      {name:'طلوع', icon:'fa-sun', key:'Sunrise'},
      {name:'ظهر', icon:'fa-cloud-sun', key:'Dhuhr'},
      {name:'عصر', icon:'fa-cloud-sun-rain', key:'Asr'},
      {name:'مغرب', icon:'fa-cloud-moon', key:'Maghrib'},
      {name:'عشا', icon:'fa-moon', key:'Isha'}
    ];
    var saatFeli = new Date();
    var daghigheFeli = saatFeli.getHours() * 60 + saatFeli.getMinutes();
    var activeIndex = -1;
    for(var i = 0; i < items.length; i++){
      var t = timings[items[i].key];
      if(!t) continue;
      var p = t.split(':');
      var dg = parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
      if(dg > daghigheFeli){activeIndex = i; break;}
    }
    var midnight = (timings.Midnight || '').split(' ')[0];
    var midnightDg = 9999;
    if(midnight && midnight.indexOf(':') !== -1){
      var mp = midnight.split(':');
      midnightDg = parseInt(mp[0], 10) * 60 + parseInt(mp[1], 10);
    }
    var midnightActive = (activeIndex === -1 && midnightDg > daghigheFeli) ? ' next' : '';
    var tarikhHijri = '';
    if(hijri){tarikhHijri = hijri.weekday.ar + ' - ' + hijri.day + ' ' + hijri.month.ar + ' ' + hijri.year;}
    var html = '<div class="prayer-date">' + (tarikhHijri || '—') + '</div>';
    for(var j = 0; j < items.length; j++){
      var timeVal = (timings[items[j].key] || '--:--').split(' ')[0];
      var activeClass = (j === activeIndex) ? ' next' : '';
      html += '<div class="prayer-item' + activeClass + '">' +
        '<span class="prayer-name"><i class="fa-solid ' + items[j].icon + '"></i>' + items[j].name + '</span>' +
        '<span class="prayer-time">' + timeVal + '</span>' +
      '</div>';
    }
    html += '<div class="prayer-item night' + midnightActive + '">' +
      '<span class="prayer-name"><i class="fa-solid fa-clock"></i>نیمه‌شب</span>' +
      '<span class="prayer-time">' + (midnight || '--:--') + '</span>' +
    '</div>';
    box.innerHTML = html;
  }

  function gereftanAvaqat(){
    var now = new Date();
    var d = String(now.getDate()).padStart(2, '0');
    var m = String(now.getMonth() + 1).padStart(2, '0');
    var y = now.getFullYear();
    var url = 'https://api.aladhan.com/v1/timingsByCity/' + d + '-' + m + '-' + y + '?city=Ardabil&country=Iran&method=7';
    fetch(url)
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data && data.code === 200 && data.data && data.data.timings){
          namayeshAvaqat(data.data.timings, data.data.date && data.data.date.hijri);
        } else {
          var box = document.getElementById('prayerList');
          if(box) box.innerHTML = '<div class="prayer-loading">خطا در دریافت اطلاعات</div>';
        }
      })
      .catch(function(){
        var box = document.getElementById('prayerList');
        if(box) box.innerHTML = '<div class="prayer-loading">اتصال اینترنت را بررسی کنید</div>';
      });
  }

  function راهاندازيبنر(){
    var track = document.getElementById('bannerTrack');
    if(!track) return;
    var strips = Array.prototype.slice.call(track.querySelectorAll('.banner-strip'));
    if(strips.length === 0) return;

    strips.sort(function(){ return Math.random() - 0.5; });

    track.innerHTML = '';
    var fragment = document.createDocumentFragment();
    for(var i = 0; i < strips.length; i++){
      var s = strips[i];
      s.style.animationDelay = (i * 0.08) + 's';
      fragment.appendChild(s);
    }
    track.appendChild(fragment);

    setTimeout(function(){
      var stripWidth = strips[0].offsetWidth;
      var gap = 5;
      if(stripWidth === 0) return;
      var step = stripWidth + gap;
      var totalWidth = step * strips.length;

      var cloneFragment = document.createDocumentFragment();
      for(var i = 0; i < strips.length; i++){
        var clone = strips[i].cloneNode(true);
        clone.style.animation = 'none';
        clone.style.opacity = '1';
        clone.style.transform = 'none';
        cloneFragment.appendChild(clone);
      }
      track.appendChild(cloneFragment);

      var offset = 0;
      var speed = 0.3;

      function animate(){
        offset += speed;
        if(offset >= totalWidth){
          offset -= totalWidth;
        }
        track.style.transform = 'translateX(' + (totalWidth - offset) + 'px)';
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    }, 700);
  }

  function راهاندازيخوشآمد(){
    var block = document.getElementById('welcomeBlock');
    if(!block) return;

    var key = 'shohada_welcome_shown';
    if(sessionStorage.getItem(key) === '1') return;

    var soundPlayed = false;

    function showWelcome(){
      if(block.classList.contains('show')) return;
      block.classList.add('show');
      sessionStorage.setItem(key, '1');

      if(!soundPlayed){
        soundPlayed = true;
        try{
          var audio = new Audio('https://cdn.imgurl.ir/uploads/q55073_Bubbles_Sound.mp3');
          audio.volume = 0.6;
          audio.play().catch(function(){});
        }catch(e){}
      }
    }

    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          setTimeout(showWelcome, 300);
          observer.disconnect();
        }
      });
    }, {threshold: 0.3});

    observer.observe(block);

    window.addEventListener('scroll', function(){
      var rect = block.getBoundingClientRect();
      if(rect.top < window.innerHeight * 0.85){
        setTimeout(showWelcome, 300);
      }
    }, {passive:true});

    block.querySelectorAll('.msg-link').forEach(function(link){
      link.addEventListener('click', function(){
        var href = link.getAttribute('data-href');
        if(href) window.location.href = href;
      });
    });
  }

  function shoroo(){
    var now = new Date();
    var shamsi = tabdilMiladiBeShamsi(now.getFullYear(), now.getMonth() + 1, now.getDate());
    mahFeli = shamsi.month;
    salFeli = shamsi.year;
    sakhtanTaghvim();
    sakhtanSetareha('calendarStars', 6);
    sakhtanSetareha('prayerStars', 6);
    gereftanAvaqat();
    document.getElementById('btnPrevMonth').addEventListener('click', function(){ taghirMah(-1); });
    document.getElementById('btnNextMonth').addEventListener('click', function(){ taghirMah(1); });
    setInterval(gereftanAvaqat, 60 * 60 * 1000);
    راهاندازيبنر();
    راهاندازيخوشآمد();
  }

  shoroo();

})();
</script>
