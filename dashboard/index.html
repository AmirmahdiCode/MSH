<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شهدای گمنام شورابیل</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
.main{
  position:relative;
  z-index:5;
  padding:0 12px 110px;
  min-height:100vh;
}

.banner{
  position:relative;
  width:calc(100% + 24px);
  margin-right:-12px;
  height:280px;
  margin-top:112px;
  overflow:hidden;
  animation:bannerEnter .9s ease;
  -webkit-mask-image:linear-gradient(to bottom,
    black 0%,
    black 71.4%,
    rgba(0,0,0,.99) 74%,
    rgba(0,0,0,.96) 77%,
    rgba(0,0,0,.92) 80%,
    rgba(0,0,0,.86) 83%,
    rgba(0,0,0,.78) 86%,
    rgba(0,0,0,.68) 89%,
    rgba(0,0,0,.56) 92%,
    rgba(0,0,0,.42) 95%,
    rgba(0,0,0,.25) 98%,
    transparent 100%);
  mask-image:linear-gradient(to bottom,
    black 0%,
    black 71.4%,
    rgba(0,0,0,.99) 74%,
    rgba(0,0,0,.96) 77%,
    rgba(0,0,0,.92) 80%,
    rgba(0,0,0,.86) 83%,
    rgba(0,0,0,.78) 86%,
    rgba(0,0,0,.68) 89%,
    rgba(0,0,0,.56) 92%,
    rgba(0,0,0,.42) 95%,
    rgba(0,0,0,.25) 98%,
    transparent 100%);
}

@keyframes bannerEnter{
  0%{opacity:0;transform:scale(1.03) translateY(10px);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}

.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 15%;
  display:block;
}

.calendar-row{
  display:flex;
  gap:10px;
  margin-top:-55px;
  position:relative;
  z-index:10;
  animation:cardEnter .8s cubic-bezier(.2,.8,.2,1) .4s backwards;
}

@keyframes cardEnter{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

.glass-card{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-border);
  border-radius:24px;
  box-shadow:var(--glass-shadow);
  padding:14px 12px;
  transition:background .5s ease,border .5s ease;
}

[data-theme="dark"] .glass-card{
  background:rgba(50,50,50,.55);
  border:1px solid rgba(255,255,255,.12);
}

.calendar-box{
  flex:0 0 calc(45% - 5px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:16px 10px;
  text-align:center;
}

.calendar-weekday{
  font-size:11px;
  font-weight:700;
  color:var(--text-soft);
  letter-spacing:.5px;
}

.calendar-day{
  font-size:44px;
  font-weight:900;
  color:var(--accent);
  line-height:1;
  filter:drop-shadow(0 0 8px var(--accent-glow));
  animation:softFloat 3.5s ease-in-out infinite;
}

.calendar-month{
  font-size:12px;
  font-weight:700;
  color:var(--text);
}

.calendar-year{
  font-size:10px;
  font-weight:600;
  color:var(--text-soft);
}

.calendar-event{
  margin-top:6px;
  font-size:9px;
  font-weight:700;
  color:var(--accent);
  background:var(--accent-bg);
  padding:3px 10px;
  border-radius:10px;
  border:1px solid var(--accent-line);
  display:none;
}

.prayer-box{
  flex:0 0 calc(55% - 5px);
  display:flex;
  flex-direction:column;
  gap:2px;
}

.prayer-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 8px;
  border-radius:10px;
  font-size:10px;
  transition:background .25s ease;
}

.prayer-item:hover{background:var(--accent-bg);}

.prayer-item .prayer-name{
  font-weight:600;
  color:var(--text-soft);
  display:flex;
  align-items:center;
  gap:6px;
}

.prayer-item .prayer-name i{
  font-size:11px;
  color:var(--accent);
  width:14px;
  text-align:center;
}

.prayer-item .prayer-time{
  font-weight:800;
  color:var(--text);
  font-size:11px;
  direction:ltr;
  font-family:'Vazirmatn',Tahoma,sans-serif;
  letter-spacing:.5px;
}

.prayer-item.active{
  background:var(--accent-bg);
}

.prayer-item.active .prayer-name,
.prayer-item.active .prayer-name i,
.prayer-item.active .prayer-time{
  color:var(--accent);
  font-weight:800;
}

.prayer-loading{
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
  font-size:10px;
  color:var(--text-soft);
}

@media (max-width:380px){
  .calendar-day{font-size:36px;}
  .prayer-item{font-size:9px;padding:5px 6px;}
  .prayer-item .prayer-time{font-size:10px;}
}
</style>
</head>
<body data-season="normal" data-theme="light">

<div class="bg-orbs">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>

<header class="header">
  <img src="../images/logo.png" alt="لوگو" class="header-logo">
  <div class="header-text">
    <div class="header-title">شهدای گمنام شورابیل</div>
    <div class="header-subtitle">سایت رسمی شهدای گمنام شورابیل</div>
  </div>
</header>

<div class="header-sub">
  <div class="sub-profile" id="subProfile" data-href="../profile/new/">
    <div class="profile-avatar"><i class="fa-solid fa-user-plus fa-jello"></i></div>
    <span class="profile-name">ثبت پروفایل</span>
  </div>

  <div class="sub-notif" id="subNotif" data-href="../notif/">
    <i class="fa-solid fa-bell fa-swing"></i>
    <span>اعلان‌ها</span>
    <span class="badge">3</span>
  </div>

  <div class="sub-actions">
    <button class="icon-btn" id="btnMusic" aria-label="موسیقی">
      <i class="fa-solid fa-music fa-jello"></i>
    </button>
    <button class="icon-btn" id="btnTheme" aria-label="تغییر تم">
      <i class="fa-solid fa-moon fa-flip-360"></i>
    </button>
  </div>
</div>

<main class="main">
  <div class="banner">
    <img src="../images/poster.png" alt="بنر" draggable="false">
  </div>

  <div class="calendar-row">
    <div class="glass-card calendar-box">
      <div class="calendar-weekday" id="calWeekday">—</div>
      <div class="calendar-day" id="calDay">—</div>
      <div class="calendar-month" id="calMonth">—</div>
      <div class="calendar-year" id="calYear">—</div>
      <div class="calendar-event" id="calEvent"></div>
    </div>

    <div class="glass-card prayer-box" id="prayerBox">
      <div class="prayer-loading">در حال دریافت اوقات شرعی...</div>
    </div>
  </div>
</main>

<footer class="footer">
  <button class="nav-item active" data-href="index.html">
    <i class="fa-solid fa-house"></i>
    <span>خانه</span>
  </button>
  <button class="nav-item" data-href="../service/">
    <i class="fa-solid fa-screwdriver-wrench"></i>
    <span>سرویس</span>
  </button>
  <button class="nav-item" data-href="../event/">
    <i class="fa-solid fa-calendar"></i>
    <span>رویداد</span>
  </button>
  <button class="nav-item" data-href="../library/">
    <i class="fa-solid fa-book-bookmark"></i>
    <span>کتابخانه</span>
  </button>
  <button class="nav-item" data-href="../profile/">
    <i class="fa-solid fa-user"></i>
    <span>پروفایل</span>
  </button>
</footer>

<script src="../script.js"></script>
<script>
(function(){
  'use strict';

  var mahFinglish = [
    'فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور',
    'مهر','آبان','آذر','دی','بهمن','اسفند'
  ];

  var roozFinglish = [
    'یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'
  ];

  function taghirinMatn(id, matn){
    var el = document.getElementById(id);
    if(el) el.textContent = matn;
  }

  function gereftanTarikhShamsi(){
    var now = new Date();
    var y = now.getFullYear();
    var m = now.getMonth() + 1;
    var d = now.getDate();
    var url = 'https://api.aladhan.com/v1/gToH?date=' + y + '-' + m + '-' + d;

    fetch(url)
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data && data.code === 200 && data.data && data.data.hijri){
          var h = data.data.hijri;
          taghirinMatn('calDay', h.day);
          taghirinMatn('calMonth', h.month && h.month.ar ? h.month.ar : '');
          taghirinMatn('calYear', h.year + ' هـ.ق');
        }
      })
      .catch(function(){
        taghirinMatn('calDay', '—');
      });

    var roozIndex = now.getDay();
    var roozFarsi = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'][roozIndex];
    taghirinMatn('calWeekday', roozFarsi);
  }

  function namayeshAvaqat(data){
    var box = document.getElementById('prayerBox');
    if(!box || !data) return;

    var items = [
      {name:'اذان صبح', icon:'fa-cloud-moon',    key:'Fajr'},
      {name:'طلوع آفتاب', icon:'fa-sun',          key:'Sunrise'},
      {name:'اذان ظهر', icon:'fa-sun',           key:'Dhuhr'},
      {name:'اذان عصر', icon:'fa-cloud-sun',     key:'Asr'},
      {name:'اذان مغرب', icon:'fa-cloud-moon',   key:'Maghrib'},
      {name:'اذان عشا', icon:'fa-moon',          key:'Isha'},
      {name:'نیمه‌شب', icon:'fa-star',           key:'Midnight'}
    ];

    var saatFeli = new Date();
    var daghigheFeli = saatFeli.getHours() * 60 + saatFeli.getMinutes();
    var activeIndex = -1;

    for(var i = 0; i < items.length; i++){
      var t = data[items[i].key];
      if(!t) continue;
      var parts = t.split(':');
      var daghighe = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
      if(daghighe <= daghigheFeli) activeIndex = i;
    }

    var html = '';
    for(var j = 0; j < items.length; j++){
      var timeVal = data[items[j].key] || '—';
      var activeClass = (j === activeIndex) ? ' active' : '';
      html += '<div class="prayer-item' + activeClass + '">' +
        '<span class="prayer-name"><i class="fa-solid ' + items[j].icon + '"></i>' + items[j].name + '</span>' +
        '<span class="prayer-time">' + timeVal + '</span>' +
      '</div>';
    }
    box.innerHTML = html;
  }

  function gereftanAvaqat(){
    var url = 'https://api.aladhan.com/v1/timingsByCity?city=Ardabil&country=Iran&method=7';
    fetch(url)
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data && data.code === 200 && data.data && data.data.timings){
          namayeshAvaqat(data.data.timings);
        } else {
          var box = document.getElementById('prayerBox');
          if(box) box.innerHTML = '<div class="prayer-loading">خطا در دریافت اطلاعات</div>';
        }
      })
      .catch(function(){
        var box = document.getElementById('prayerBox');
        if(box) box.innerHTML = '<div class="prayer-loading">اتصال اینترنت را بررسی کنید</div>';
      });
  }

  gereftanTarikhShamsi();
  gereftanAvaqat();

  setInterval(gereftanAvaqat, 60 * 60 * 1000);

})();
</script>
</body>
</html>
